The other options all raise current gradually and would trip on the thermal element, not instantly.`,source:c.todo("Confirm the breaker trip discussion against your service text."),status:"draft"},bl={...M,id:"hvac.10.1.ask-the-customer",objective:"10.1",kind:"multi",difficulty:2,prompt:"Which questions to the customer genuinely narrow the diagnosis before you touch anything? Select all that apply.",choices:["When did it start, and did anything change around then?","Is it constant, or worse at certain times of day?","Has anyone else worked on it recently?","What temperature do you keep it at in winter?"],answers:[0,1,2],explain:`The first three are free information that eliminates whole families of cause.

"It started after the storm" suggests electrical damage. "Only in the afternoon" suggests something load- or heat-related — a marginal capacitor, a condenser that cannot cope on a hot day. "Someone was out last month" raises non-condensables, a wrong charge, or a part fitted incorrectly.

The winter setpoint tells you nothing about a summer cooling fault. The skill is asking questions whose answers change what you do next.`,source:c.todo("Confirm the customer interview discussion against your service text."),status:"draft"},vl={...M,id:"hvac.10.5.trend-detection",objective:"10.5",kind:"choice",difficulty:2,prompt:`Last year's maintenance record shows subcooling at 10°F. This year it reads 6°F, still within the acceptance band.

What should you do?`,choices:["Investigate — a downward trend in subcooling suggests a developing leak, even though the reading still passes","Nothing, since 6°F is within tolerance","Add refrigerant to bring it back to 10°F","Note it and check again next year"],answer:0,explain:`A single reading tells you whether a system is inside its bands. Two readings a year apart tell you which **direction** it is heading, and that is far more useful.

Subcooling drifting from 10°F to 6°F is refrigerant leaving the system. It still passes today, and it will not pass in August when the customer needs it most.

Adding refrigerant without finding the leak treats the number instead of the cause — and puts you back next season. This is exactly what documentation is for.`,source:c.todo("Confirm the trend analysis discussion against your service text."),status:"draft"},kl=[ol,sl,bl,nl,pl,ml,rl,cl,fl,gl,ll,wl,yl,hl,dl,vl,ul],G={track:"hvac",domain:"1.0"},Tl={...G,id:"hvac.1.1.f-to-c",objective:"1.1",kind:"input",difficulty:1,prompt:"Convert 95°F to Celsius.",placeholder:"°C",accept:["35"],tolerance:1,explain:`°C = (°F − 32) × 5/9 = (95 − 32) × 5/9 = 63 × 0.5556 = **35°C**.

Two anchors worth carrying: 32°F = 0°C (water freezes) and 212°F = 100°C (water boils at sea level). −40 is the same in both scales, which is a useful sanity check on the arithmetic.`,source:c.standard("°C = (°F − 32) × 5/9"),status:"verified"},xl={...G,id:"hvac.1.1.rankine",objective:"1.1",kind:"choice",difficulty:3,prompt:"Why do thermodynamic calculations use absolute temperature scales like Rankine or Kelvin?",choices:['Ratios only make sense from a true zero — 100°F is not "twice as hot" as 50°F',"They are more precise than Fahrenheit","They avoid negative numbers in cold weather","They are required by code"],answer:0,explain:`Fahrenheit and Celsius have arbitrary zero points, so their numbers cannot be multiplied or divided meaningfully. 100°F is not twice the thermal energy of 50°F.

Rankine starts at absolute zero: °R = °F + 459.67. Now ratios work, which is what gas law and psychrometric calculations need.

You will meet it in the psychrometric equations, where temperature always appears as °R.`,source:c.standard("°R = °F + 459.67"),status:"verified"},Cl={...G,id:"hvac.1.2.superheat-is-sensible",objective:"1.2",kind:"choice",difficulty:3,prompt:`Refrigerant has fully boiled in the evaporator and continues absorbing heat.

What kind of heat is it picking up now?`,choices:["Sensible heat — it is a vapour warming above its saturation temperature","Latent heat, because it is still in the evaporator","Both equally","Neither; a fully boiled vapour absorbs no more heat"],answer:0,explain:`Latent heat is spent on the change of state. Once the last liquid has boiled, there is no more state to change — further heat simply raises the vapour temperature, which is sensible heat.

That temperature rise above saturation is exactly what **superheat** measures. Naming it this way makes the point clear: superheat is the sensible portion at the end of an otherwise latent process, and it is far less effective at moving heat, which is why a high superheat means wasted coil.`,source:c.standard("Sensible vs. latent heat — standard thermodynamics"),status:"verified"},Al={...G,id:"hvac.1.2.water-heating-calc",objective:"1.2",kind:"input",difficulty:2,prompt:`How much heat is needed to raise 40 pounds of water from 60°F to 140°F?

Answer in BTU.`,placeholder:"BTU",accept:["3200"],tolerance:60,explain:`Q = mass × specific heat × ΔT = 40 × 1.0 × (140 − 60) = 40 × 80 = **3,200 BTU**.

Water's specific heat is 1.0 BTU/lb·°F by definition, which makes it the easiest of these to compute — the mass and the temperature change are all you need.

This is the same arithmetic behind the hydronic formula, Q = 500 × GPM × ΔT. The 500 just converts gallons per minute into pounds per hour.`,source:c.standard("Q = m × c × ΔT"),status:"verified"},Sl={...G,id:"hvac.1.4.why-copper",objective:"1.4",kind:"choice",difficulty:2,prompt:"Why are evaporator and condenser coils made of copper and aluminium rather than steel?",choices:["Both conduct heat far better than steel, so less surface area is needed","They are cheaper than steel","They resist corrosion better in all conditions","They are lighter, which matters for shipping"],answer:0,explain:`A coil exists to move heat through a wall as fast as possible. Copper conducts heat roughly eight times better than steel, and aluminium about four times better.

Better conduction means a smaller, cheaper coil for the same capacity — which more than pays back the higher material cost.

This is also why dirt, oil film and scale hurt so much: every layer is thermal resistance in series with a wall that was engineered to have as little as possible.`,source:c.todo("Confirm thermal conductivity values against your text."),status:"draft"},Rl={...G,id:"hvac.1.5.manifold-ports",objective:"1.5",kind:"match",difficulty:2,prompt:"Match each manifold gauge set connection to what it does.",pairs:[["Blue, low side","Connects to the suction service valve"],["Red, high side","Connects to the liquid or discharge service valve"],["Yellow, centre","Goes to the vacuum pump, refrigerant cylinder or recovery machine"],["Hand valves","Open or isolate the centre port from each side"]],explain:`The two gauges read continuously whether the hand valves are open or shut — the valves only control whether the centre hose is connected to that side.

That is why you can take readings with both hand valves closed, and why leaving one open while changing a cylinder can dump refrigerant or draw air in.

Modern digital manifolds add pressure transducers and thermistors and compute superheat and subcooling for you, but the plumbing is identical.`,source:c.todo("Confirm the manifold description against your text."),status:"draft"},Fl={...G,id:"hvac.1.5.insulate-the-probe",objective:"1.5",kind:"choice",difficulty:3,prompt:"Why must a clamp thermocouple on a suction line be insulated from the surrounding air?",choices:["Ambient air warms the probe, so an uninsulated reading overstates superheat","Insulation protects the probe from mechanical damage","It stops condensation shorting the thermocouple","It keeps the probe from cooling the refrigerant"],answer:0,explain:`A suction line on a hot day might be 50°F while the air around it is 95°F. An exposed probe sits between the two and reads somewhere in the middle — too warm.

Since superheat is line temperature minus saturation temperature, an inflated line temperature inflates superheat directly. A few degrees of error is enough to push a correctly charged system into looking undercharged, and then somebody adds refrigerant.

Clean contact with the pipe, a proper clamp, and insulation taped over the top of it.`,source:c.todo("Confirm measurement technique against your text."),status:"draft"},ql={...G,id:"hvac.1.6.ppe-for-refrigerant",objective:"1.6",kind:"multi",difficulty:1,prompt:"What PPE should you wear when connecting or disconnecting refrigerant hoses? Select all that apply.",choices:["Safety glasses or goggles","Gloves rated for cold","A hard hat","Closed-toe footwear"],answers:[0,1,3],explain:`Liquid refrigerant boiling on skin causes instant frostbite, and a spray to the eyes can cause permanent damage. Eye protection and gloves are the two that address the actual hazard of this task; footwear is basic site sense.

A hard hat is required in plenty of environments but it is not what protects you from refrigerant. The point of PPE selection is matching the protection to the hazard, not wearing everything you own.`,source:c.todo("Confirm PPE requirements against your safety text and site policy."),status:"draft"},$l={...G,id:"hvac.1.6.working-at-height",objective:"1.6",kind:"choice",difficulty:2,prompt:"You are setting an extension ladder to reach a rooftop unit. What is the correct angle rule?",choices:["Roughly 4 to 1 — base out one foot for every four feet of working height","As steep as possible for stability","Roughly 2 to 1","Angle does not matter if the ladder is tied off"],answer:0,explain:`The 4:1 rule puts the ladder at about 75 degrees. Steeper and it tips backwards; shallower and the base slides out.

For roof access the ladder should also extend at least three feet above the landing so there is something to hold while stepping off, and it should be secured at the top.

Falls are among the most common serious injuries in this trade, and rooftop units mean you will be doing this constantly.`,source:c.standard("OSHA 29 CFR 1926.1053 (ladders)"),status:"verified"},Il={...G,id:"hvac.1.6.why-de-energise",objective:"1.6",kind:"choice",difficulty:3,prompt:"Why is de-energising preferred over working live, even when live work seems quicker?",choices:["Shock and arc flash are both eliminated rather than merely mitigated","Meters read more accurately on dead circuits","It is only a preference, not a safety matter","Live work is fine with insulated tools"],answer:0,explain:`An arc flash releases enormous heat and pressure in milliseconds. PPE reduces injury; it does not prevent the event.

De-energising removes the hazard entirely, which is why safe work practice treats live work as something requiring justification rather than a default.

Some diagnostics genuinely require voltage present — measuring across a contactor coil, for instance. Do those deliberately, with the right PPE and the right meter category, and de-energise for everything else.`,source:c.standard("NFPA 70E"),status:"verified"},Ml=[Tl,xl,Cl,Al,Sl,Rl,Fl,ql,$l,Il],_={track:"hvac",domain:"2.0"},Pl={..._,id:"hvac.2.1.compressor-types",objective:"2.1",kind:"match",difficulty:2,prompt:"Match each compressor type to how it works.",pairs:[["Reciprocating","Pistons in cylinders, with suction and discharge valves"],["Scroll","Two interleaved spirals, one orbiting, compressing gas toward the centre"],["Rotary","A roller inside a cylinder, common in small equipment"],["Screw","Meshing helical rotors, used in large commercial plant"]],explain:`Scroll compressors dominate residential equipment now. They have far fewer moving parts than a reciprocating compressor, run more quietly, and tolerate a small amount of liquid better — though "better" is not "safely".

The type matters diagnostically: a reciprocating compressor fails at its valves, which is the classic pressures-converging signature. A scroll more often fails by losing its ability to seal, or seizes outright.`,source:c.todo("Confirm the compressor type descriptions against your text."),status:"draft"},Wl={..._,id:"hvac.2.1.accumulator",objective:"2.1",kind:"choice",difficulty:3,prompt:"What does a suction line accumulator do?",choices:["Catches liquid refrigerant before it reaches the compressor and meters it back slowly","Stores extra refrigerant for high-load conditions","Separates oil from the refrigerant","Reduces suction line noise"],answer:0,explain:`It is a safety device against floodback. Refrigerant entering it drops into a reservoir; only vapour is drawn off the top, through a tube that also picks up a small metered amount of oil so the oil still returns.

You see them most often on heat pumps, because defrost and low-ambient heating both create conditions where liquid can return. Finding one on a system is a hint that the designer expected floodback to be possible.

It buys tolerance, not immunity. Near-zero superheat is still a shut-it-down condition.`,source:c.todo("Confirm the accumulator description against your text."),status:"draft"},El={..._,id:"hvac.2.1.receiver",objective:"2.1",kind:"choice",difficulty:3,prompt:"What is a liquid line receiver for, and where does it sit?",choices:["It stores liquid refrigerant after the condenser, so charge can vary with load","It stores vapour before the compressor","It removes moisture from the liquid line","It reduces liquid line pressure before the metering device"],answer:0,explain:`A receiver sits between the condenser outlet and the metering device, holding a reservoir of liquid. That lets the active charge vary as load changes without starving the metering device.

It has a diagnostic consequence: on a system with a receiver, **subcooling at the condenser outlet is not a reliable charge indicator**, because the receiver decouples the two. Follow the manufacturer's procedure, which usually means sight glass or weighed charge instead.

Most residential split systems have no receiver, which is exactly why subcooling works so well there.`,source:c.todo("Confirm the receiver discussion against your text."),status:"draft"},jl={..._,id:"hvac.2.2.sight-glass-bubbles",objective:"2.2",kind:"choice",difficulty:3,prompt:`A liquid line sight glass shows bubbles on a running system.

What does that indicate?`,choices:["Vapour in the liquid line — insufficient subcooling, a low charge, or a restriction upstream","Normal operation at full charge","Moisture in the system","Oil circulating correctly"],answer:0,explain:`The liquid line should be exactly that: solid liquid. Bubbles mean some has flashed to vapour, which starves the metering device because vapour occupies far more volume.

Causes: not enough subcooling to survive the pressure drop down the line, a genuine undercharge, or a restriction upstream of the glass such as a plugged drier.

The moisture indicator is a separate feature of the same fitting — a colour patch, usually green for dry and yellow for wet. Bubbles and colour are telling you different things.`,source:c.todo("Confirm the sight glass discussion against your text."),status:"draft"},Ol={..._,id:"hvac.2.4.superheat-calc-r22",objective:"2.4",kind:"input",difficulty:2,prompt:`An R-22 system reads 68.5 psig on the low side (≈40°F saturation) and the suction line measures 51°F.

What is the superheat, in °F?`,placeholder:"°F",accept:["11"],tolerance:2,explain:`Superheat = suction line temperature − saturation temperature = 51 − 40 = **11°F**.

That sits inside the 8–12°F band a TXV should hold, so on a TXV system this looks healthy. On a fixed orifice you would compare it against the chart target for the current indoor wet bulb and outdoor dry bulb instead.`,source:c.standard("Arithmetic: 51 − 40"),status:"verified"},Ll={..._,id:"hvac.2.4.what-raises-superheat",objective:"2.4",kind:"multi",difficulty:3,prompt:"Which conditions raise superheat? Select all that apply.",choices:["Undercharge","A restriction in the liquid line","An overcharge","A metering device stuck too far closed"],answers:[0,1,3],explain:`Superheat rises whenever the evaporator is **starved** — not enough refrigerant reaching it to boil across the whole coil.

An undercharge starves it because there is too little in the system. A restriction or a closed-down metering device starves it because flow is throttled.

An overcharge does the opposite: more refrigerant reaches the coil, the boiling point moves further along it, and superheat falls. That is why low superheat with high subcooling is the overcharge signature.`,source:c.todo("Confirm the superheat causes against your service text."),status:"draft"},Nl={..._,id:"hvac.2.5.zero-subcooling",objective:"2.5",kind:"choice",difficulty:3,prompt:"A system measures 0°F of subcooling. What does that mean physically?",choices:["No liquid is stacking in the condenser — refrigerant is leaving it right at saturation","The condenser is completely full of liquid","The liquid line is the same temperature as the outdoor air","The measurement is invalid"],answer:0,explain:`Subcooling counts how far below condensing temperature the liquid has been cooled. Zero means it has not been cooled below saturation at all, which means there is no reservoir of liquid backing up in the condenser.

On a system without a receiver that is a severe undercharge. It also guarantees flash gas: any pressure drop in the liquid line will vaporise some of it, starving the metering device further.

Zero is physically real. A *negative* number means you subtracted the wrong way round.`,source:c.standard("Subcooling definition"),status:"verified"},Hl={..._,id:"hvac.2.6.why-high-eff-tighter-split",objective:"2.6",kind:"choice",difficulty:3,prompt:"Why does a high-efficiency condenser run a tighter split (15–20°F) than a standard one (20–30°F)?",choices:["A larger coil rejects the same heat at a lower temperature difference","It uses a different refrigerant","Its compressor runs cooler","It runs at a lower charge"],answer:0,explain:`Heat transfer is driven by temperature difference times surface area. Give the condenser more surface and it can reject the same heat with a smaller difference — so condensing temperature sits closer to ambient.

That lower condensing temperature is where the efficiency comes from: less head pressure means a smaller compression ratio, which means less power for the same capacity.

Practically: know which kind of unit you are looking at before judging the split. 22°F is fine on a standard unit and a warning sign on a high-efficiency one.`,source:c.todo("Confirm the split range discussion against your service text."),status:"draft"},Dl={..._,id:"hvac.2.6.discharge-temperature",objective:"2.6",kind:"choice",difficulty:3,prompt:`Compressor discharge line temperature is measured at 260°F.

What should you conclude?`,choices:["Too hot — sustained high discharge temperature breaks down oil and damages the compressor","Normal for a hot day","The compressor is running efficiently","Discharge temperature is not a meaningful measurement"],answer:0,explain:`Discharge temperature above roughly 225°F starts breaking down the oil. Past that, the oil carbonises, loses its lubricating film, and the compressor fails — usually months later, with no obvious connection to the cause.

What drives it up: high compression ratio (high head or low suction), high superheat returning to the compressor, or a compressor that is not being cooled by the suction gas as intended.

It is a useful reading precisely because it integrates several problems into one number. High discharge temperature says "something upstream is wrong" even before you know what.`,source:c.todo("Confirm discharge temperature limits against your text and manufacturer data."),status:"draft"},Bl=[Pl,Wl,El,jl,Ol,Ll,Nl,Hl,Dl],Q={track:"hvac",domain:"3.0"},zl={...Q,id:"hvac.3.1.numbering-series",objective:"3.1",kind:"match",difficulty:2,prompt:"Match each refrigerant number series to what it contains.",pairs:[["R-11 to R-59","Methane, ethane and propane derived compounds"],["R-400 series","Zeotropic blends — components with different boiling points"],["R-500 series","Azeotropic blends — behave as a single substance"],["R-700 series","Inorganic compounds, numbered by molecular weight"]],explain:`The 400 versus 500 distinction has a practical consequence. Zeotropic blends have temperature glide and must be charged as liquid, because the components would separate if you drew vapour.

Azeotropic blends behave as one substance, so glide is effectively zero and they can be charged either way.

The 700 series numbering is literal: ammonia has a molecular weight of 17, so it is R-717. Carbon dioxide is 44, so R-744.`,source:c.todo("Confirm the numbering system against your text or ASHRAE Standard 34."),status:"draft"},Vl={...Q,id:"hvac.3.1.temperature-glide",objective:"3.1",kind:"choice",difficulty:3,prompt:"What is temperature glide in a zeotropic blend?",choices:["The temperature changes during evaporation or condensation at constant pressure, so bubble and dew points differ","The refrigerant temperature drifts over the life of the system","The rate at which the coil temperature falls at startup","The difference between suction and discharge temperature"],answer:0,explain:`In a pure refrigerant, boiling happens at one temperature for a given pressure. In a zeotropic blend the more volatile component boils first, so the temperature rises through the process even though pressure is constant.

That means two saturation temperatures for the same pressure: the **bubble point** (where boiling starts) and the **dew point** (where it finishes). Superheat is calculated from the dew point, subcooling from the bubble point.

R-410A has almost no glide, which is why it can be treated with a single P-T column. Blends with significant glide need a P-T chart with both columns, and using the wrong one puts your superheat out by several degrees.`,source:c.todo("Confirm the glide discussion against your text."),status:"draft"},Ul={...Q,id:"hvac.3.2.oil-return",objective:"3.2",kind:"choice",difficulty:3,prompt:"Oil circulates with the refrigerant. What piping detail helps it get back to the compressor on a vertical suction riser?",choices:["Adequate refrigerant velocity, and a trap at the base of the riser","A larger line size, to reduce pressure drop","Insulating the riser","Sloping the riser away from the compressor"],answer:0,whyWrong:{1:"Oversizing the line lowers velocity, which makes oil return worse rather than better.",2:"Insulation affects heat gain, not oil movement.",3:"Oil has to travel up the riser regardless of slope."},explain:`Oil climbs a vertical riser by being dragged along the pipe wall by the refrigerant vapour. That needs velocity — which is why suction lines are sized for velocity as well as pressure drop, and why an oversized line is a genuine fault rather than a harmless margin.

A trap at the base collects oil until there is enough to be carried up as a slug.

Oil that never returns sits in the evaporator, where it insulates the coil and starves the compressor of lubrication at the same time.`,source:c.todo("Confirm oil return piping practice against your text."),status:"draft"},Gl={...Q,id:"hvac.3.3.vapour-vs-liquid-recovery",objective:"3.3",kind:"choice",difficulty:2,prompt:"Why is liquid recovery faster than vapour recovery on a large system?",choices:["Liquid is far denser, so far more mass moves per unit of volume the machine handles","Liquid recovery uses a larger hose","Vapour recovery requires a deeper vacuum","The recovery machine runs at a higher speed on liquid"],answer:0,explain:`A recovery machine can only move so much volume per minute. Liquid refrigerant is hundreds of times denser than vapour, so each unit of volume carries vastly more mass.

The usual approach on a large charge is push-pull: recover the bulk as liquid first, then switch to vapour to clear what is left. On a small residential system it is not worth the extra setup.

Recovery machines are not compressors in the refrigeration sense — most cannot handle liquid entering the cylinder, so push-pull routes the liquid around the machine rather than through it.`,source:c.todo("Confirm recovery procedures against your text and EPA 608 material."),status:"draft"},_l={...Q,id:"hvac.3.4.recovery-cylinder-identification",objective:"3.4",kind:"choice",difficulty:2,prompt:"How is a recovery cylinder distinguished from a virgin refrigerant cylinder?",choices:["Recovery cylinders are grey with a yellow shoulder and must be DOT-approved and periodically retested","Recovery cylinders are always blue","There is no physical distinction; only the label differs","Recovery cylinders have no pressure relief device"],answer:0,explain:`Grey body, yellow shoulder is the standard marking for recovery cylinders in the US. They are DOT-approved pressure vessels and require periodic hydrostatic retesting — the date is stamped on the collar.

Virgin refrigerant used to be colour-coded by type, though that convention has become less reliable and the label is what you should read.

Never recover into a disposable cylinder. They are single-use, not rated for refilling, and refilling one is both illegal and genuinely dangerous.`,source:c.todo("Confirm cylinder marking and retest requirements against DOT rules and your text."),status:"draft"},Ql={...Q,id:"hvac.3.5.leak-detection-methods",objective:"3.5",kind:"match",difficulty:2,prompt:"Match each leak detection method to its strength.",pairs:[["Electronic detector","Sensitive and fast for locating a leak in a general area"],["Bubble solution","Cheap and unambiguous once you know roughly where to look"],["UV dye","Finds intermittent leaks that only appear under certain conditions"],["Nitrogen pressure test","Confirms whether a repaired system holds, before charging"],["Ultrasonic detector","Hears the hiss of a leak in a noisy environment"]],explain:`They are complementary rather than competing. Electronic detectors narrow it down, bubbles confirm the exact spot, and dye catches the leaks that only show up on a hot afternoon under full load.

The one to be careful with is dye: some manufacturers void warranty over it, and it contaminates recovery equipment. Check before using it.

Whatever finds the leak, a **nitrogen pressure test** is what proves the repair before you spend refrigerant on it.`,source:c.todo("Confirm leak detection methods against your text."),status:"draft"},Yl={...Q,id:"hvac.3.5.triple-evacuation",objective:"3.5",kind:"choice",difficulty:3,prompt:"What is triple evacuation, and when is it used?",choices:["Pull a vacuum, break it with dry nitrogen, and repeat — used on badly contaminated or wet systems","Evacuating three separate sections of a system in turn","Running the vacuum pump for three hours","Using three vacuum pumps in parallel"],answer:0,explain:`Each nitrogen break sweeps the system and mixes with the remaining moisture, so the next pull removes far more than continuing to pump would. Three cycles is dramatically more effective than one long one on a wet system.

It is not needed on a clean system that pulls straight down to 500 microns and holds. Reach for it when the decay test keeps plateauing around 1,500–2,000 microns, which is the signature of moisture still boiling off.

Use dry nitrogen for the breaks, never air — air brings its own moisture back in.`,source:c.todo("Confirm the triple evacuation procedure against your text."),status:"draft"},Jl={...Q,id:"hvac.3.6.leak-rate-thresholds",objective:"3.6",kind:"choice",difficulty:3,prompt:"Under the EPA rules, what happens when an appliance with a large charge exceeds its leak rate threshold?",choices:["The owner must repair the leak within a set period and verify the repair, with records kept","Nothing, as long as the refrigerant is replaced","The appliance must be replaced immediately","Only equipment containing CFCs is affected"],answer:0,explain:`Appliances above a threshold charge size have annual leak rate limits. Exceed one and the owner is required to repair, verify the repair, and keep records — or develop a retrofit or retirement plan.

The thresholds and timeframes differ by equipment type (commercial refrigeration, industrial process refrigeration, comfort cooling), and the rules have been amended more than once, so check the current text of 40 CFR Part 82 Subpart F rather than relying on memory.

The principle is stable even when the numbers move: repeatedly topping up a known leaker is not a compliance strategy.`,source:c.standard("40 CFR Part 82, Subpart F — leak repair provisions"),status:"verified"},Xl={...Q,id:"hvac.3.6.records",objective:"3.6",kind:"choice",difficulty:2,prompt:"What must a technician keep as proof of Section 608 certification?",choices:["A copy of the certification card or record, available for inspection","Nothing — the EPA maintains a searchable register","A renewal certificate, since certification expires every five years","Only the employer must keep records"],answer:0,whyWrong:{1:"There is no universal public register a technician can rely on in place of their own proof.",2:"Section 608 certification does not expire.",3:"The technician is responsible for their own proof of certification."},explain:`You keep proof and produce it on request. Certification does not expire, so there is no renewal — but losing the card does not remove the requirement to demonstrate it.

Separately, refrigerant **sales** are restricted to certified technicians, so suppliers will ask for it too. Keeping a photo of the card on your phone solves most of this in practice.`,source:c.standard("40 CFR §82.161, §82.164"),status:"verified"},Kl=[zl,Vl,Ul,Gl,_l,Ql,Yl,Jl,Xl],K={track:"hvac",domain:"4.0"},Zl={...K,id:"hvac.4.1.piston-sizing",objective:"4.1",kind:"choice",difficulty:3,prompt:"A condenser is matched to a larger indoor coil than the one it shipped with. What must be checked?",choices:["The metering device — a fixed orifice is sized for a specific coil and capacity","The line set colour coding","The thermostat wire gauge","Nothing; coils are interchangeable within a brand"],answer:0,explain:`A fixed orifice is a hole of a specific size, chosen for a specific combination of coil and capacity. Change the coil and the correct orifice usually changes with it.

Too small and the coil starves — high superheat, low capacity. Too large and it overfeeds — low superheat and floodback risk.

Manufacturers publish matched combinations with the required piston size. A mismatched system can look like a charge problem forever, because the readings never come right no matter how much refrigerant you move.`,source:c.todo("Confirm piston sizing guidance against manufacturer literature."),status:"draft"},eh={...K,id:"hvac.4.1.txv-hunting",objective:"4.1",kind:"choice",difficulty:3,prompt:`Suction pressure swings up and down every minute or so, and superheat swings with it.

What is this called and what usually causes it?`,choices:["Hunting — usually a poorly mounted or poorly insulated sensing bulb, or an oversized valve","Short cycling, caused by a faulty thermostat","Slugging, caused by an overcharge","Flash gas, caused by a restriction"],answer:0,explain:`Hunting is a control loop oscillating: the valve overshoots, superheat drops, the valve closes too far, superheat climbs, and round it goes.

The usual causes are a bulb that senses badly — loose, uninsulated, or on the bottom of the line where oil pools — so it lags and the valve keeps over-correcting. An oversized valve does the same thing because small movements produce large flow changes.

Fix the bulb mounting first. It costs nothing and it is the cause far more often than a valve that genuinely needs replacing.`,source:c.todo("Confirm the hunting discussion against your text."),status:"draft"},th={...K,id:"hvac.4.2.equalised-pressure-meaning",objective:"4.2",kind:"choice",difficulty:3,prompt:`A system has been off for several hours. Both gauges read 130 psig on an R-410A system at 50°F ambient.

What does that tell you?`,choices:["The pressures have equalised at the saturation pressure for ambient — the system has refrigerant in it","The system is overcharged","The compressor has failed","There is a restriction between the two sides"],answer:0,explain:`With the system off long enough, high and low sides equalise, and the pressure settles at the saturation pressure for the surrounding temperature. R-410A at 50°F is about 143 psig, so 130 at 50°F ambient is in the right region.

What this **does** tell you: there is liquid refrigerant present. What it does **not** tell you: how much. A system with two pounds and one with eight will read the same standing pressure.

A standing pressure well below saturation for ambient means the charge is gone — you are reading vapour only.`,source:c.standard("Saturation pressure at ambient — P-T relationship"),status:"verified"},ah={...K,id:"hvac.4.2.chart-direction",objective:"4.2",kind:"choice",difficulty:3,prompt:"On a fixed-orifice charging chart, what happens to target superheat as outdoor temperature rises?",choices:["It falls — a hotter condenser raises head pressure, which pushes more refrigerant through the orifice","It rises, because the system works harder","It stays constant; only indoor conditions matter","It becomes undefined above 95°F"],answer:0,explain:`A fixed orifice passes refrigerant according to the pressure difference across it. Hotter outside means higher head pressure, a bigger difference, and more flow — so the coil is better fed and superheat falls.

Indoor wet bulb pushes the other way: more load means more heat to boil, and superheat rises.

That is why the chart needs both numbers. Reading it with only one is guessing, and using indoor **dry** bulb instead of wet bulb gets it wrong in a humid climate by a wide margin.`,source:c.todo("Confirm against a manufacturer superheat charging chart."),status:"draft"},ih={...K,id:"hvac.4.3.nameplate-subcooling",objective:"4.3",kind:"choice",difficulty:2,prompt:`A condenser nameplate specifies "subcooling 8°F" but the generic target is 8–12°F.

Which do you charge to?`,choices:["The nameplate — the manufacturer knows the equipment better than a general rule does","The middle of the generic range, 10°F","Whichever is easier to hit","The generic range, since nameplates are often out of date"],answer:0,explain:`The 8–12°F band is a reasonable default when nothing else is specified. A nameplate figure is not a default — it is the value that unit was designed and tested around.

Charging to 12°F on a unit specified at 8°F leaves it meaningfully overcharged, with higher head pressure and higher running cost.

Same principle throughout: manufacturer instructions beat general rules, and the general rules exist for when there are no instructions to hand.`,source:c.todo("Confirm charging precedence against manufacturer literature."),status:"draft"},oh={...K,id:"hvac.4.3.removing-charge",objective:"4.3",kind:"choice",difficulty:2,prompt:"You need to remove half a pound of refrigerant from an overcharged system. How?",choices:["Recover it into a cylinder on a scale","Bleed it slowly from the low side to atmosphere","Bleed it from the high side, which is faster","Leave it — an overcharge is less harmful than an undercharge"],answer:0,whyWrong:{1:"Venting is illegal regardless of quantity or how slowly it is done.",2:"Also venting, and faster is not better here.",3:"An overcharge raises head pressure, amps and compressor stress, and can cause floodback."},explain:`Recovery, onto a scale so you know how much came out. There is no legal way to vent, and no threshold below which it becomes acceptable.

Take out a measured amount, let the system stabilise for ten to fifteen minutes, then re-read subcooling. Removing refrigerant in small increments and re-measuring is slower than guessing but it is the only way to land on target.`,source:c.standard("40 CFR §82.154 (venting prohibition)"),status:"verified"},sh={...K,id:"hvac.4.4.let-it-stabilise",objective:"4.4",kind:"choice",difficulty:2,prompt:"You have just added refrigerant. How long should you wait before reading superheat and subcooling?",choices:["Ten to fifteen minutes of steady running","Thirty seconds — the readings respond immediately","One hour minimum","No wait is needed if the system was already running"],answer:0,explain:`The system needs time to redistribute the charge and settle at a new operating point. Readings taken immediately reflect the transient, not the state you are trying to measure.

Add a small amount, wait, read, repeat. Adding continuously while watching the gauges is how systems get overcharged: the readings lag, you keep going, and by the time they catch up you have gone past.

The same applies to any change — airflow, a metering device swap, anything.`,source:c.todo("Confirm the stabilisation guidance against your text."),status:"draft"},nh={...K,id:"hvac.4.4.charging-side",objective:"4.4",kind:"choice",difficulty:3,prompt:"You are charging a running R-410A system with liquid. Where do you introduce it, and how?",choices:["Into the suction line through a metering restrictor, slowly, so it flashes before reaching the compressor","Into the suction line directly, since the compressor will handle it","Into the liquid line while the system runs","Into the discharge line"],answer:0,whyWrong:{1:"Liquid straight into the suction line slugs the compressor.",2:"You cannot push liquid into the high side against discharge pressure while running.",3:"Never — that is the highest pressure point in the system."},explain:`R-410A is a blend, so it must leave the cylinder as **liquid** to keep its proportions right. But liquid must not reach the compressor.

The resolution is to meter it into the suction line slowly, through a restrictor built into the hose or the manifold, so it flashes to vapour on the way. Small amounts, with the cylinder upright and the liquid valve open.

The alternative is charging into the high side with the system **off**, which is how a weighed charge normally goes in after an evacuation.`,source:c.todo("Confirm blend charging procedure against your text and manufacturer instructions."),status:"draft"},rh=[Zl,eh,th,ah,ih,oh,sh,nh],Z={track:"hvac",domain:"5.0"},ch={...Z,id:"hvac.5.1.heat-strip-power",objective:"5.1",kind:"input",difficulty:2,prompt:`A 240 V electric heat strip draws 21 A.

What is its output in watts?`,placeholder:"W",accept:["5040"],tolerance:100,explain:`P = E × I = 240 × 21 = **5,040 W**.

Convert to BTU/h by multiplying by 3.412: 5,040 × 3.412 ≈ 17,200 BTU/h. That conversion is worth knowing, because heat strips are rated in kW and everything else in the trade is in BTU/h.

Resistance heat is purely resistive, so watts and volt-amps are the same here. Motors are inductive and need a power factor in the calculation.`,source:c.standard("P = E × I"),status:"verified"},lh={...Z,id:"hvac.5.1.voltage-drop-under-load",objective:"5.1",kind:"choice",difficulty:3,prompt:`Line voltage reads 240 V with the unit off and 205 V while the compressor runs.

What does that indicate?`,choices:["Excessive voltage drop — undersized conductors, a long run, or a loose connection","Normal behaviour under load","The compressor is drawing too little current","The meter is faulty"],answer:0,explain:`Some drop under load is normal; 35 V is not. Voltage drops across resistance, and the resistance is in the supply path rather than in the load.

Suspects: undersized conductors for the run length, a corroded or loose connection at the disconnect or contactor, or a failing breaker.

Low voltage makes a motor draw **more** current to deliver the same power, which heats the windings and shortens its life. A compressor failing repeatedly on a circuit with poor voltage is failing because of the circuit.`,source:c.todo("Confirm voltage drop limits against your text and applicable code."),status:"draft"},hh={...Z,id:"hvac.5.1.three-phase",objective:"5.1",kind:"choice",difficulty:2,prompt:"Why is three-phase power preferred for larger commercial equipment?",choices:["Smoother power delivery and smaller conductors for the same load, with motors that need no start components","It is safer to work on","It delivers higher voltage in all cases","It eliminates the need for a disconnect"],answer:0,explain:`Three phases overlap, so power delivery is continuous rather than pulsing. That means a smoother torque, less vibration, and — usefully — a rotating magnetic field that starts a motor without needing a start capacitor or start winding at all.

It also carries more power for the same conductor size, which matters on large equipment.

Diagnostically: a three-phase motor running on two phases (single-phasing) overheats fast and is a common failure after one fuse opens.`,source:c.todo("Confirm the three-phase discussion against your text."),status:"draft"},dh={...Z,id:"hvac.5.3.start-winding",objective:"5.3",kind:"choice",difficulty:3,prompt:"Why does a single-phase motor need a start winding at all?",choices:["Single-phase power alone produces no rotating field, so the motor has no starting direction","The start winding provides extra power at all times","It reduces running current","It protects the run winding from overheating"],answer:0,explain:`A single-phase supply produces a field that pulses back and forth rather than rotating. A motor sitting still in that field has no reason to turn one way rather than the other.

The start winding — more turns of finer wire, offset in the stator, with a capacitor shifting its current out of phase — creates an artificial second phase. That gives a rotating field and the rotor follows it.

Once turning, the motor sustains itself, which is why start windings and start capacitors are switched out after startup. Three-phase motors need none of this, because the supply is already rotating.`,source:c.todo("Confirm the motor theory against your text."),status:"draft"},uh={...Z,id:"hvac.5.4.hard-start-kit",objective:"5.4",kind:"choice",difficulty:3,prompt:"What does a hard-start kit do, and what does it tell you diagnostically?",choices:["Adds a start capacitor and relay for extra starting torque — if it fixes the problem, the compressor is weak","Increases the running current permanently","Replaces the run capacitor","Slows the compressor down at startup"],answer:0,explain:`A hard-start kit is a start capacitor plus a potential relay that switches it out once the motor is up to speed. It gives a large torque boost for the first fraction of a second.

The diagnostic value is what it reveals. A healthy compressor with a good run capacitor does not need one. If fitting one gets a struggling compressor started, the compressor is weak and on its way out — you have bought time, not fixed anything.

Fitting one as a matter of course masks developing failures and adds a component that can itself fail.`,source:c.todo("Confirm the hard-start kit discussion against your text."),status:"draft"},ph={...Z,id:"hvac.5.5.transformer-sizing",objective:"5.5",kind:"choice",difficulty:3,prompt:`A 40 VA control transformer feeds a contactor coil, a gas valve and a damper motor whose combined draw is 48 VA.

What happens?`,choices:["Secondary voltage sags under load, causing chatter, dropouts and eventual transformer failure","Nothing — transformers self-limit safely","The secondary voltage rises","The primary fuse opens immediately"],answer:0,explain:`An overloaded transformer cannot hold its secondary voltage. It sags, and 24 V devices start behaving marginally — contactors chatter, gas valves fail to hold, boards reset.

It also runs hot, and sustained overload eventually kills it.

The diagnostic tell is the same as for chatter generally: **measure under load**. A transformer that reads a healthy 26 V with nothing energised and collapses to 17 V when the contactor pulls in is the whole answer.`,source:c.todo("Confirm transformer sizing guidance against your text."),status:"draft"},mh={...Z,id:"hvac.5.5.relay-vs-contactor",objective:"5.5",kind:"choice",difficulty:2,prompt:"What distinguishes a contactor from a relay?",choices:["A contactor is built for larger loads, with heavier contacts and often an arc-quenching design","A relay uses AC and a contactor uses DC","A contactor has no coil","They are the same device under two names"],answer:0,explain:`Both are a coil operating a set of contacts. The difference is scale: a contactor switches motor loads with heavy contacts designed to survive the arc that occurs on every break.

Relays handle smaller loads — a blower relay, a fan relay on a board.

Contactor contacts are a wear item. Pitted, burned or welded contacts are a routine finding, and welded contacts are the reason a compressor sometimes will not shut off.`,source:c.todo("Confirm the component distinction against your text."),status:"draft"},fh={...Z,id:"hvac.5.7.testing-a-coil",objective:"5.7",kind:"choice",difficulty:2,prompt:`You measure a contactor coil and read infinite resistance.

What does that mean?`,choices:["The coil is open and the contactor will never pull in, regardless of control voltage","The coil is shorted","The coil is healthy","The reading is meaningless on a coil"],answer:0,explain:`A coil is a long winding of fine wire, so it should read a definite resistance — typically tens to hundreds of ohms depending on the device.

Infinite means the winding is broken. No current can flow, no magnetic field forms, and the contactor cannot pull in even with perfect 24 V across it.

Near-zero would mean shorted, which typically draws far more than the transformer can supply and causes the sagging-voltage symptoms. Both are replace-the-part findings.

Test with the power off and the coil disconnected from the circuit, or parallel paths will give you a misleading reading.`,source:c.todo("Confirm coil testing procedure against your text."),status:"draft"},gh=[ch,lh,hh,dh,uh,ph,mh,fh],ee={track:"hvac",domain:"6.0"},wh={...ee,id:"hvac.6.1.cfm-from-sensible",objective:"6.1",kind:"input",difficulty:3,prompt:`A coil is removing 24,000 BTU/h of sensible heat with a 20°F temperature drop.

How much air is moving, in CFM?`,placeholder:"CFM",accept:["1111"],tolerance:40,explain:`Rearrange the sensible heat equation: CFM = Qs ÷ (1.08 × ΔT) = 24,000 ÷ (1.08 × 20) = 24,000 ÷ 21.6 = **about 1,111 CFM**.

This is how you measure airflow without a flow hood: measure the temperature drop, know the sensible capacity, and solve for CFM.

It is only as good as your capacity figure, which is why it is a cross-check rather than a primary measurement. But it costs two thermometers and it catches gross airflow problems.`,source:c.standard("CFM = Qs ÷ (1.08 × ΔT)"),status:"verified"},yh={...ee,id:"hvac.6.1.grille-noise",objective:"6.1",kind:"choice",difficulty:3,prompt:"A return grille whistles audibly. What does that indicate?",choices:["Air velocity through it is too high — the grille is undersized for the airflow","The blower is running too slowly","The filter has been fitted backwards","The duct is oversized"],answer:0,explain:`Noise is a velocity symptom. Push too much air through too small an opening and it becomes turbulent and audible.

Return grilles are undersized far more often than supply registers, because installers size the supply side carefully and treat the return as an afterthought. The result is high static pressure, reduced airflow and a system the customer can hear.

The fix is more return area — a larger grille, or an additional return — not a slower blower.`,source:c.todo("Confirm face velocity guidance against your text or ACCA Manual D."),status:"draft"},bh={...ee,id:"hvac.6.2.probe-placement",objective:"6.2",kind:"choice",difficulty:3,prompt:"Where should the two static pressure probes go to measure total external static correctly?",choices:["Between the filter and the blower, and after the blower but before the coil — measuring what the blower works against externally","At the furthest supply register and the return grille","Both in the supply plenum, six inches apart","Anywhere in the ductwork, as long as they are on opposite sides"],answer:0,whyWrong:{1:"That measures the duct system but excludes the air handler internals the rating refers to.",2:"Two probes on the same side measure a pressure drop within the supply, not TESP.",3:"Placement determines what you are measuring; it is not arbitrary."},explain:`TESP is what the blower develops against everything **external** to itself. So the probes go immediately either side of the blower section.

Where exactly depends on the equipment: whether the coil and filter are inside the cabinet or outside it changes whether their drop is included. The rating on the data plate tells you what it assumes.

Measuring across additional components and comparing against a rating that excludes them makes a healthy system look badly restricted.`,source:c.todo("Confirm probe placement against your text and manufacturer literature."),status:"draft"},vh={...ee,id:"hvac.6.2.finding-the-restriction",objective:"6.2",kind:"choice",difficulty:3,prompt:"TESP measures 0.90 in. w.c. against a 0.50 rating. How do you find where the restriction is?",choices:["Measure the pressure drop across each component in turn and compare with its published drop","Replace the blower motor with a larger one","Open all the supply registers and re-measure","Increase the blower speed and see if it improves"],answer:0,explain:`Total static tells you there is a problem. Component-by-component drops tell you where.

Measure across the filter, across the coil, across each duct section. Compare each against the manufacturer's published drop for that component at that airflow. Whatever is well above its published figure is your restriction.

A filter is often 0.10–0.25 in. w.c. when clean; a wet coil more. Finding one component at 0.45 when it should be 0.15 is a definite answer, where "high static" alone is not.`,source:c.todo("Confirm the component drop method against your text."),status:"draft"},kh={...ee,id:"hvac.6.3.reading-a-fan-table",objective:"6.3",kind:"choice",difficulty:2,prompt:`A blower table lists CFM against external static at each speed tap.

How do you use it?`,choices:["Measure TESP, find your speed tap row, and read across to the airflow it is actually delivering","Pick the airflow you want and set the tap to match","Use the highest speed tap listed for the equipment","It only applies at 0.50 in. w.c."],answer:0,explain:`The table is a lookup with two inputs: which tap the blower is wired to, and what static it is working against. That gives you the airflow it is genuinely producing — not what you hoped for.

It is the honest airflow check on a PSC blower, and it takes one manometer reading.

Note how quickly the numbers fall off as static rises. A blower delivering 1,200 CFM at 0.30 might be down to 900 at 0.80, which is the difference between a working system and an icing coil.`,source:c.todo("Confirm blower table use against manufacturer literature."),status:"draft"},Th={...ee,id:"hvac.6.4.compressed-flex",objective:"6.4",kind:"choice",difficulty:3,prompt:`Flexible duct is installed with noticeable slack, sagging between supports.

What is the effect?`,choices:["A large increase in friction — compressed and sagging flex has far more resistance than the same duct pulled taut","None, provided the length is correct","It improves airflow by slowing the air","It only affects noise"],answer:0,explain:`Flex duct is rated pulled tight. Let it sag and the inner liner corrugates, which multiplies friction — published figures suggest a compressed run can have several times the resistance of the same duct stretched properly.

Sagging between distant supports does the same thing over and over along the run.

It is one of the most common and most invisible installation faults: everything looks connected, and the system is quietly starved. Pull it taut, support it at proper intervals, and avoid tight bends.`,source:c.todo("Confirm flex duct installation guidance against your text and ACCA Manual D."),status:"draft"},xh={...ee,id:"hvac.6.5.closing-registers",objective:"6.5",kind:"choice",difficulty:2,prompt:'A customer has closed the registers in unused rooms to "save energy". What does that actually do?',choices:["Raises system static pressure and reduces total airflow, which can ice the coil","Saves energy proportional to the rooms closed","Has no measurable effect","Improves airflow to the remaining rooms with no downside"],answer:0,explain:`A duct system is designed for a total airflow. Closing registers does not remove that air — it forces the same blower to push the same volume through a smaller opening, raising static pressure and reducing total flow.

On a cooling system, less airflow means a colder coil, which can ice. On a furnace it can trip the high limit.

It also does not save much: the equipment still runs, and duct leakage into unconditioned space usually goes **up** with the higher pressure. Zoning with proper dampers and controls is the real version of this idea.`,source:c.todo("Confirm the closed register discussion against your text."),status:"draft"},Ch={...ee,id:"hvac.6.6.when-to-change",objective:"6.6",kind:"choice",difficulty:2,prompt:"What is the most reliable way to decide when a filter needs changing?",choices:["Measure the pressure drop across it and compare with its clean value","Change it every 30 days regardless","Change it when it looks dirty","Change it when the system stops cooling well"],answer:0,explain:`Pressure drop is what actually matters, and it is measurable. A filter at twice its clean drop is costing real airflow whether or not it looks bad.

A calendar interval is a reasonable default for a homeowner but ignores how the house actually loads the filter — pets, construction, a dusty season.

Appearance is misleading in both directions: a filter can look grey and still flow fine, or look acceptable while a fine media has loaded up. Waiting for a comfort complaint means the coil has already been running starved for weeks.`,source:c.todo("Confirm filter maintenance guidance against your text."),status:"draft"},Ah=[wh,yh,bh,vh,kh,Th,xh,Ch],te={track:"hvac",domain:"7.0"},Sh={...te,id:"hvac.7.1.grains-per-pound",objective:"7.1",kind:"choice",difficulty:2,prompt:"There are 7,000 grains in a pound. Why does the trade use grains rather than pounds of water?",choices:["The quantities are tiny — typical indoor air holds around 60 to 80 grains per pound of dry air","Grains are the SI unit for moisture","Pounds of water cannot be measured directly","It is a historical convention with no practical reason"],answer:0,explain:`Air at 75°F and 50% RH holds about 0.0092 lb of water per pound of dry air. Writing that as 64 grains is simply easier to read, compare and do arithmetic with.

It also matches the latent heat formula: Ql = 0.68 × CFM × Δgrains. The constant already assumes grains.

When you see humidity ratio written as 0.0092 lb/lb in a textbook and 64 gr/lb on an instrument, they are the same number.`,source:c.standard("7,000 grains = 1 pound"),status:"verified"},Rh={...te,id:"hvac.7.1.specific-volume",objective:"7.1",kind:"choice",difficulty:3,prompt:"Specific volume of air at typical indoor conditions is about 13.5 ft³ per pound. Why does it matter?",choices:["It converts between volume airflow in CFM and mass airflow, which is what actually carries heat","It determines the duct size directly","It sets the coil temperature","It is only relevant at altitude"],answer:0,explain:`Heat is carried by mass, not volume. A cubic foot of hot attic air weighs less than a cubic foot of cool basement air, and carries proportionally less heat.

Specific volume is the bridge: pounds per minute = CFM ÷ specific volume. It is buried inside the 1.08 constant, which assumes standard air at 0.075 lb/ft³ — the reciprocal of 13.33 ft³/lb.

It is exactly why the constant shrinks at altitude: thinner air, higher specific volume, less mass per CFM, less heat moved.`,source:c.standard("ASHRAE Handbook — Fundamentals, Ch. 1"),status:"verified"},Fh={...te,id:"hvac.7.2.apparatus-dew-point",objective:"7.2",kind:"choice",difficulty:3,prompt:"What is a coil's apparatus dew point?",choices:["The effective surface temperature the coil behaves as if it had — where its process line meets saturation","The dew point of the air entering the coil","The temperature at which the condensate drain freezes","The dew point of the air leaving the coil"],answer:0,explain:`A real coil does not have one temperature — it varies along its length and depth. The apparatus dew point is the single effective temperature that would produce the same result: extend the coil's process line on the chart and see where it hits the saturation curve.

It matters because it determines how much moisture the coil can remove. A lower apparatus dew point means more dehumidification.

Airflow moves it directly: less air, colder coil, lower apparatus dew point, more latent removal. That is the mechanism behind the humid-house fix.`,source:c.todo("Confirm the apparatus dew point discussion against your text or ASHRAE Fundamentals."),status:"draft"},qh={...te,id:"hvac.7.2.bypass-factor",objective:"7.2",kind:"choice",difficulty:3,prompt:"What does a coil's bypass factor describe?",choices:["The fraction of air that passes through without contacting the cold surface, so leaves unchanged","Air that leaks around the coil frame","Refrigerant bypassing the metering device","The share of capacity lost to duct leakage"],answer:0,explain:`Not every molecule touches a fin. Some air threads through and comes out at entering conditions, then mixes with the air that was fully conditioned.

The bypass factor is that fraction. A deeper coil with more rows and tighter fins has a lower bypass factor and gets closer to its apparatus dew point.

It also explains why supply air is not saturated even though parts of the coil are below the dew point: what leaves the coil is a mixture of fully conditioned and untouched air.`,source:c.todo("Confirm the bypass factor discussion against your text."),status:"draft"},$h={...te,id:"hvac.7.3.latent-calc",objective:"7.3",kind:"input",difficulty:2,prompt:`1,000 CFM of air is dehumidified by 22 grains per pound.

How much latent heat is being removed, in BTU/h?`,placeholder:"BTU/h",accept:["14960"],tolerance:300,explain:`Ql = 0.68 × CFM × Δgrains = 0.68 × 1,000 × 22 = **14,960 BTU/h**.

That is over a ton of capacity spent on moisture alone, and none of it shows on a thermometer.

It is also why a system in a humid climate needs more total capacity than the sensible load alone suggests — and why sizing on sensible load in Florida leaves you short.`,source:c.standard("Ql = 0.68 × CFM × Δgrains"),status:"verified"},Ih={...te,id:"hvac.7.4.shr-calc",objective:"7.4",kind:"input",difficulty:2,prompt:`A coil produces 30,000 BTU/h total and 21,000 BTU/h sensible.

What is the sensible heat ratio? Give it as a decimal.`,placeholder:"e.g. 0.75",accept:["0.7"],tolerance:.03,explain:`SHR = sensible ÷ total = 21,000 ÷ 30,000 = **0.70**.

That is a fairly low SHR, meaning 30% of the capacity is doing moisture removal. Appropriate for a humid climate.

Typical residential equipment runs 0.70 to 0.80. Above 0.85 the system is doing very little dehumidification, which is right in Phoenix and a comfort complaint in Houston.`,source:c.standard("SHR = Qs ÷ Qt"),status:"verified"},Mh={...te,id:"hvac.7.5.standalone-dehumidifier",objective:"7.5",kind:"choice",difficulty:3,prompt:"Why does a standalone dehumidifier warm the room it is in, while an air conditioner cools it?",choices:["A dehumidifier rejects its condenser heat into the same room, plus the latent heat it removed","Dehumidifiers use resistance heat to dry the air","The compressor runs hotter in a dehumidifier","It does not; a dehumidifier cools the room slightly"],answer:0,explain:`Both machines run the same cycle. The difference is where the condenser sends its heat.

An air conditioner puts the evaporator indoors and the condenser outdoors — heat leaves the house. A dehumidifier has both in the same room, so all the heat it absorbs comes straight back out, **plus** the compressor's own work as extra heat.

The room ends up drier and slightly warmer. That is not a flaw, it is what the machine is for — but it explains why running one in an already-hot room feels counterproductive.`,source:c.todo("Confirm the dehumidifier discussion against your text."),status:"draft"},Ph={...te,id:"hvac.7.5.erv-vs-hrv",objective:"7.5",kind:"choice",difficulty:3,prompt:"What distinguishes an ERV from an HRV?",choices:["An ERV transfers moisture as well as heat between the airstreams; an HRV transfers heat only","An ERV uses a fan and an HRV does not","An HRV works in summer and an ERV in winter","They are the same device"],answer:0,explain:`Both recover energy from exhaust air to pre-condition incoming ventilation air. The difference is whether moisture crosses too.

An **HRV** moves sensible heat only. Right for a cold dry climate where you want to keep heat but not humidity.

An **ERV** also transfers moisture. In a humid climate that means incoming outdoor air gives up some of its moisture to the outgoing stream before reaching the coil, which cuts the ventilation latent load substantially.

Climate decides which. Getting it backwards means either a humidity problem or unnecessarily dry winter air.`,source:c.todo("Confirm the ERV/HRV comparison against your text or ASHRAE 62."),status:"draft"},Wh=[Sh,Rh,Fh,qh,$h,Ih,Mh,Ph],Y={track:"hvac",domain:"8.0"},Eh={...Y,id:"hvac.8.1.excess-air",objective:"8.1",kind:"choice",difficulty:3,prompt:`Combustion is set up with some excess air rather than the exact theoretical amount.

Why?`,choices:["Mixing is never perfect, so excess air ensures complete combustion — but too much wastes heat up the flue","Excess air raises flame temperature","It is required to keep the flue cool enough for PVC","It reduces the amount of gas needed"],answer:0,explain:`In theory a precise air-to-fuel ratio burns everything. In a real burner the mixing is imperfect, so running at exactly stoichiometric would leave pockets of unburned fuel — which means carbon monoxide.

Excess air provides margin. But every extra cubic foot is heated and sent up the flue, so too much is pure loss.

A combustion analyser reads O₂ and CO₂ in the flue gas, which is how you find the balance. That is the instrument that actually answers "is this burning properly", and eyeballing the flame does not.`,source:c.todo("Confirm combustion tuning guidance against your text."),status:"draft"},jh={...Y,id:"hvac.8.1.flame-colour",objective:"8.1",kind:"choice",difficulty:2,prompt:`A natural gas burner shows lazy yellow flames rather than crisp blue ones.

What does that suggest?`,choices:["Insufficient primary air or a dirty burner — incomplete combustion, and possible carbon monoxide","The gas pressure is too low","Normal appearance for natural gas","The heat exchanger is oversized"],answer:0,explain:`Properly aerated natural gas burns blue with a well-defined inner cone. Yellow, lazy, floating flames mean the fuel is not getting the air it needs, and unburned carbon is glowing.

Causes: blocked primary air openings, a dirty or rusted burner, lint and dust, or inadequate combustion air in the space.

Treat it as a CO concern, not an aesthetic one. Confirm with a combustion analyser rather than by eye — flame appearance is a prompt to measure, not a measurement.`,source:c.todo("Confirm flame appearance guidance against your text."),status:"draft"},Oh={...Y,id:"hvac.8.2.high-limit-trip",objective:"8.2",kind:"choice",difficulty:3,prompt:`A furnace runs, gets hot, then shuts the burners off while the blower keeps running. It restarts a few minutes later.

What is happening?`,choices:["The high limit is tripping on excessive heat exchanger temperature — almost always an airflow problem","The flame sensor is dirty","The gas valve is failing","The thermostat is satisfied and cycling normally"],answer:0,explain:`The blower continuing to run while the burners stop is the signature. The limit switch has opened the gas but left the blower going to cool the exchanger — exactly what it is designed to do.

The exchanger overheated because not enough air is carrying the heat away. Check the filter first, then the blower wheel, the blower speed tap, closed registers and duct restriction.

A dirty flame sensor gives a different pattern — the burners drop out within seconds of lighting, before anything gets hot. The timing distinguishes them.`,source:c.todo("Confirm the limit switch discussion against your text."),status:"draft"},Lh={...Y,id:"hvac.8.2.two-stage-benefit",objective:"8.2",kind:"choice",difficulty:2,prompt:"What is the advantage of a two-stage gas furnace over a single-stage one?",choices:["It runs longer at lower fire on mild days, giving steadier temperatures and better efficiency","It produces more heat overall","It needs no venting","It eliminates the need for a filter"],answer:0,explain:`A single-stage furnace is either full output or off. On a mild day it satisfies the thermostat quickly, shuts off, and the house drifts until it fires again — big temperature swings and lots of cycling.

Two-stage runs at roughly 60–70% on low fire for most of the season, so run times are longer and steadier. That improves comfort, cuts cycling losses, and moves air more consistently.

Modulating furnaces take the same idea further, varying output continuously.`,source:c.todo("Confirm the staging discussion against your text."),status:"draft"},Nh={...Y,id:"hvac.8.5.why-inducer",objective:"8.5",kind:"choice",difficulty:3,prompt:"What does an induced draft blower do that a natural draft furnace relies on buoyancy for?",choices:["It pulls flue products through the exchanger and out the vent, so draft does not depend on stack effect","It supplies combustion air to the burner","It cools the heat exchanger","It circulates air into the house"],answer:0,explain:`A natural draft appliance depends on hot flue gas being buoyant enough to rise up a chimney. That works, but it is at the mercy of stack temperature, chimney condition and what the rest of the house is doing to pressure.

An inducer takes that out of the equation — it mechanically pulls the products through. That is what allows a more restrictive, more efficient heat exchanger, and what makes the pressure switch possible as a proof of draft.

It is a different fan from the indoor blower, which moves house air, and from any combustion air fan.`,source:c.todo("Confirm the draft discussion against your text."),status:"draft"},Hh={...Y,id:"hvac.8.4.condensate-acidity",objective:"8.4",kind:"choice",difficulty:3,prompt:"Why does condensing furnace condensate sometimes need a neutraliser before it goes to drain?",choices:["It is mildly acidic and can attack metal drain piping and some municipal systems","It contains carbon monoxide","It is too hot for plastic drain pipe","It would freeze in the drain"],answer:0,explain:`Flue gas condensate is typically around pH 3 to 5 — acidic enough to corrode cast iron or steel drain piping over time.

A neutraliser is a cartridge of limestone or marble chips the condensate flows through, raising the pH before discharge. Whether one is required depends on local code and the drain material.

The media is consumed and needs periodic replacement, which is a maintenance item people routinely forget until the drain line fails.`,source:c.todo("Confirm condensate handling requirements against your text and local code."),status:"draft"},Dh={...Y,id:"hvac.8.6.low-water-cutoff",objective:"8.6",kind:"choice",difficulty:3,prompt:"What does a low water cutoff on a boiler do, and why does it matter so much?",choices:["Shuts off the burner if water level drops — firing a dry boiler can crack it or cause a violent failure","Adds makeup water automatically","Prevents the circulator from running dry","Limits the maximum water temperature"],answer:0,explain:`A boiler heats water. Remove the water and the burner is heating bare metal, which cracks the vessel — and if water then reaches that superheated metal, it flashes to steam instantly. That failure mode is genuinely violent.

The low water cutoff is a life-safety device, not a convenience. It must be tested on a schedule, and it must never be bypassed.

Repeated low-water events point at a leak or a failed makeup arrangement, and that is the problem to solve rather than the cutoff that keeps tripping.`,source:c.todo("Confirm boiler safety controls against your text and applicable code."),status:"draft"},Bh={...Y,id:"hvac.8.6.hydronic-delta-t",objective:"8.6",kind:"choice",difficulty:3,prompt:`A hydronic loop designed for a 20°F temperature difference is measuring 8°F.

What does that indicate?`,choices:["Flow is too high — the water is moving through too fast to give up its heat","The boiler is undersized","Flow is too low","The system is operating correctly"],answer:0,explain:`From Q = 500 × GPM × ΔT: for a given heat output, flow and temperature difference trade off against each other. A small ΔT with the same output means high flow.

Over-pumping wastes electricity, can cause erosion and noise, and gives poorer heat transfer at the emitters.

The opposite — a large ΔT, say 35°F — means flow is too low, and parts of the system may not be getting heat at all. Either way the ΔT is telling you about flow, which is exactly why it is the first hydronic measurement to take.`,source:c.todo("Confirm hydronic balancing guidance against your text."),status:"draft"},zh={...Y,id:"hvac.8.7.strip-airflow-interlock",objective:"8.7",kind:"choice",difficulty:3,prompt:"Why must electric heat strips be interlocked with the blower?",choices:["Energised strips with no airflow overheat, trip their limits, and can start a fire","To prevent the strips drawing too much current","To keep the strips from corroding","To satisfy the thermostat faster"],answer:0,explain:`A resistance element with air moving over it stays at a manageable temperature. Without airflow it keeps heating, glows, and the surrounding cabinet and ductwork get far hotter than they were designed for.

The interlock — plus thermal limits and fusible links as backup — is what prevents that. It is why the sequencer typically keeps the blower running after the strips de-energise, to carry the residual heat away.

A blower that fails while strips are energised is precisely the scenario those limits exist for, and it is why they must never be bypassed.`,source:c.todo("Confirm electric heat safety controls against your text."),status:"draft"},Vh=[Eh,jh,Oh,Lh,Nh,Hh,Dh,Bh,zh],de={track:"hvac",domain:"9.0"},Uh={...de,id:"hvac.9.4.cop",objective:"9.4",kind:"choice",difficulty:3,prompt:`A heat pump has a coefficient of performance of 3.0 at a given outdoor temperature.

What does that mean?`,choices:["It delivers three units of heat for every unit of electrical energy it consumes","It is 300% efficient at converting electricity to heat","It runs three times longer than a furnace","Its output is three times its rated capacity"],answer:0,whyWrong:{1:"Nothing converts energy at over 100%. The heat pump moves existing heat rather than creating it.",2:"COP says nothing about run time.",3:"COP is an efficiency ratio, not a capacity multiplier."},explain:`COP is heat delivered divided by energy consumed, both in the same units. A COP of 3.0 means three units out for one in.

That is not a violation of anything — the extra two units were already in the outdoor air, and the electricity paid for **moving** them rather than creating them. Electric resistance heat has a COP of exactly 1.0.

COP falls as it gets colder, because there is less temperature difference to work with. That declining curve is what produces the balance point.`,source:c.standard("COP = heat delivered ÷ energy consumed"),status:"verified"},Gh={...de,id:"hvac.9.2.defrost-initiation",objective:"9.2",kind:"match",difficulty:3,prompt:"Match each defrost control strategy to how it decides to start.",pairs:[["Time and temperature","Fixed run-time interval, plus a coil temperature check"],["Demand defrost","Measures actual coil conditions and defrosts only when frost is present"],["Pressure differential","Senses air pressure drop across the coil as frost blocks it"]],explain:`Time-and-temperature is the older approach: every 30, 60 or 90 minutes of compressor run time, check whether the coil is cold enough to warrant defrosting. Simple, and it defrosts when it does not need to.

Demand defrost compares coil temperature against ambient — the gap widens as frost builds — and only runs a cycle when the readings say frost is actually there. Fewer cycles, better efficiency, less auxiliary heat.

Every unnecessary defrost costs a reversal, a period of cooling the house, and a run of resistance heat. That is why the difference shows up on a power bill.`,source:c.todo("Confirm defrost control types against your text and manufacturer literature."),status:"draft"},_h={...de,id:"hvac.9.2.solid-ice-outdoor",objective:"9.2",kind:"choice",difficulty:3,prompt:`A heat pump outdoor coil is encased in solid ice, not light frost.

What does that suggest?`,choices:["Defrost is not working — a failed sensor, board or reversing valve, or a blocked base pan drain","Normal operation in cold weather","The system is overcharged","The indoor filter is dirty"],answer:0,explain:`Light frost between defrost cycles is normal. A solid block means the cycle is not running, not completing, or the melt water is not getting away.

Check in this order: is the board calling for defrost at all, does the reversing valve actually shift, does the outdoor fan stop, and is the base pan drain clear. A blocked drain refreezes the melt water at the bottom of the coil and builds up over days.

Running like that is destructive — the coil cannot absorb heat, suction pressure collapses, and the compressor suffers.`,source:c.todo("Confirm the defrost failure diagnosis against your service text."),status:"draft"},Qh={...de,id:"hvac.9.3.dual-fuel",objective:"9.3",kind:"choice",difficulty:3,prompt:"What is a dual-fuel (hybrid) system, and what decides which heat source runs?",choices:["A heat pump paired with a gas furnace, switching at an outdoor temperature where gas becomes cheaper or the heat pump runs out","A furnace that can burn both natural gas and propane","A heat pump with two compressors","A system with both electric strips and a heat pump"],answer:0,explain:`The heat pump handles mild weather, where its COP makes it the cheaper source. Below a changeover temperature the furnace takes over entirely — the compressor locks out.

Where to set the changeover is an economic calculation as much as a capacity one: it depends on local electricity and gas prices, and on where the heat pump's capacity falls off.

Note the difference from a heat pump with electric strips, where aux **supplements** the running compressor. In dual fuel they do not run together — the furnace replaces the heat pump rather than helping it.`,source:c.todo("Confirm the dual fuel discussion against your text."),status:"draft"},Yh={...de,id:"hvac.9.5.line-naming",objective:"9.5",kind:"choice",difficulty:3,prompt:'On a heat pump, why are the two refrigerant lines called the "vapour line" and "liquid line" rather than "suction" and "discharge"?',choices:["Because the reversing valve swaps their roles, so a line that carries suction gas in cooling carries hot discharge gas in heating","Because heat pumps use different tubing materials","Because both lines carry vapour at all times","It is an arbitrary manufacturer convention"],answer:0,explain:`In cooling, the large line carries cool suction vapour from the indoor coil. In heating, that same line carries hot discharge gas *to* the indoor coil.

Calling it "the suction line" would be wrong half the time, so the naming describes the state of the refrigerant — vapour versus liquid — which stays true in both modes.

It matters practically: that line gets genuinely hot in heating mode, and insulation and clearances have to account for it.`,source:c.todo("Confirm heat pump line naming against your text."),status:"draft"},Jh={...de,id:"hvac.9.3.emergency-heat-test",objective:"9.3",kind:"choice",difficulty:2,prompt:`A customer says their heat pump is not heating. Switching the thermostat to emergency heat produces warm air.

What has that told you?`,choices:["The strips and blower work — the fault is in the heat pump side: compressor, charge, reversing valve or defrost","The thermostat is faulty","The problem is with the ductwork","Nothing useful"],answer:0,explain:`Emergency heat locks the compressor off and heats with the strips alone. If that works, then the blower, the strips, the thermostat wiring for W and G, and the indoor unit are all fine.

Everything that remains is on the heat pump side: the compressor, the charge, the reversing valve, or the defrost control.

It is a thirty-second test that cuts the problem space in half, and it is one of the few diagnostics you can talk a customer through over the phone.`,source:c.todo("Confirm the emergency heat test against your service text."),status:"draft"},Xh={...de,id:"hvac.9.4.sizing-tradeoff",objective:"9.4",kind:"choice",difficulty:3,prompt:"Why is a heat pump not simply sized large enough to meet the heating load at the coldest design temperature?",choices:["It would be badly oversized for cooling, short-cycling all summer and leaving the house humid","Larger heat pumps are not manufactured","The electrical service could not support it","It would never reach its balance point"],answer:0,explain:`A heat pump does both jobs with one piece of equipment, and the two loads do not match. Size it for the coldest night and it is far too big for the cooling season.

An oversized cooling system short-cycles: it satisfies the thermostat quickly, shuts off before the coil has removed much moisture, and leaves the house cool and clammy.

So it is sized for the cooling load, and auxiliary heat covers the shortfall below the balance point. Variable-capacity equipment softens this trade considerably, which is much of why it has taken over in colder climates.`,source:c.todo("Confirm heat pump sizing guidance against your text or ACCA Manual J/S."),status:"draft"},Kh=[Uh,Gh,_h,Qh,Yh,Jh,Xh],ae={track:"hvac",domain:"10.0"},Zh={...ae,id:"hvac.10.1.what-changed",objective:"10.1",kind:"choice",difficulty:2,prompt:`A system worked fine for six years and stopped last week. Nothing about the building changed.

What does that timeline tell you?`,choices:["Look for something that wears out or drifts — a capacitor, a contactor, a slow leak, a fouled coil","The system was never sized correctly","The ductwork must be undersized","The refrigerant type is wrong"],answer:0,explain:`Six years of working correctly rules out design and installation faults. Undersized ducts do not start being undersized in year six.

What changes with time is condition: capacitors drift out of tolerance, contactor contacts burn, coils foul, refrigerant leaks slowly, bearings wear.

The opposite timeline points the other way — a system that has never worked properly since installation is a design or installation problem, and no amount of component replacement will fix it.`,source:c.todo("Confirm the diagnostic reasoning against your service text."),status:"draft"},ed={...ae,id:"hvac.10.1.intermittent",objective:"10.1",kind:"choice",difficulty:3,prompt:`A fault only appears on the hottest afternoons and the system works fine when you visit in the morning.

What approach fits?`,choices:["Look for something marginal that fails under load or heat — a weak capacitor, a dirty condenser, high head pressure","Replace the compressor, since intermittent faults are always mechanical","Tell the customer it is working correctly","Wait for it to fail permanently"],answer:0,explain:`Load-dependent faults are marginal components pushed past their limit. Heat raises head pressure and amp draw, so anything already weak gives up at the worst moment.

Candidates: a capacitor that measures low but not failed, a condenser that is dirty enough to matter only at 100°F, a contactor with pitted contacts, a supply circuit with excessive voltage drop.

Measure what you can and judge against the bands rather than against "works or does not". A capacitor at 91% of rating is a finding even though the system is running while you stand there.`,source:c.todo("Confirm the intermittent fault approach against your service text."),status:"draft"},td={...ae,id:"hvac.10.2.minimum-reading-set",objective:"10.2",kind:"multi",difficulty:3,prompt:"Which readings are needed to calculate superheat, subcooling AND condenser split? Select all that apply.",choices:["Suction pressure","Suction line temperature","Liquid pressure","Liquid line temperature","Outdoor ambient temperature","Indoor wet bulb temperature","Compressor running amps"],answers:[0,1,2,3,4],explain:`Five readings, and they are efficient because one of them serves twice:

**Superheat** = suction line temp − sat(suction pressure)
**Subcooling** = sat(liquid pressure) − liquid line temp
**Condenser split** = sat(liquid pressure) − ambient

Indoor wet bulb is needed for a fixed-orifice charging **target**, and amps tell you about compressor work — both genuinely useful, but neither appears in any of these three calculations.

Add return and supply air temperature to the five and you have the air side too. Seven readings, and almost every cooling fault becomes distinguishable.`,source:c.standard("Superheat, subcooling and condenser split definitions"),status:"verified"},ad={...ae,id:"hvac.10.2.amps-interpretation",objective:"10.2",kind:"match",difficulty:3,prompt:"Match each compressor amp reading against RLA to what it suggests.",pairs:[["Well below RLA","Not doing work — a failing compressor, or very low charge"],["At or near RLA","Working hard — high head pressure, overcharge, or a hot day"],["Above RLA","Overloaded — will trip on its protector; check head pressure and voltage"],["Locked rotor current","Not turning at all — capacitor, seized compressor or start problem"]],explain:`Amps measure how much work the compressor is doing, which is a genuinely different question from what the pressures say.

The reading that surprises people is **low** amps. It feels like good news and it usually is not — a compressor that is not pumping draws little current, and that is the signature that confirms the pressures-converging pattern.

How should you proceed?`,choices:["Fix the airflow first, let it stabilise, then re-measure — airflow affects every other reading","Add refrigerant to correct the subcooling, then change the filter","Change the filter and leave, since airflow was clearly the problem","Both readings cannot be right; re-measure"],answer:0,explain:`Systems can have more than one thing wrong, and the order you fix them in matters.
