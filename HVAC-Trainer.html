Knowing which side you are standing at tells you which gauge should read what, and that alone catches a surprising number of mistakes.`,source:c.standard("Standard vapour-compression cycle"),status:"verified"},Cn={...q,id:"hvac.2.4.hotspot-superheat-location",objective:"2.4",kind:"hotspot",difficulty:3,topology:Qe,prompt:"You are measuring superheat. Click the component whose OUTLET line you clamp the thermometer to.",answer:"evap",whyWrong:{cond:"The condenser outlet is the liquid line — that is where you measure for subcooling.",comp:"The compressor outlet is the hot gas discharge line, which is a different measurement.",meter:"The metering device outlet carries a liquid-vapour mixture, still at saturation."},explain:`Superheat is measured on the suction line — the evaporator outlet, running back to the compressor. Clamp the thermometer about six inches from the service valve and insulate it from ambient air.

Then read the low-side gauge, convert to saturation temperature, and subtract. Superheat = suction line temperature − evaporator saturation temperature.

Subcooling is the mirror image: measured at the condenser outlet, on the liquid line.`,source:c.standard("Superheat measurement — standard refrigeration practice"),status:"verified"},An={...q,id:"hvac.2.3.what-saturation-means",objective:"2.3",kind:"choice",difficulty:2,prompt:'What does it mean for a refrigerant to be "saturated"?',choices:["Liquid and vapour coexist in equilibrium, so pressure and temperature are locked together","The refrigerant has absorbed all the heat it can","The system is overcharged","The refrigerant is contaminated with moisture"],answer:0,explain:`Saturation is the condition where liquid and vapour exist together. While that is true, pressure and temperature move as a pair — know one and a P-T chart gives you the other.

That state exists in the boiling section of the evaporator and the condensing section of the condenser, and nowhere else. Outside those regions the two become independent, which is exactly what superheat and subcooling measure.`,source:c.standard("Saturation properties — standard thermodynamics"),status:"verified"},Sn={...q,id:"hvac.2.3.reading-a-chart",objective:"2.3",kind:"choice",difficulty:2,prompt:`Your low-side gauge reads 118 psig on an R-410A system, and the suction line measures 68°F.

What is the superheat?`,choices:["28°F","50°F","68°F","Cannot be determined without the subcooling"],answer:0,whyWrong:{1:"That would be the saturation temperature subtracted from something else.",2:"That is just the line temperature.",3:"Superheat and subcooling are independent measurements."},explain:`118 psig on the R-410A scale is a saturation temperature of about 40°F.

Superheat = suction line temperature − saturation temperature = 68 − 40 = **28°F**.

That is high. A TXV system should hold 8–12°F, so 28°F says the coil is starving — either an undercharge or a restriction. Subcooling would tell you which.`,source:c.standard("R-410A saturation at 118 psig ≈ 40°F"),status:"verified"},Rn={...q,id:"hvac.2.5.negative-subcooling",objective:"2.5",kind:"choice",difficulty:2,prompt:`You calculate subcooling and get −8°F.

What has most likely happened?`,choices:["You subtracted in the wrong direction","The system has negative subcooling, which indicates an overcharge","The liquid line is colder than possible","The gauge is reading incorrectly"],answer:0,explain:`Subcooling counts DOWN from saturation: condensing temperature − liquid line temperature. Superheat counts UP: suction line temperature − saturation temperature.

The two subtract in opposite directions, and mixing them up is the single most common arithmetic error in this work. A negative result is the clue that you did.

Genuine zero subcooling is possible — it means no liquid is stacked in the condenser at all, a severe undercharge — but a *negative* number is not physically meaningful.`,source:c.standard("Subcooling definition — standard refrigeration practice"),status:"verified"},Fn={...q,id:"hvac.2.6.split-calculation",objective:"2.6",kind:"input",difficulty:2,prompt:`An R-410A system reads 365 psig on the high side, and outdoor ambient is 95°F.

What is the condenser split, in °F? (365 psig ≈ 110°F saturation.)`,placeholder:"°F",accept:["15"],tolerance:2,explain:`Condenser split = condensing temperature − outdoor ambient = 110 − 95 = **15°F**.

For a standard-efficiency unit that would be unusually tight; for a high-efficiency unit with its larger coil it is right in the expected 15–20°F band.

The split is more useful than head pressure alone because it already accounts for the weather. 365 psig sounds high until you notice it is 95°F outside.`,source:c.standard("Arithmetic: 110 − 95"),status:"verified"},qn={...q,id:"hvac.2.6.why-head-pressure-costs",objective:"2.6",kind:"choice",difficulty:3,prompt:"Why does high head pressure reduce capacity as well as raising running cost?",choices:["The compressor works harder per pound moved, and less refrigerant flows for the same effort","High pressure makes the refrigerant leak faster","It causes the metering device to close","It has no effect on capacity, only on amps"],answer:0,explain:`The compressor has to lift refrigerant from suction pressure to discharge pressure. Raise the discharge side and that lift gets bigger, so each pound of refrigerant costs more energy — amps go up.

At the same time the compressor moves less refrigerant per revolution, because more of the cylinder volume is taken up re-expanding gas left over from the previous stroke. Less flow means less capacity.

So high head pressure costs you twice: more power in, less cooling out. That is why a dirty condenser is not a minor efficiency issue.`,source:c.todo("Confirm the compression ratio discussion against your text."),status:"draft"},$n=[un,Tn,xn,pn,mn,fn,An,gn,Sn,wn,Cn,yn,bn,Rn,vn,kn,Fn,qn],R={track:"hvac",domain:"3.0"},In={...R,id:"hvac.3.1.families",objective:"3.1",kind:"match",difficulty:2,prompt:"Match each refrigerant to its family.",pairs:[["R-12","CFC — chlorofluorocarbon, fully phased out"],["R-22","HCFC — hydrochlorofluorocarbon, phased out of new equipment"],["R-410A","HFC blend — no chlorine, so no ozone depletion"],["R-134a","HFC — single compound, no chlorine"],["R-717","Ammonia — an inorganic refrigerant used in industrial plant"]],explain:`Chlorine is the ozone-depleting element, which is what drove the phase-outs: CFCs first (most chlorine), then HCFCs. HFCs have no chlorine and no ozone impact, but many have high global warming potential, which is what is now driving the move to lower-GWP alternatives and HFO blends.

The 700 series is the inorganics, numbered by molecular weight — ammonia is 17, so R-717.`,source:c.todo("Confirm the family assignments against current EPA 608 preparation material."),status:"draft"},Mn={...R,id:"hvac.3.1.blend-charging",objective:"3.1",kind:"choice",difficulty:3,prompt:"Why must a zeotropic or near-azeotropic blend such as R-410A be charged as a liquid rather than as a vapour?",choices:["The components evaporate at different rates, so vapour charging would change the blend proportions","Liquid charging is faster","Vapour charging would damage the gauges","The blend would freeze if charged as a vapour"],answer:0,explain:`A blend is a mixture of components with different boiling points. Draw vapour off the top of a cylinder and the more volatile component leaves preferentially, so what goes into the system is no longer the blend on the label — and what remains in the cylinder is not either.

Charging liquid takes the whole mixture in its correct proportions. To avoid slugging the compressor, meter that liquid into the suction line slowly through a restrictor, or charge into the high side with the system off.

The same logic means a leaking blend system should be recovered and recharged rather than topped up: the composition of what leaked out may not match the label.`,source:c.todo("Confirm the blend charging procedure against your text or EPA 608 material."),status:"draft"},Pn={...R,id:"hvac.3.2.oil-types",objective:"3.2",kind:"choice",difficulty:2,prompt:"Which oil is used with R-410A, and what is the practical consequence?",choices:["POE, which is strongly hygroscopic — it absorbs moisture rapidly from the air","Mineral oil, which must be kept warm to stay fluid","Alkylbenzene, which requires no special handling","Any oil, since modern refrigerants are compatible with all of them"],answer:0,explain:`R-410A and other HFCs use POE (polyolester) oil, because mineral oil will not return through the system with them.

The handling consequence is significant: POE pulls moisture out of the air fast, and it does not give it back easily. An open container of POE, or a system left open to atmosphere, takes on water that a normal evacuation struggles to remove. Water plus POE produces acid, and acid takes out compressors.

Practically: cap lines immediately, keep POE containers sealed, purge with nitrogen while brazing, and evacuate to 500 microns with a decay test rather than by the clock.`,source:c.todo("Confirm oil compatibility against your text."),status:"draft"},Wn={...R,id:"hvac.3.3.recover-recycle-reclaim",objective:"3.3",kind:"match",difficulty:2,prompt:"Match each term to its definition under the EPA rules.",pairs:[["Recover","Remove refrigerant from a system and store it in a container, with no processing"],["Recycle","Clean refrigerant in the field with oil separation and filter-drying"],["Reclaim","Reprocess to virgin specification and verify by chemical analysis at a licensed facility"]],explain:`The three are a ladder of how thoroughly the refrigerant is cleaned, and the distinction has legal weight rather than being a matter of vocabulary.

Recovered refrigerant may go back into the same system or one owned by the same person. Refrigerant sold to a different owner must be reclaimed to the ARI-700 purity standard by a certified reclaimer — recycling in the field is not sufficient for that.`,source:c.standard("40 CFR Part 82, Subpart F"),status:"verified"},En={...R,id:"hvac.3.3.recovery-before-opening",objective:"3.3",kind:"choice",difficulty:2,prompt:"Before opening a small appliance or an air conditioning system for repair, what does the EPA require?",choices:["Recover the refrigerant to the required evacuation level for that equipment type","Vent the refrigerant slowly to reduce environmental impact","Nothing, provided the charge is under 5 pounds","Recover only if the refrigerant is a CFC or HCFC"],answer:0,whyWrong:{1:"Knowingly venting is prohibited regardless of how slowly it is done.",2:"The prohibition applies regardless of charge size.",3:"The venting prohibition was extended to substitutes including HFCs."},explain:`Knowingly venting refrigerant during maintenance, service, repair or disposal is prohibited. The required recovery level depends on the equipment type and size, and on whether the recovery equipment was manufactured before or after November 1993.

There are narrow exceptions — de minimis releases while connecting and disconnecting gauges, and purging of non-condensables that contain only trace refrigerant. Those are exceptions about unavoidable small losses, not permission to release a charge.`,source:c.standard("40 CFR §82.154 (prohibitions) and §82.156 (required practices)"),status:"verified"},jn={...R,id:"hvac.3.4.cylinder-fill-limit",objective:"3.4",kind:"choice",difficulty:2,prompt:"To what level may a recovery cylinder be filled, and why?",choices:["80% of capacity by weight, to leave room for the liquid to expand if it warms","100%, since the cylinder is rated for the pressure","50%, to keep the cylinder light enough to carry","95%, measured by pressure rather than weight"],answer:0,whyWrong:{1:"A liquid-full cylinder has nowhere to expand and can rupture from hydrostatic pressure alone.",2:"50% is unnecessarily conservative and is not the rule.",3:"Fill level must be determined by weight on a scale, not by pressure."},explain:`The 80% limit exists because liquids are nearly incompressible. A cylinder filled solid with liquid that then warms in a van has no vapour space to absorb the expansion, and the pressure rises catastrophically — far past the relief setting, fast.

Fill by weight on a scale. A pressure gauge cannot tell you how full a cylinder is, because the pressure only reflects temperature as long as any liquid remains.

Also: never refill a disposable cylinder, and never mix refrigerants in a recovery cylinder — a mixed cylinder cannot be reclaimed and becomes disposal.`,source:c.standard("40 CFR Part 82, Subpart F; DOT cylinder requirements"),status:"verified"},On={...R,id:"hvac.3.5.pressure-test-gas",objective:"3.5",kind:"choice",difficulty:3,prompt:"What should be used to pressure-test a system for leaks, and what must never be used?",choices:["Dry nitrogen with a regulator; never oxygen, and never compressed air with refrigerant present","Oxygen, because it is readily available on most job sites","Compressed air, because it is free","The system refrigerant itself, pressurised with the compressor"],answer:0,explain:`Dry nitrogen is inert, dry, and cheap. Always through a regulator — cylinder pressure is thousands of psi and will burst a system component instantly.

Oxygen is the dangerous mistake. Oxygen under pressure in contact with oil produces violent combustion. Never put oxygen in a refrigeration system for any reason.

Compressed air brings moisture with it, and if refrigerant is present it can form a combustible mixture under pressure. Using refrigerant as a trace gas at pressure is also a venting problem — a small nitrogen-with-trace-refrigerant charge is the accepted approach where an electronic detector needs something to find.`,source:c.todo("Confirm pressure-testing practice against your text and the equipment manufacturer."),status:"draft"},Ln={...R,id:"hvac.3.5.nitrogen-while-brazing",objective:"3.5",kind:"choice",difficulty:3,prompt:"Why flow a low-pressure nitrogen purge through the tubing while brazing?",choices:["To displace oxygen and prevent copper oxide scale forming inside the tubing","To cool the joint so the braze sets faster","To pressure-test the joint at the same time","To keep the refrigerant from escaping"],answer:0,explain:`Heating copper in the presence of oxygen produces a black flaky oxide on the inside surface. That scale breaks loose once the system runs and travels with the refrigerant, where it plugs metering devices and driers and contaminates the compressor.

A gentle nitrogen flow — a few CFH, just enough to displace air, not enough to blow the molten braze out — leaves the inside of the joint bright. You only get one chance at this; scale cannot be cleaned out afterwards.

There should be no refrigerant in the system at all while brazing. Heating refrigerant produces toxic decomposition products.`,source:c.todo("Confirm brazing practice against your text."),status:"draft"},Nn={...R,id:"hvac.3.6.608-types",objective:"3.6",kind:"match",difficulty:2,prompt:"Match each EPA Section 608 certification type to what it covers.",pairs:[["Type I","Small appliances — factory-charged with 5 lb or less"],["Type II","High-pressure and very high-pressure appliances"],["Type III","Low-pressure appliances, such as centrifugal chillers"],["Universal","All three types, by passing all three sections"]],explain:`Every candidate must also pass a Core section covering the science, regulations and safety common to all of them. The Core alone does not certify you for anything — it is a prerequisite for the type sections.

Most residential and light commercial work is Type II. Certification does not expire.`,source:c.standard("40 CFR §82.161 (technician certification)"),status:"verified"},Hn={...R,id:"hvac.3.6.who-must-be-certified",objective:"3.6",kind:"choice",difficulty:2,prompt:"Who is required to hold Section 608 certification?",choices:["Anyone who maintains, services, repairs or disposes of equipment that could release refrigerant","Only technicians who own their own recovery equipment","Only technicians working on commercial equipment","Only technicians handling CFC and HCFC refrigerants"],answer:0,explain:`The requirement follows the activity, not the job title or the refrigerant. Anyone opening a system in a way that could release refrigerant needs the appropriate certification.

It also gates purchasing: refrigerant sales are restricted to certified technicians. Certification does not expire, and you are required to keep proof of it available.`,source:c.standard("40 CFR §82.161; §82.164 (refrigerant sales restriction)"),status:"verified"},Dn={...R,id:"hvac.3.1.chlorine-ozone",objective:"3.1",kind:"choice",difficulty:2,prompt:"Which element in older refrigerants is responsible for ozone depletion?",choices:["Chlorine","Fluorine","Carbon","Hydrogen"],answer:0,explain:`Chlorine is the ozone-destroying element, and the phase-out order follows how much of it each family contains.

CFCs have the most and went first. HCFCs — the H is hydrogen, which makes them break down lower in the atmosphere — have less and were phased out of new equipment by 2010. HFCs have none at all.

HFCs are not environmentally free, though: many have high global warming potential, which is what is driving the current move to lower-GWP alternatives.`,source:c.todo("Confirm the ozone depletion discussion against your EPA 608 material."),status:"draft"},Bn={...R,id:"hvac.3.1.r410a-pressure",objective:"3.1",kind:"choice",difficulty:2,prompt:"Why can R-410A not simply be put into a system designed for R-22?",choices:["R-410A runs at roughly 60% higher pressure and needs components rated for it, plus different oil","R-410A is chemically incompatible with copper","R-410A requires a larger metering device only","It can be, provided the charge is reduced"],answer:0,explain:`R-410A operates at substantially higher pressures — around 118 psig at 40°F where R-22 is 68.5 psig, and over 400 psig on the high side on a hot day. Components, service valves and even gauges have to be rated for it.

It also uses POE oil rather than mineral oil, and the two do not mix well. Residual mineral oil in an old system will not return properly with R-410A.

The general principle: retrofitting refrigerants is a manufacturer-specified procedure, not something to improvise.`,source:c.todo("Confirm retrofit guidance against your text and manufacturer literature."),status:"draft"},zn={...R,id:"hvac.3.2.acid-formation",objective:"3.2",kind:"choice",difficulty:3,prompt:`A compressor fails eighteen months after a repair. The oil tests acidic.

What most likely happened at the time of the repair?`,choices:["Moisture was left in the system because it was not properly evacuated","The wrong refrigerant was used","The compressor was undersized","The system was overcharged"],answer:0,explain:`Water plus POE oil produces acid. Acid attacks motor windings and bearing surfaces, and the failure comes months or years later — long enough that the connection to the original repair is usually never made.

The sequence is: system opened, moisture gets in, evacuation done by the clock rather than to 500 microns with a decay test, water sealed inside, acid forms slowly, compressor dies.

This is why the evacuation procedure is not bureaucracy. It is the difference between a repair that lasts and one that quietly destroys the most expensive component in the system.`,source:c.todo("Confirm the acid formation discussion against your text."),status:"draft"},Vn={...R,id:"hvac.3.2.filter-drier",objective:"3.2",kind:"multi",difficulty:2,prompt:"What does a filter drier do? Select all that apply.",choices:["Adsorbs moisture from the refrigerant","Traps particulate contamination","Adsorbs acid formed in the system","Adds refrigerant to the system"],answers:[0,1,2],explain:`All three of the first ones. The desiccant core holds moisture and acid; the filter media catches particles that would otherwise plug the metering device.

A drier has finite capacity, which is why it is replaced whenever the system is opened. A saturated drier stops protecting and can itself become a restriction — which is one of the more common causes of the high-superheat-with-high-subcooling signature.

Note the direction arrow on the body. Fitting one backwards is easy and defeats the purpose.`,source:c.todo("Confirm the filter drier discussion against your text."),status:"draft"},Un={...R,id:"hvac.3.3.same-owner",objective:"3.3",kind:"choice",difficulty:3,prompt:`You recover refrigerant from one customer's system. Another customer needs a charge.

Can you put the recovered refrigerant into the second system?`,choices:["Not without reclaiming it to ARI-700 specification at a certified reclaimer first","Yes, provided it is the same refrigerant type","Yes, provided you run it through a recovery machine filter","Yes, there is no restriction on recovered refrigerant"],answer:0,explain:`Recovered refrigerant may go back into the **same system**, or into one owned by the **same person**. Moving it to a different owner requires reclamation to virgin specification, verified by chemical analysis at a licensed facility.

Field recycling — oil separation and filter-drying through a recovery machine — is not sufficient for that. The distinction is legal, not a matter of how clean you think it is.`,source:c.standard("40 CFR Part 82, Subpart F"),status:"verified"},Gn={...R,id:"hvac.3.4.cylinder-by-weight",objective:"3.4",kind:"choice",difficulty:2,prompt:"Why must recovery cylinder fill level be determined by weight rather than by pressure?",choices:["Pressure only reflects temperature while any liquid remains, so it says nothing about how full the cylinder is","Pressure gauges are not accurate enough","Weight is required by DOT but pressure would work","Pressure readings vary with the refrigerant type"],answer:0,explain:`While liquid and vapour coexist in the cylinder, the pressure is simply the saturation pressure at that temperature. A cylinder 10% full and one 79% full read exactly the same at the same temperature.

Pressure only starts rising sharply once the cylinder is liquid-full — at which point you are already past the danger point. By then the reading is warning you far too late.

Put it on a scale. Know the tare weight, know the 80% limit, and watch the number.`,source:c.standard("40 CFR Part 82, Subpart F; DOT cylinder requirements"),status:"verified"},_n={...R,id:"hvac.3.4.never-mix",objective:"3.4",kind:"choice",difficulty:2,prompt:`A recovery cylinder has R-22 in it. You are about to recover R-410A from another job.

What must you do?`,choices:["Use a different cylinder — mixed refrigerant cannot be reclaimed and becomes disposal","Top it up; the reclaimer will separate them","Recover into it but label the cylinder as mixed","Vent the R-22 first, then recover the R-410A"],answer:0,whyWrong:{1:"Reclaimers cannot economically separate mixed refrigerants and will reject the cylinder.",2:"Labelling does not make it reclaimable — it just documents that it is waste.",3:"Venting is illegal."},explain:`Mixed refrigerant cannot be reclaimed. The cylinder becomes hazardous waste, which you pay to dispose of, and you lose the value of both refrigerants.

Keep a dedicated cylinder per refrigerant, labelled clearly. It is a small amount of organisation that avoids an expensive and entirely self-inflicted problem.`,source:c.todo("Confirm cylinder handling practice against your text and EPA 608 material."),status:"draft"},Qn={...R,id:"hvac.3.5.find-the-leak",objective:"3.5",kind:"choice",difficulty:2,prompt:"A system is low on charge. What is the correct response?",choices:["Find and repair the leak, then evacuate and weigh in a full charge","Add refrigerant to bring it back to spec and note it for next season","Add refrigerant and a leak-sealing additive","Recover the remaining charge and replace the compressor"],answer:0,explain:`Refrigerant is not consumed — it runs in a sealed loop. If a system is low, it leaked, and adding more without finding the leak means the customer pays again next season.

Repeatedly topping up a leaking system is also a regulatory problem for larger equipment, which has leak-rate thresholds and repair requirements.

Leak sealants are controversial at best: they can plug metering devices and contaminate recovery equipment. Most manufacturers void warranty coverage over them.`,source:c.todo("Confirm leak repair guidance against your text and the leak repair provisions of 40 CFR Part 82."),status:"draft"},Yn={...R,id:"hvac.3.6.core-section",objective:"3.6",kind:"choice",difficulty:2,prompt:"What does passing only the Core section of the EPA 608 exam certify you to do?",choices:["Nothing on its own — Core is a prerequisite that must be paired with a type section","Work on small appliances","Purchase refrigerant but not service equipment","Work on any equipment under supervision"],answer:0,explain:`Core covers the science, regulations and safety common to all types, and every candidate must pass it. But it certifies you for no equipment by itself.

You need Core **plus** at least one type: Type I for small appliances, Type II for high pressure (most residential and light commercial), Type III for low pressure. Pass all three type sections and you hold Universal.

Certification does not expire.`,source:c.standard("40 CFR §82.161"),status:"verified"},Jn=[In,Dn,Bn,Mn,Pn,zn,Vn,Wn,Un,En,jn,Gn,_n,On,Qn,Ln,Nn,Yn,Hn],$={track:"hvac",domain:"4.0"},Xn={...$,id:"hvac.4.1.device-comparison",objective:"4.1",kind:"match",difficulty:2,prompt:"Match each metering device to how it behaves.",pairs:[["Fixed orifice / piston","No moving parts; flow varies only with pressure difference"],["Capillary tube","A long small-bore tube; flow set by its length and diameter"],["TXV","Modulates to hold a constant superheat as load changes"],["EEV","Electronically controlled, with the widest operating range and fastest response"]],explain:`The dividing line is whether the device responds to load. A fixed orifice or cap tube passes whatever the pressure difference pushes through it — cheap, reliable, and only correct at one operating condition. A TXV senses suction line temperature through its bulb and adjusts to hold superheat steady across a wide range.

This difference determines how you charge the system, which is the practical consequence worth remembering.`,source:c.todo("Confirm the device comparison against your text."),status:"draft"},Kn={...$,id:"hvac.4.1.txv-forces",objective:"4.1",kind:"choice",difficulty:3,prompt:"Which three forces act on a thermostatic expansion valve diaphragm?",choices:["Bulb pressure opening it, evaporator pressure and spring pressure closing it","Bulb pressure closing it, evaporator pressure and spring pressure opening it","Head pressure, suction pressure and ambient pressure","Only bulb pressure and spring pressure"],answer:0,explain:`The sensing bulb, mounted on the suction line, is the opening force: as the line warms, the charge in the bulb expands and pushes the valve open to feed more refrigerant. Evaporator pressure and the adjustable superheat spring both push closed.

The valve settles wherever those balance, which is what holds superheat roughly constant. It also explains the classic failure: a bulb that has come loose senses room air instead of the suction line, reads that as "too warm", and holds the valve wide open — flooding the evaporator and driving superheat toward zero.

Bulb mounting matters. Clean contact, a proper clamp, insulation over it, and on horizontal line at the 10 or 2 o'clock position so it senses liquid in the line rather than oil in the bottom of it.`,source:c.todo("Confirm the TXV force balance against your text."),status:"draft"},Zn={...$,id:"hvac.4.2.method-by-device",objective:"4.2",kind:"choice",difficulty:2,prompt:`You are charging a system that has a TXV.

Which measurement should you charge by, and why?`,choices:["Subcooling, because the TXV holds superheat constant regardless of charge","Superheat, because it is the standard charging measurement","Either, since both respond to charge equally","Suction pressure alone"],answer:0,whyWrong:{1:"Superheat is the fixed-orifice method. On a TXV it stays near 10°F whether the system is correctly charged or considerably over.",2:"They do not respond equally — that is the entire point.",3:"Suction pressure varies with load and ambient and cannot indicate charge on its own."},explain:`A TXV modulates to hold superheat at its setting. Add refrigerant and the valve throttles back; remove some and it opens. Superheat therefore barely moves until the valve runs out of authority entirely, which means it cannot tell you about charge.

Subcooling can, because excess refrigerant has to go somewhere and the condenser is where it stacks up. Target is typically 8–12°F — check the nameplate, which often specifies it.

The rule to hold: TXV → charge by subcooling. Fixed orifice → charge by superheat, using the manufacturer's chart with indoor wet bulb and outdoor dry bulb.`,source:c.todo("Confirm the charging methods against your text and a manufacturer charging chart."),status:"draft"},er={...$,id:"hvac.4.2.superheat-inputs",objective:"4.2",kind:"multi",difficulty:3,prompt:"To find the target superheat for a fixed-orifice system from the charging chart, which measurements do you need? Select all that apply.",choices:["Indoor wet bulb temperature at the return","Outdoor dry bulb temperature","Liquid line temperature","The refrigerant type"],answers:[0,1],explain:`The chart is indexed on indoor wet bulb and outdoor dry bulb, and nothing else. Those two describe the load the coil is seeing and the conditions the condenser is rejecting into.

Indoor WET bulb specifically, not dry bulb — because the coil's job includes removing moisture, and wet bulb is what captures the total heat content of the entering air. Using dry bulb gives the wrong target, often badly.

Liquid line temperature is for subcooling. The refrigerant type matters for converting pressure to saturation temperature, but it does not change the target superheat.`,source:c.todo("Confirm against a manufacturer superheat charging chart."),status:"draft"},tr={...$,id:"hvac.4.4.line-set-adjustment",objective:"4.4",kind:"choice",difficulty:3,prompt:`A condenser nameplate reads "factory charge 8 lb 4 oz, for 15 ft of line set. Add 0.6 oz per foot over 15 ft." The installed line set is 40 ft.

What total charge should be weighed in?`,choices:["9 lb 3 oz","8 lb 4 oz","10 lb 8 oz","8 lb 10 oz"],answer:0,explain:`40 ft − 15 ft = 25 ft of extra line. 25 × 0.6 oz = 15 oz. Adding that to 8 lb 4 oz gives 8 lb 19 oz, which is 9 lb 3 oz.

Weighing in is the most accurate charging method available and the right approach after any repair where the system was evacuated. Superheat and subcooling then confirm the result rather than establishing it.

The line-set adjustment is not optional on a long run. A 40 ft line set holds meaningfully more refrigerant than a 15 ft one, and charging to the bare nameplate figure leaves the system undercharged.`,source:c.standard("Arithmetic: 8 lb 4 oz + (25 ft × 0.6 oz/ft)"),status:"verified"},ar={...$,id:"hvac.4.5.signature-table",objective:"4.5",kind:"match",difficulty:3,prompt:"Match each superheat/subcooling pairing to what it indicates.",pairs:[["High superheat, low subcooling","Undercharge or a leak"],["High superheat, high subcooling","Restriction in the liquid line or metering device"],["Low superheat, high subcooling","Overcharge"],["Low superheat, low subcooling","Metering device overfeeding"]],explain:`This table is the single most useful thing in refrigerant-side diagnosis, and it only works when you read both numbers together.

Superheat alone cannot separate an undercharge from a restriction — both starve the evaporator and both drive superheat up. Subcooling is what distinguishes them: an undercharge has too little refrigerant to stack in the condenser, while a restriction backs refrigerant up behind it and stacks MORE.

Reading superheat alone and adding refrigerant to a restricted system makes it worse and leaves the system overcharged once the restriction is finally found.`,source:c.todo("Confirm the signature table against your service text."),status:"draft"},ir={...$,id:"hvac.4.5.overcharge-damage",objective:"4.5",kind:"choice",difficulty:2,prompt:`A technician tops up a system that was already correctly charged, because "the suction pressure looked a little low".

What is the likely outcome?`,choices:["Higher head pressure, higher amps, reduced capacity, and risk of compressor damage","Improved cooling and lower running cost","No effect — systems tolerate extra refrigerant","The excess refrigerant will vent through the relief valve"],answer:0,explain:`Excess refrigerant floods the lower condenser rows, reducing the surface available for condensing. Head pressure rises, compression ratio rises, amps rise, and capacity falls — the opposite of the intent.

Push it far enough and liquid reaches the compressor, at which point it stops being an efficiency question. Residential split systems have no relief valve to vent the excess.

Suction pressure on its own means very little. It varies with indoor load, airflow and ambient. Adding refrigerant on the basis of one gauge, without superheat and subcooling, is how correctly charged systems end up damaged.`,source:c.todo("Confirm the overcharge symptoms against your service text."),status:"draft"},or={...$,id:"hvac.4.5.non-condensables-source",objective:"4.5",kind:"choice",difficulty:3,prompt:`A system repaired last month now shows high head pressure and a high condenser split, but the coil is clean, the fan runs well, and subcooling is normal.

What is the most likely cause?`,choices:["Non-condensables — air left in the system because it was not properly evacuated","The condenser coil has become dirty since the repair","The system is undercharged","The metering device has failed"],answer:0,explain:`The contradiction is the clue. A high split says heat is not leaving the condenser, but a clean coil and a working fan say there is no physical reason for that. Air trapped in the system takes up condenser volume and adds its own partial pressure on top of the refrigerant's.

That it followed a repair points straight at evacuation. Air gets in when a system is opened and does not come out on its own — only a deep vacuum removes it, which is why the 500-micron target and the decay test exist.

The fix is recovery, evacuation and a fresh weighed charge. There is no way to bleed the air out selectively.`,source:c.todo("Confirm the non-condensable diagnosis against your service text."),status:"draft"},sr={...$,id:"hvac.4.1.loose-bulb",objective:"4.1",kind:"choice",difficulty:3,prompt:`A TXV system shows near-zero superheat and the suction line is sweating back to the compressor. The charge was weighed in correctly last week.

What should you check first?`,choices:["Whether the TXV sensing bulb is still properly clamped and insulated on the suction line","The condenser coil for dirt","The compressor windings","The outdoor fan motor"],answer:0,explain:`A bulb that has come loose senses room air instead of the suction line. Room air is warm compared to a suction line, so the valve reads that as "far too much superheat" and holds itself wide open — flooding the evaporator.

The charge being known-correct is what points here rather than at an overcharge. Both produce low superheat, but only one of them is consistent with a charge you weighed in yourself.

It is a mundane fix and a genuinely common one. Re-secure the bulb, clean contact, proper clamp, insulated over the top, at 10 or 2 o'clock on a horizontal line.`,source:c.todo("Confirm the TXV bulb failure discussion against your text."),status:"draft"},nr={...$,id:"hvac.4.1.bulb-clock-position",objective:"4.1",kind:"choice",difficulty:3,prompt:"Why is a TXV sensing bulb mounted at the 10 or 2 o'clock position on a horizontal suction line, rather than at the bottom?",choices:["Oil pools in the bottom of the line, so a bulb there would sense the oil rather than the refrigerant","The bottom of the line is physically harder to reach","Mounting at the bottom would strain the capillary","The bottom of the line is colder"],answer:0,explain:`Oil returning through the system runs along the bottom of a horizontal line. A bulb clamped there senses the oil temperature, which lags and misrepresents what the refrigerant is doing.

The 10 or 2 o'clock positions get good contact with the pipe wall where refrigerant is actually flowing. On larger lines the very top is also avoided, because vapour stratifies there.

A poorly positioned bulb produces a valve that hunts and never settles — and gets diagnosed as a bad TXV when the valve is perfectly fine.`,source:c.todo("Confirm bulb mounting practice against your text and manufacturer instructions."),status:"draft"},rr={...$,id:"hvac.4.1.eev-advantage",objective:"4.1",kind:"choice",difficulty:2,prompt:"What does an electronic expansion valve offer over a thermostatic one?",choices:["Faster response and a much wider operating range, because a controller drives it rather than a bulb charge","It needs no superheat measurement at all","It eliminates the need for a filter drier","It works without electrical power"],answer:0,explain:`A TXV is a mechanical device: bulb pressure against spring and evaporator pressure. It works well but it responds slowly and only over the range its charge was designed for.

An EEV uses a temperature sensor and a pressure transducer feeding a controller, which drives a stepper motor. That gives much finer control, faster response to load changes, and the ability to hold tight superheat across a wide range — which is what variable-capacity and inverter systems need.

The trade is complexity: it needs power, a controller and sensors, and any of those can fail.`,source:c.todo("Confirm the EEV discussion against your text."),status:"draft"},cr={...$,id:"hvac.4.2.why-wet-bulb",objective:"4.2",kind:"choice",difficulty:3,prompt:`A superheat charging chart uses indoor WET bulb rather than dry bulb.

Why?`,choices:["Wet bulb reflects total heat content, including the moisture the coil must also remove","Wet bulb is easier to measure accurately","Dry bulb varies too much through the day","Wet bulb is the same as the coil temperature"],answer:0,explain:`The coil does two jobs: lowering temperature and condensing moisture. Dry bulb only describes the first.

Wet bulb captures the total heat content of the entering air — sensible and latent together — which is what actually determines how hard the evaporator is working, and therefore what superheat it should be running.

Using dry bulb gives the wrong target, and in a humid climate it can be wrong by a lot. That is why a psychrometer belongs in the bag alongside the gauges.`,source:c.todo("Confirm against a manufacturer superheat charging chart."),status:"draft"},lr={...$,id:"hvac.4.3.subcool-target-check",objective:"4.3",kind:"input",difficulty:2,prompt:`An R-410A TXV system reads 340 psig on the high side (≈105°F saturation) and the liquid line measures 95°F.

What is the subcooling, in °F?`,placeholder:"°F",accept:["10"],tolerance:2,explain:`Subcooling = condensing temperature − liquid line temperature = 105 − 95 = **10°F**.

That sits right in the 8–12°F target band, so on a TXV system this says the charge is correct. Check the nameplate — many manufacturers specify a subcooling target, and it takes precedence over the generic band.`,source:c.standard("Arithmetic: 105 − 95"),status:"verified"},hr={...$,id:"hvac.4.3.low-ambient-charging",objective:"4.3",kind:"choice",difficulty:3,prompt:`It is 55°F outside and you need to verify the charge on a cooling system.

What is the problem, and what should you do?`,choices:["Charging charts assume higher ambients; weigh the charge in instead, or use a low-ambient procedure","Nothing — charge by superheat as usual","Add refrigerant until suction pressure looks normal for summer","Wait for the system to reach steady state, then charge normally"],answer:0,explain:`Below roughly 65°F outdoor ambient, the readings a charging chart expects do not appear. Head pressure is low, the system may not even run properly, and superheat and subcooling both drift outside their normal relationships.

The reliable answer is to **weigh it in**: recover, evacuate, and put in the nameplate charge with the line-set adjustment. That is accurate regardless of weather.

Some manufacturers publish a low-ambient charging procedure, sometimes involving temporarily restricting condenser airflow. Where one exists, follow it rather than improvising.`,source:c.todo("Confirm low-ambient charging guidance against your text and manufacturer literature."),status:"draft"},dr={...$,id:"hvac.4.4.short-line-set",objective:"4.4",kind:"choice",difficulty:2,prompt:`A nameplate reads "factory charge 6 lb 0 oz for 15 ft of line set". The installed line set is 10 ft.

What should you do?`,choices:["Check the manufacturer instructions — some specify removing charge for runs shorter than the base length","Add the full 6 lb regardless; short runs need no adjustment","Reduce the charge by a fixed 10%","Add extra charge, since a shorter line set restricts flow"],answer:0,explain:`The nameplate figure covers the equipment plus a stated length of line set. A run shorter than that holds less refrigerant, and some manufacturers do specify a deduction.

Many say nothing, in which case the base charge stands — the difference over a few feet is usually within tolerance. The point is that you read the instructions rather than assume either way.

Verify with subcooling once it is running. Weighing in establishes the charge; the readings confirm it.`,source:c.todo("Confirm line set adjustment guidance against manufacturer literature."),status:"draft"},ur={...$,id:"hvac.4.5.dont-add-to-restriction",objective:"4.5",kind:"choice",difficulty:3,prompt:`A system shows 30°F superheat and 20°F subcooling.

A technician adds two pounds of refrigerant because the superheat is high. What happens?`,choices:["It gets worse — the restriction is unchanged and the system is now overcharged as well","Superheat comes down and the problem is solved","Nothing changes, since the restriction controls flow","The extra charge clears the restriction"],answer:0,explain:`High superheat with **high** subcooling is a restriction, not an undercharge. Refrigerant is backing up behind the blockage — which is exactly why subcooling is high.

Adding more refrigerant does not open the restriction. It stacks even more liquid in the condenser, driving head pressure and subcooling higher still, while the evaporator stays just as starved.

Then when somebody eventually finds and clears the restriction, the system is badly overcharged and has to be recovered down. Reading superheat alone, without subcooling, is how this happens.`,source:c.todo("Confirm the restriction signature against your service text."),status:"draft"},pr={...$,id:"hvac.4.5.flash-gas",objective:"4.5",kind:"choice",difficulty:3,prompt:`A system has adequate charge but the liquid line is long with a significant vertical rise. It behaves as though it were undercharged.

What is likely happening?`,choices:["Flash gas — pressure drop in the line is vaporising some liquid before it reaches the metering device","The refrigerant is leaking from the vertical section","The compressor cannot lift refrigerant that high","The metering device is too large"],answer:0,explain:`A metering device is sized to pass liquid. If refrigerant arrives at or near saturation, any pressure drop — a long run, a vertical lift, a restrictive drier — flashes some of it to vapour.

Vapour occupies far more volume than liquid, so the device passes much less refrigerant than it should, and the evaporator starves. The symptom looks exactly like an undercharge.

Subcooling is the margin that prevents it: more subcooling means more room to lose pressure before reaching saturation. This is why a long or lifted liquid line needs a healthy subcooling figure rather than a marginal one.`,source:c.todo("Confirm the flash gas discussion against your text."),status:"draft"},mr=[Xn,Kn,sr,nr,rr,Zn,er,cr,lr,hr,tr,dr,ar,ur,ir,pr,or],S={track:"hvac",domain:"5.0"},fr={...S,id:"hvac.5.1.ohms-forms",objective:"5.1",kind:"match",difficulty:1,prompt:"Match each form of Ohm's law and the power formula to what it solves for.",pairs:[["E = I × R","Voltage, from current and resistance"],["I = E ÷ R","Current, from voltage and resistance"],["R = E ÷ I","Resistance, from voltage and current"],["P = E × I","Power in watts, from voltage and current"]],explain:`One relationship, rearranged three ways, plus the power formula.

In the field R = E ÷ I gets the most use, because voltage and current are what a meter reads directly on a live circuit — you rarely measure resistance on something energised, and you should never try.`,source:c.standard("Ohm's law"),status:"verified"},gr={...S,id:"hvac.5.2.series-vs-parallel",objective:"5.2",kind:"choice",difficulty:2,prompt:"Why are safety controls wired in series with the load, while the loads themselves are wired in parallel?",choices:["Series means every control must close for the load to run; parallel means each load sees full voltage independently","Series is cheaper to wire; parallel uses less copper","Series carries more current; parallel carries less","It is a code requirement with no functional reason"],answer:0,explain:`A series string is an AND: high-pressure switch AND low-pressure switch AND float switch all have to be closed. Any one opening stops the load, which is exactly what a safety chain is for.

Loads go in parallel so each gets the full supply voltage and can operate independently — the blower does not care whether the compressor is running.

This is what makes voltage-drop troubleshooting work. In a series string, the full supply voltage appears across whichever device is open, and nearly zero across the closed ones. Walk the string with a meter and the open one announces itself.`,source:c.todo("Confirm against the electrical circuits chapter of your text."),status:"draft"},wr={...S,id:"hvac.5.2.voltage-across-open",objective:"5.2",kind:"choice",difficulty:3,prompt:`A 24 V control circuit has four safety switches in series with a contactor coil. The contactor is not pulling in. You measure 24 V across the third switch and about 0 V across the others.

What does that tell you?`,choices:["The third switch is open — it is the one interrupting the circuit","The third switch is closed and working correctly","The transformer is failing","The contactor coil is shorted"],answer:0,explain:`In a series circuit the supply voltage divides across the resistances. A closed switch has almost no resistance, so almost no voltage appears across it. An open switch is effectively infinite resistance, so the entire supply voltage appears across it.

Reading full voltage across a switch that should be closed is the definitive test that it is open. This beats resistance testing because it can be done live, in place, without disconnecting anything.

The next question is why it is open — a genuine fault it is protecting against, or a failed switch. Jumping it out to "test" is how equipment gets destroyed and people get hurt.`,source:c.todo("Confirm the voltage-drop method against your text."),status:"draft"},yr={...S,id:"hvac.5.3.compressor-terminals",objective:"5.3",kind:"choice",difficulty:3,prompt:`On a single-phase compressor you measure between terminals: C–S = 6 Ω, C–R = 2 Ω.

What should R–S measure on a healthy compressor?`,choices:["8 Ω — the start and run windings in series through common","4 Ω — the difference between them","12 Ω — the product of them","0 Ω — the windings are isolated from each other"],answer:0,explain:`The two windings share the common terminal, so measuring R to S puts them in series: 2 + 6 = 8 Ω. That relationship is the check — the largest reading always equals the sum of the other two.

It also identifies unmarked terminals: the highest reading is between run and start, so the terminal not involved in it is common. Of the remaining two, the one with higher resistance to common is start (more turns of finer wire), the lower one is run.

If the numbers do not add up, a winding is damaged. Also check each terminal to the shell — any continuity to ground means the compressor is grounded and must be replaced.`,source:c.standard("Series resistance: R–S = (C–R) + (C–S)"),status:"verified"},br={...S,id:"hvac.5.4.run-vs-start",objective:"5.4",kind:"match",difficulty:2,prompt:"Match each capacitor type to its role.",pairs:[["Run capacitor","Stays in circuit continuously, improving efficiency and torque"],["Start capacitor","Briefly in circuit at start-up for extra starting torque, then switched out"],["Dual run capacitor","One can serving both the compressor and the condenser fan"]],explain:`A run capacitor is rated for continuous duty and has a relatively low microfarad value. A start capacitor has a much higher value and is designed for seconds of use — leave one in circuit and it fails quickly.

A dual capacitor has three terminals: C (common), HERM (compressor) and FAN. Reading a dual means measuring HERM-to-C and FAN-to-C separately, since half can fail while the other half still tests fine.

Always discharge a capacitor before handling it. They hold a charge long after power is off, and a large one holds enough energy to injure you.`,source:c.todo("Confirm capacitor types against your text."),status:"draft"},vr={...S,id:"hvac.5.5.component-roles",objective:"5.5",kind:"match",difficulty:2,prompt:"Match each control component to its function.",pairs:[["Contactor","Uses a low-voltage coil to switch the high-voltage load"],["Transformer","Steps line voltage down to 24 V for the control circuit"],["Sequencer","Brings electric heat strips on in stages to limit inrush current"],["Pressure switch","Opens the control circuit when refrigerant pressure goes out of range"],["Overload","Opens on excessive current or temperature to protect a motor"]],explain:`The pattern is that a small, safe, low-voltage signal controls a large, dangerous, high-voltage load. The thermostat never switches 240 V — it switches 24 V to a contactor coil, and the contactor does the real work.

This is why control-circuit troubleshooting usually starts at the transformer. No 24 V secondary means nothing downstream can operate, and it is a two-second check.`,source:c.todo("Confirm the component list against your text."),status:"draft"},kr={...S,id:"hvac.5.5.thermostat-letters",objective:"5.5",kind:"match",difficulty:2,prompt:"Match each conventional thermostat terminal to what it does.",pairs:[["R","24 V hot from the transformer"],["C","Common — the return side of the 24 V circuit"],["Y","Calls for cooling — energises the compressor contactor"],["G","Calls for the indoor blower"],["W","Calls for heat"],["O/B","Energises the reversing valve on a heat pump"]],explain:`These are conventions rather than a standard, and manufacturers do deviate — always check the wiring diagram on the equipment rather than assuming.

C is the one that causes most modern trouble. Older systems often ran without it, but communicating and Wi-Fi thermostats need a common wire for continuous power, and "the new thermostat keeps dropping off" is very often a missing C.

O versus B matters on heat pumps: O energises the reversing valve in cooling, B energises it in heating. Getting it backwards gives you heat when you asked for cooling.`,source:c.todo("Confirm the terminal conventions against your text and the equipment diagram."),status:"draft"},Tr={...S,id:"hvac.5.6.ladder-structure",objective:"5.6",kind:"choice",difficulty:2,prompt:"How is a ladder diagram organised?",choices:["Two vertical power rails with each rung running load-side from one to the other, controls before the load","Components drawn in their physical positions inside the cabinet","A single line showing the order of operations in time","Wires drawn in their actual colours and lengths"],answer:0,whyWrong:{1:"That is a pictorial or connection diagram — useful for finding a part, not for tracing logic.",2:"A ladder shows electrical logic, not sequence in time.",3:"Colours appear as labels; the layout is logical rather than physical."},explain:`Each rung is one complete circuit: power rail, then the switches and contacts that control it, then the load, then the other rail. Reading left to right tells you every condition that has to be satisfied for that load to run.

The convention of putting controls before the load matters for troubleshooting. It means you can work along a rung with a meter, and the point where voltage disappears is the point of the fault.

Relay contacts are labelled with the coil that operates them, so a contact marked CR1 is controlled by the CR1 coil elsewhere in the diagram. Following those cross-references is how you trace a sequence.`,source:c.todo("Confirm the ladder diagram conventions against your text."),status:"draft"},xr={...S,id:"hvac.5.7.live-dead-live",objective:"5.7",kind:"order",difficulty:2,prompt:"Put the steps of verifying a circuit is de-energised in the correct order.",steps:["Test the meter on a known live source to prove it works","Test the circuit you intend to work on","Test the meter on the known live source again to prove it still works"],explain:`Live–dead–live. The second live test is the one people skip and the one that matters: a meter with a blown fuse, a flat battery or a broken lead reads zero volts on everything, including a circuit that is fully energised.

Without the final check, "the meter read zero" and "the circuit is dead" are not the same statement, and the difference can kill you.`,source:c.standard("NFPA 70E electrical safety practice"),status:"verified"},Cr={...S,id:"hvac.5.7.discharge-capacitor",objective:"5.7",kind:"choice",difficulty:2,prompt:`You have opened the disconnect on a condensing unit and are about to test the dual run capacitor.

What must you do first?`,choices:["Discharge the capacitor across its terminals through a resistor before touching it","Nothing — opening the disconnect removes all stored energy","Wait five minutes; capacitors self-discharge in that time","Short the terminals directly with a screwdriver blade"],answer:0,whyWrong:{1:"A capacitor stores charge independently of the supply. Removing power does not empty it.",2:"Bleed-down is not guaranteed, and not all capacitors have bleed resistors.",3:"A direct short produces a violent arc and can damage the capacitor and injure you."},explain:`A capacitor is an energy store. It holds its charge after the disconnect opens, and a large run capacitor holds enough to hurt you badly.

Discharge it deliberately, through a resistor — a 20 kΩ 2 W resistor across the terminals is the usual tool. Shorting with a screwdriver works in the sense that it dumps the charge, but it does so as an arc and it is how people end up with burns and damaged tools.

On a dual capacitor, discharge HERM-to-C and FAN-to-C separately.`,source:c.todo("Confirm the discharge procedure against your safety text."),status:"draft"},Ar={...S,id:"hvac.5.1.resistance-from-readings",objective:"5.1",kind:"input",difficulty:2,prompt:`A 240 V heating element draws 20 A.

What is its resistance, in ohms?`,placeholder:"Ω",accept:["12"],tolerance:.5,explain:`R = E ÷ I = 240 ÷ 20 = **12 Ω**.

This form gets the most use in the field, because voltage and current are what a meter reads directly on a live circuit. You rarely measure resistance on something energised — and should never try.

Cross-check with power: P = E × I = 240 × 20 = 4,800 W, which is a plausible size for one heat strip.`,source:c.standard("Ohm's law"),status:"verified"},Sr={...S,id:"hvac.5.2.parallel-lower",objective:"5.2",kind:"choice",difficulty:2,prompt:"Two 20 Ω resistances are wired in parallel. Without calculating, what do you know about the total?",choices:["It is less than 20 Ω, because each added path gives current somewhere else to go","It is 40 Ω, because resistances add","It is exactly 20 Ω, because they are identical","It depends on the applied voltage"],answer:0,explain:`Total resistance in parallel is always **lower than the smallest branch**. Adding a path makes it easier for current to flow, not harder.

For two equal resistances the total is exactly half — 10 Ω here. The general formula for two is (R₁ × R₂) ÷ (R₁ + R₂).

If you ever calculate a parallel total that is higher than one of the branches, you have made an arithmetic error.`,source:c.standard("Parallel resistance"),status:"verified"},Rr={...S,id:"hvac.5.2.dead-control-circuit",objective:"5.2",kind:"choice",difficulty:2,prompt:`Nothing in a system operates. You measure 0 V across every device in the 24 V control circuit, including the contactor coil.

Where do you look?`,choices:["At the transformer — no secondary voltage means nothing downstream can operate","At the contactor coil, which must be shorted","At the thermostat, which must be stuck closed","At the compressor windings"],answer:0,explain:`Zero volts across *everything* is different from zero volts across most things. In a working circuit with an open switch, that switch shows full voltage — something has to be dropping it.

Nothing anywhere means there is no supply to drop. Check the transformer secondary for 24 V, and its primary for line voltage. Also check any fuse or breaker in the control circuit — many boards have a small automotive-style fuse that opens on a shorted thermostat wire.`,source:c.todo("Confirm the control circuit troubleshooting sequence against your text."),status:"draft"},Fr={...S,id:"hvac.5.3.grounded-winding",objective:"5.3",kind:"choice",difficulty:2,prompt:`You measure from a compressor terminal to the shell and read 40 Ω.

What does that mean?`,choices:["The winding is grounded — the compressor is failed and must be replaced","That is normal winding resistance","The compressor needs a new capacitor","The reading is meaningless without the other terminals"],answer:0,explain:`There should be **no continuity at all** between any terminal and the shell. The windings are insulated from the housing, and a good compressor reads open — effectively infinite resistance.

Any measurable resistance to ground means the insulation has broken down. The compressor is failed, and a grounded compressor will keep tripping the breaker.

A grounded compressor often also means an acid burnout, so check the oil and fit a suction line drier when replacing it, or the new one will die the same way.`,source:c.todo("Confirm compressor testing procedure against your text."),status:"draft"},qr={...S,id:"hvac.5.4.dual-capacitor-halves",objective:"5.4",kind:"choice",difficulty:2,prompt:`A dual run capacitor is marked 45/5 µF. The fan runs but the compressor will not start.

How do you test it?`,choices:["Measure HERM-to-C and FAN-to-C separately — one half can fail while the other tests fine","Measure HERM-to-FAN to get the total","Measure across the whole capacitor and compare to 50 µF","A dual capacitor cannot be tested in place"],answer:0,explain:`A dual capacitor is two capacitors in one can, sharing a common terminal. The 45 µF section (HERM) serves the compressor and the 5 µF section (FAN) serves the condenser fan.

They fail independently. A fan that runs while the compressor will not is a strong hint that the HERM half has gone while the FAN half is fine.

Measure each against its rating with a ±6% tolerance. And discharge each half separately before touching it.`,source:c.todo("Confirm dual capacitor testing against your text."),status:"draft"},$r={...S,id:"hvac.5.4.tolerance-judgement",objective:"5.4",kind:"choice",difficulty:2,prompt:`A 40 µF run capacitor measures 36.5 µF.

What is your verdict?`,choices:["Out of tolerance — 36.5 is about 91% of rating, below the ±6% band. Replace it.","Within tolerance — close enough to 40","Cannot judge without the motor running","Out of tolerance, but only replace it if the motor fails to start"],answer:0,explain:`36.5 ÷ 40 = 91.25%, which is nearly 9% low. Run capacitors are held to ±6%, so this one is outside the band.

The reason not to wait for a hard failure: a weak capacitor does not fail cleanly. The motor still tries to start, draws locked-rotor current, heats up and trips its overload — intermittently. That intermittent hard-starting is hard on the compressor, and the customer experiences it as a system that works some days and not others.`,source:c.todo("Confirm run capacitor tolerance against your text."),status:"draft"},Ir={...S,id:"hvac.5.5.chatter-diagnosis",objective:"5.5",kind:"choice",difficulty:3,prompt:`A contactor pulls in and drops out rapidly, over and over.

When should you take your voltage reading?`,choices:["While it is trying to pull in — control voltage sagging under load is the whole diagnosis","With the system off, to get a stable baseline","After it has settled, whichever state that is","At the line side, since that is where the power comes from"],answer:0,explain:`Chatter means the coil gets just enough voltage to pull in, and then not enough to hold. The fault only exists **under load**.

A reading taken with nothing energised will look perfectly fine and tell you nothing. Measure the 24 V while the coil is trying to pull in, and watch it collapse.

Causes are an undersized or failing transformer, a poor connection adding resistance, or a shorted coil drawing more than the transformer can supply. Chatter is destructive too — each bounce arcs across the contacts and burns them.`,source:c.todo("Confirm the contactor chatter diagnosis against your service text."),status:"draft"},Mr={...S,id:"hvac.5.5.missing-c-wire",objective:"5.5",kind:"choice",difficulty:2,prompt:`A newly installed Wi-Fi thermostat keeps dropping offline and occasionally reboots itself. The old mechanical thermostat worked fine.

What is the likely cause?`,choices:["No common (C) wire, so the thermostat cannot draw continuous power","The thermostat is faulty and should be replaced","The transformer is undersized for the equipment","The Y wire is loose"],answer:0,explain:`A mechanical thermostat is just a switch — it needs no power of its own. A smart thermostat needs continuous power for its display, processor and radio, and that requires a return path: the C wire.

Without one, some thermostats "power steal" through the load, which works marginally and produces exactly this behaviour — dropping offline, rebooting, sometimes chattering the equipment.

The fix is running a C wire, or fitting an add-a-wire adapter. This is one of the most common calls after a customer-installed smart thermostat.`,source:c.todo("Confirm the C wire discussion against your text."),status:"draft"},Pr={...S,id:"hvac.5.6.what-a-rung-is",objective:"5.6",kind:"choice",difficulty:2,prompt:"On a ladder diagram, what does a single rung represent?",choices:["One complete circuit: from one power rail, through its controls, through a load, to the other rail","One physical wire in the equipment","One step in the sequence of operation","One component in the cabinet"],answer:0,explain:`Each rung is a complete circuit path. Reading left to right gives you every condition that has to be satisfied for that load to operate.

The convention of putting controls before the load is what makes voltage-drop troubleshooting work: you walk along the rung with a meter, and the point where voltage disappears is the fault.

Relay contacts are labelled with the coil that operates them, so a contact marked CR1 is controlled by the CR1 coil elsewhere in the diagram. Following those cross-references is how you trace a sequence.`,source:c.todo("Confirm the ladder diagram conventions against your text."),status:"draft"},Wr={...S,id:"hvac.5.7.never-jumper-a-safety",objective:"5.7",kind:"choice",difficulty:3,prompt:"You have found an open high-pressure switch. What should you do next?",choices:["Find out why it opened — it is reporting a real condition until proven otherwise","Jumper it out so the system runs, then diagnose","Replace the switch, since an open switch is a failed switch","Reset it and leave, since it may have been a one-off"],answer:0,whyWrong:{1:"Jumpering removes the protection that is stopping the system destroying itself.",2:"A switch doing its job is not a failed switch.",3:"A high-pressure trip has a cause, and it will happen again."},explain:`A safety switch that has opened is telling you something. High pressure means heat is not leaving the condenser: dirty coil, failed fan, overcharge, non-condensables, or blocked airflow.

Jumpering it lets the system run past the pressure the switch exists to prevent. That is how compressors get destroyed and, on larger equipment, how relief devices discharge.

Diagnose the cause. If everything checks out and the switch still will not close with normal pressures, *then* it is a failed switch.`,source:c.todo("Confirm safety control practice against your service text."),status:"draft"},Er=[fr,Ar,gr,Sr,wr,Rr,yr,Fr,br,qr,$r,vr,Ir,kr,Mr,Tr,Pr,xr,Cr,Wr],F={track:"hvac",domain:"6.0"},jr={caption:"Where a manometer goes to read total external static pressure",nodes:[{id:"ret",kind:"damper",label:"Return",sublabel:"filter rack",col:0,row:1},{id:"probe1",kind:"sensor",label:"Probe 1",sublabel:"reads negative",col:1,row:1},{id:"ahu",kind:"blower",label:"Air handler",sublabel:"rated 0.50 in.",col:2,row:1},{id:"probe2",kind:"sensor",label:"Probe 2",sublabel:"reads positive",col:3,row:1},{id:"sup",kind:"damper",label:"Supply plenum",col:4,row:1}],links:[{from:"ret",to:"probe1"},{from:"probe1",to:"ahu"},{from:"ahu",to:"probe2"},{from:"probe2",to:"sup"}]},Or={...F,id:"hvac.6.1.cfm-per-ton",objective:"6.1",kind:"choice",difficulty:1,prompt:"What is the design airflow for a cooling system, and what is the acceptable range?",choices:["400 CFM per ton, with 350–450 acceptable","400 CFM total, regardless of system size","100 CFM per ton, with 80–120 acceptable","1,000 CFM per ton, with 900–1,100 acceptable"],answer:0,explain:`400 CFM per ton is the design figure, and 350–450 is the working band.

Where you aim inside that band depends on climate. Below 400 the coil runs colder and pulls more moisture out — right for a humid climate, and right down at 350 for a system struggling with humidity. Above 400 gives more sensible capacity and less dehumidification, which suits a dry climate.

Outside the band things break. Too little air and the coil ices; too much and the coil never gets cold enough to condense, so the house hits setpoint and still feels clammy.`,source:c.todo("Confirm the airflow targets against your text."),status:"draft"},Lr={...F,id:"hvac.6.2.tesp-signs",objective:"6.2",kind:"choice",difficulty:3,topology:jr,prompt:`A manometer reads −0.38 in. w.c. in the return and +0.42 in. w.c. in the supply.

What is the total external static pressure?`,choices:["0.80 in. w.c.","0.04 in. w.c.","0.42 in. w.c.","−0.80 in. w.c."],answer:0,whyWrong:{1:"That is what you get by adding the signed values, which cancels most of the reading.",2:"Supply alone is only half the story.",3:"TESP is expressed as a positive magnitude."},explain:`TESP is the sum of the ABSOLUTE values: 0.38 + 0.42 = 0.80 in. w.c.

The return reads negative because the blower is pulling on it and the supply positive because it is pushing. Both represent work the blower is doing, so both count. Adding the signed numbers would give 0.04 and make a severely restricted system look perfect.

Most residential air handlers are rated for 0.50 in. w.c. At 0.80 this blower is well past rating, and airflow will be substantially below design no matter how the equipment is charged. This is the measurement that catches undersized ductwork, and it is why a "the equipment is fine" call so often turns out not to be.`,source:c.standard("Arithmetic: |−0.38| + |+0.42|"),status:"verified"},Nr={...F,id:"hvac.6.2.high-static-causes",objective:"6.2",kind:"multi",difficulty:2,prompt:"Which of these raise total external static pressure? Select all that apply.",choices:["A loaded or excessively restrictive filter","Undersized return ductwork","A dirty evaporator coil","Closed or blocked supply registers","Low refrigerant charge"],answers:[0,1,2,3],explain:`Everything the air has to squeeze past adds resistance, and the blower answers by developing more pressure and moving less air.

Return-side restriction is the most commonly underestimated. Installers routinely fit generous supply ductwork and a single undersized return, and no amount of equipment work fixes it.

Refrigerant charge has no bearing on static pressure — that is the air side, entirely separate. Which is exactly why measuring both matters: they fail independently and their symptoms overlap.`,source:c.todo("Confirm the causes of high static against your text."),status:"draft"},Hr={...F,id:"hvac.6.3.three-laws",objective:"6.3",kind:"match",difficulty:2,prompt:"Match each fan law to how the quantity changes with blower speed.",pairs:[["Airflow (CFM)","Varies directly with RPM"],["Static pressure","Varies with the square of RPM"],["Brake horsepower","Varies with the cube of RPM"]],explain:`Direct, square, cube. The consequence is that a modest airflow gain costs a great deal of power: raise speed 25% and you get 25% more air, 56% more static pressure, and 95% more horsepower.

This is why speeding a blower up is a poor answer to an airflow complaint. The duct system is the restriction, the motor pays the price, and it eventually fails. Fix the duct.`,source:c.standard("Fan affinity laws"),status:"verified"},Dr={...F,id:"hvac.6.4.equivalent-length",objective:"6.4",kind:"choice",difficulty:3,prompt:'What does "total equivalent length" account for in duct design?',choices:["Straight duct plus the resistance of fittings, expressed as the length of straight duct that would cause the same pressure drop","The physical length of the longest duct run only","The sum of the lengths of every branch in the system","The length of duct required to reach the furthest register"],answer:0,explain:`Fittings cause far more pressure drop than straight duct, so they are converted into the length of straight duct that would cost the same. A hard 90° elbow might be worth 30 or 40 feet; a boot or a takeoff similarly.

That is why a physically short run full of turns can behave like a very long one, and why duct design cannot be done with a tape measure alone.

Total equivalent length feeds the friction rate — available static × 100 ÷ TEL — which is the number the duct calculator actually needs.`,source:c.todo("Confirm against a duct design manual such as ACCA Manual D."),status:"draft"},Br={...F,id:"hvac.6.5.ecm-vs-psc",objective:"6.5",kind:"choice",difficulty:3,prompt:"How does a constant-airflow ECM blower respond to rising duct static pressure, compared with a PSC motor?",choices:["The ECM speeds up to hold its airflow target, while a PSC simply moves less air","Both move less air as static rises","The ECM moves less air; a PSC holds airflow constant","Neither is affected by static pressure"],answer:0,explain:`A PSC motor turns at a roughly fixed speed. Raise the resistance and it simply delivers less air — the fan curve does the work of telling you how much less.

A constant-airflow ECM measures torque and adjusts speed to hold the CFM it was commanded to deliver. That is better for comfort, but it hides duct problems: the airflow stays right while the motor works harder and harder, until it hits its limit or fails early.

Practical consequence: on an ECM system you cannot infer airflow from the temperature drop and assume the ducts are fine. Measure static pressure directly. A high reading with correct airflow still means the duct system is undersized and the motor is paying for it.`,source:c.todo("Confirm ECM behaviour against your text or the manufacturer literature."),status:"draft"},zr={...F,id:"hvac.6.6.merv-tradeoff",objective:"6.6",kind:"choice",difficulty:2,prompt:"A homeowner has fitted a high-MERV 1-inch filter to improve air quality. What is the likely consequence, and what is the better answer?",choices:["Higher pressure drop and reduced airflow; use a larger filter area at the same MERV instead","No effect — filter rating does not influence airflow","Improved airflow, because denser media straightens the air","The system will move more air but filter less effectively"],answer:0,explain:`Finer media captures more, and costs more pressure drop to push air through. In a 1-inch filter slot there is very little media area to spread that across, so a high-MERV 1-inch filter can add several tenths of an inch of static on its own.

The fix is area, not rating. A 4- or 5-inch media cabinet holds vastly more surface, so it achieves the same or better filtration at a fraction of the pressure drop, and it loads up far more slowly between changes.

Filtration and airflow are a genuine trade-off in a fixed slot, and pretending otherwise is how systems end up starved.`,source:c.todo("Confirm the filtration trade-off against your text."),status:"draft"},Vr={...F,id:"hvac.6.6.iced-coil-cause",objective:"6.6",kind:"choice",difficulty:2,prompt:`A call reports "no cooling" and you find the evaporator coil frozen into a solid block of ice.

What should you do first?`,choices:["Shut off cooling, run the blower to thaw the coil, and look for the airflow or charge cause while it melts","Connect gauges immediately and read the pressures","Add refrigerant, since low charge causes freezing","Chip the ice off to save time"],answer:0,whyWrong:{1:"Gauge readings on an iced system reflect the ice, not the underlying fault.",2:"Low charge is one possible cause, but so is low airflow, and adding refrigerant to the wrong one makes it worse.",3:"Chipping punctures the coil."},explain:`An iced coil has to be thawed before any reading means anything. The ice itself blocks airflow, which drives suction pressure down further, so the gauges are describing the symptom rather than the cause.

While it thaws, work out why. The two families of cause are low airflow — a loaded filter, dirty coil, failed blower, closed registers, undersized ducts — or low charge. The way to separate them once it is running: low charge shows high superheat and low subcooling; low airflow shows a high air-side temperature drop.

Not finding the cause guarantees a callback, because it will simply freeze again.`,source:c.todo("Confirm the frozen coil procedure against your service text."),status:"draft"},Ur={...F,id:"hvac.6.1.cfm-for-system",objective:"6.1",kind:"input",difficulty:1,prompt:"How much airflow should a 3.5-ton system move at design, in CFM?",placeholder:"CFM",accept:["1400"],tolerance:30,explain:`3.5 tons × 400 CFM/ton = **1,400 CFM**.

The acceptable band, 350–450 CFM/ton, gives 1,225 to 1,575 CFM. Aim toward the low end in a humid climate for better dehumidification, and toward the high end in a dry one for more sensible capacity.`,source:c.standard("Arithmetic: 3.5 × 400"),status:"verified"},Gr={...F,id:"hvac.6.1.climate-airflow-choice",objective:"6.1",kind:"choice",difficulty:3,prompt:"In a very dry climate, where should you aim within the 350–450 CFM/ton band, and why?",choices:["Toward 450, because there is little moisture to remove and higher airflow gives more sensible capacity","Toward 350, to keep the coil as cold as possible","Exactly 400 always, regardless of climate","Below 350, to maximise the temperature drop"],answer:0,explain:`Airflow sets coil temperature. Less air means a colder coil, which condenses more moisture — valuable in Houston, wasted in Phoenix where there is barely any moisture to remove.

In a dry climate you want the capacity going into temperature rather than dehumidification, so run higher airflow with a warmer coil. In a humid climate you sacrifice some sensible capacity to get the latent removal that actually makes the house comfortable.

Below 350 the coil risks freezing, which is why that is the floor rather than a preference.`,source:c.todo("Confirm the climate airflow guidance against your text."),status:"draft"},_r={...F,id:"hvac.6.2.why-return-negative",objective:"6.2",kind:"choice",difficulty:2,prompt:"Why does a manometer read a negative pressure in the return plenum?",choices:["The blower is pulling air out of it, so it sits below atmospheric pressure","The probe is inserted backwards","Return air is colder and therefore denser","Return ducts are always under vacuum by design"],answer:0,explain:`The blower pulls on the return side and pushes on the supply side. Suction gives a pressure below atmospheric — negative — and discharge gives one above it.

Both numbers represent work the blower is doing against restriction, which is why TESP adds their **magnitudes**. Adding the signed values cancels most of the reading and makes a badly restricted system look perfect.`,source:c.todo("Confirm the static pressure measurement discussion against your text."),status:"draft"},Qr={...F,id:"hvac.6.2.tesp-too-high",objective:"6.2",kind:"choice",difficulty:3,prompt:`An air handler rated for 0.50 in. w.c. measures a TESP of 0.95 in. w.c.

What follows from that?`,choices:["Airflow is well below design and no amount of refrigerant work will fix it","The blower is oversized and should be slowed down","The system is fine as long as the temperature drop is normal","Static pressure that high indicates a refrigerant problem"],answer:0,explain:`Nearly double the rating means the blower is fighting far more restriction than it was designed for, and it is delivering substantially less air as a result.

That has knock-on effects everywhere: the coil runs colder, suction pressure drops, and the system can ice. A technician who only looks at the gauges sees "low suction" and may add refrigerant, making things worse.

The cause is upstream of the equipment — undersized ducts, a restrictive filter, closed registers, a crushed flex run. Fixing it means duct work, not equipment work.`,source:c.todo("Confirm the high static consequences against your text."),status:"draft"},Yr={...F,id:"hvac.6.3.doubling-speed",objective:"6.3",kind:"choice",difficulty:3,prompt:`A blower runs at 600 RPM drawing 0.25 BHP. You double the speed to 1,200 RPM.

What horsepower does it now draw?`,choices:["2.0 BHP","0.50 BHP","1.0 BHP","0.25 BHP"],answer:0,whyWrong:{1:"That would be the first fan law — but horsepower follows the cube, not the direct ratio.",2:"That would be the square. Static pressure follows the square; horsepower follows the cube.",3:"Speed changes definitely change power draw."},explain:`Third fan law: horsepower varies with the **cube** of RPM.

0.25 × (1200 ÷ 600)³ = 0.25 × 2³ = 0.25 × 8 = **2.0 BHP**.

Doubling airflow costs eight times the power. This is the law that burns out motors when somebody speeds up a blower to chase an airflow complaint — the duct is the restriction, and the motor pays for trying to overcome it.`,source:c.standard("Fan affinity laws: BHP ∝ RPM³"),status:"verified"},Jr={...F,id:"hvac.6.3.which-law-applies",objective:"6.3",kind:"choice",difficulty:2,prompt:"You increase blower speed by 20%. Which quantity increases by roughly 44%?",choices:["Static pressure","Airflow","Brake horsepower","Motor voltage"],answer:0,explain:`Static pressure follows the square: 1.20² = 1.44, so a 44% rise.

Airflow follows directly: 1.20, a 20% rise.
Horsepower follows the cube: 1.20³ = 1.73, a 73% rise.

Voltage is set by the supply and does not change with speed.`,source:c.standard("Fan affinity laws"),status:"verified"},Xr={...F,id:"hvac.6.4.friction-rate-calc",objective:"6.4",kind:"input",difficulty:3,prompt:`A duct design has 0.25 in. w.c. of available static pressure and a total equivalent length of 200 ft.
