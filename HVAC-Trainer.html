What is the friction rate, in in. w.c. per 100 ft?`,placeholder:"in. w.c./100 ft",accept:["0.125"],tolerance:.01,explain:`FR = (available static × 100) ÷ TEL = (0.25 × 100) ÷ 200 = **0.125** in. w.c. per 100 ft.

This is the number you take to the duct calculator to size each run. Note how it falls as equivalent length rises — a long, fitting-heavy system needs larger ducts to achieve the same airflow, because it has less pressure to spend per foot.`,source:c.standard("Arithmetic: (0.25 × 100) ÷ 200"),status:"verified"},Kr={...F,id:"hvac.6.4.velocity-to-cfm",objective:"6.4",kind:"input",difficulty:2,prompt:`A 20 in. × 8 in. rectangular duct carries air at 700 feet per minute.

How much airflow is that, in CFM?`,placeholder:"CFM",accept:["778"],tolerance:25,explain:`Area first: (20 × 8) ÷ 144 = 160 ÷ 144 = 1.111 ft².

Then CFM = velocity × area = 700 × 1.111 = **about 778 CFM**.

The ÷144 converts square inches to square feet, and forgetting it is the classic error — it gives an answer 144 times too large.`,source:c.standard("CFM = fpm × ft²; area = (w × h) ÷ 144"),status:"verified"},Zr={...F,id:"hvac.6.5.dirty-blower-wheel",objective:"6.5",kind:"choice",difficulty:3,prompt:`Filter is clean, coil is clean, ducts appear adequate, but airflow is clearly low and static pressure is only slightly elevated.

What is worth inspecting?`,choices:["The blower wheel — dirt packed into the blades stops it moving air, without adding much restriction","The condenser coil","The refrigerant charge","The thermostat calibration"],answer:0,explain:`A blower wheel with dirt packed into the blade channels loses its shape. The blades can no longer grip the air, so the wheel spins at the right speed and moves far less air.

The tell is that static pressure is *not* dramatically high. A restriction downstream raises static; a blower that has stopped working properly moves less air without adding much resistance to the path.

It is a genuinely common and frequently missed cause, because it requires pulling the blower to see. Filters that have been left too long, or fitted loosely so air bypasses them, are how it happens.`,source:c.todo("Confirm the dirty blower wheel discussion against your service text."),status:"draft"},ec={...F,id:"hvac.6.6.filter-bypass",objective:"6.6",kind:"choice",difficulty:2,prompt:`A filter is the wrong size and leaves a gap at one edge of the rack.

Why does that matter beyond the filtering itself?`,choices:["Unfiltered air bypasses and loads the coil and blower wheel with dirt","It raises static pressure significantly","It causes the filter to be sucked into the blower","It has no practical effect if the gap is small"],answer:0,explain:`Air takes the path of least resistance, so it goes through the gap rather than the media. The filter is then doing very little, and everything downstream gets the dirt instead.

That is how coils get fouled and blower wheels get packed — both of which are far more expensive to fix than a correctly sized filter.

A gapped filter also does not raise static much, so it hides from a static pressure measurement. You have to look at it.`,source:c.todo("Confirm the filter bypass discussion against your text."),status:"draft"},tc={...F,id:"hvac.6.6.thawing-technique",objective:"6.6",kind:"choice",difficulty:2,prompt:"You need to thaw a frozen evaporator coil. What is the safe way?",choices:["Switch the thermostat to fan-only so the blower runs with the compressor off","Chip the ice off carefully with a screwdriver","Run the system in cooling until the ice melts","Apply a heat gun to the coil face"],answer:0,whyWrong:{1:"Chipping punctures the coil, turning a service call into a coil replacement.",2:"The compressor is what is making it cold — running it makes the ice worse.",3:"Concentrated heat can damage the fins and any nearby wiring."},explain:`Fan-only moves room-temperature air across the coil and melts the ice gently, with no risk of damage. It takes time, so use it to inspect the filter, blower and ducts while you wait.

Then find the cause before you leave. The two families are low airflow and low charge, and the way to separate them once it is running is the temperature drop: low charge gives a LOW drop, low airflow gives a HIGH one.

Not finding the cause guarantees a callback, because it will simply freeze again.`,source:c.todo("Confirm the frozen coil procedure against your service text."),status:"draft"},ac=[Or,Ur,Gr,Lr,_r,Qr,Nr,Hr,Yr,Jr,Dr,Xr,Kr,Br,Zr,zr,ec,Vr,tc],I={track:"hvac",domain:"7.0"},ic={...I,id:"hvac.7.1.properties",objective:"7.1",kind:"match",difficulty:2,prompt:"Match each psychrometric property to what it measures.",pairs:[["Dry bulb","Air temperature as an ordinary thermometer reads it"],["Wet bulb","Temperature with evaporative cooling; reflects total heat content"],["Dew point","The temperature at which the air would begin to condense"],["Relative humidity","How close the air is to saturation, as a percentage, at its current temperature"],["Humidity ratio","The actual mass of water per pound of dry air, in grains"],["Enthalpy","Total heat content — sensible and latent together — in Btu per pound"]],explain:`The pair worth separating carefully is relative humidity and humidity ratio. RH is relative to temperature: heat air without adding water and RH falls, though there is exactly as much water in it. Humidity ratio and dew point measure the actual moisture, so they do not move when you only change temperature.

That is why RH alone is a poor way to talk about a moisture problem, and why grains and dew point are what the trade uses when it matters.`,source:c.todo("Confirm the property definitions against your text or ASHRAE Fundamentals Ch. 1."),status:"draft"},oc={...I,id:"hvac.7.1.saturation",objective:"7.1",kind:"choice",difficulty:2,prompt:"What is true of air at 100% relative humidity?",choices:["Dry bulb, wet bulb and dew point are all the same temperature","The air contains the maximum possible water at any temperature","Wet bulb is higher than dry bulb","The dew point is higher than the dry bulb"],answer:0,whyWrong:{1:"The maximum depends on temperature — warmer air holds far more.",2:"Wet bulb can never exceed dry bulb.",3:"Dew point can never exceed dry bulb."},explain:`At saturation there is no evaporation left to cool the wet-bulb thermometer, so it reads the same as dry bulb. And since the air is already at the point of condensing, dew point equals both.

The gap between dry bulb and wet bulb is therefore a direct read on how dry the air is — the wider the spread, the more evaporation is happening, and the drier the air. That is the whole principle behind a sling psychrometer.`,source:c.standard("ASHRAE Handbook — Fundamentals, Ch. 1"),status:"verified"},sc={...I,id:"hvac.7.2.two-properties",objective:"7.2",kind:"choice",difficulty:2,prompt:"How many properties must you know to fix a point on the psychrometric chart?",choices:["Two — any two independent properties determine every other one","One is enough","Three, at minimum","All six must be measured"],answer:0,explain:`Any two independent properties locate the point, and the chart then gives you the rest. That is why a sling psychrometer is such a useful instrument: dry bulb and wet bulb are two readings from one tool, and from them come RH, dew point, grains, enthalpy and specific volume.

The caveat is "independent". Dry bulb and dry bulb is one property measured twice. At saturation, dry bulb and wet bulb stop being independent because they are equal — which is why saturated air needs a different pair to pin it down.`,source:c.standard("ASHRAE Handbook — Fundamentals, Ch. 1"),status:"verified"},nc={...I,id:"hvac.7.2.process-directions",objective:"7.2",kind:"match",difficulty:3,prompt:"Match each air-handling process to how it moves on the psychrometric chart.",pairs:[["Sensible cooling","Straight left at constant humidity ratio"],["Sensible heating","Straight right at constant humidity ratio"],["Cooling with dehumidification","Down and to the left, toward the saturation curve"],["Humidification","Straight up at constant dry bulb, for steam injection"],["Evaporative cooling","Up and to the left along a line of constant wet bulb"]],explain:`Horizontal movement is sensible; vertical movement is latent. A real cooling coil does both at once, which is why its process line runs diagonally down and left toward the coil's apparatus dew point.

Evaporative cooling is the interesting one: it drops dry bulb while raising moisture, and it follows a constant wet-bulb line because it adds no heat overall — it converts sensible heat into latent heat. That is also why it works well in dry climates and barely at all in humid ones.`,source:c.todo("Confirm the process directions against your text or ASHRAE Fundamentals Ch. 1."),status:"draft"},rc={...I,id:"hvac.7.3.formulas",objective:"7.3",kind:"match",difficulty:2,prompt:"Match each heat formula to what it calculates.",pairs:[["Qs = 1.08 × CFM × ΔT","Sensible heat, from a dry-bulb temperature difference"],["Ql = 0.68 × CFM × Δgrains","Latent heat, from a moisture difference"],["Qt = 4.5 × CFM × Δh","Total heat, from an enthalpy difference"],["Q = 500 × GPM × ΔT","Heat carried by water in a hydronic loop"]],explain:`The constants all come from the same shape: 60 minutes per hour, times a density, times a specific heat. For air, 60 × 0.075 lb/ft³ × 0.24 Btu/lb·°F = 1.08. For water, 60 × 8.33 lb/gal × 1.0 = 500.

Because the air constants depend on density, they shrink at altitude. At 5,000 ft the 1.08 is closer to 0.90, and using the sea-level number overstates capacity by around 17%.`,source:c.standard("ASHRAE Handbook — Fundamentals, Ch. 1 (standard air constants)"),status:"verified"},cc={...I,id:"hvac.7.3.total-exceeds-sensible",objective:"7.3",kind:"choice",difficulty:3,prompt:`A coil is measured at 24,000 BTU/h total capacity and 18,000 BTU/h sensible.

What accounts for the difference?`,choices:["Latent capacity — 6,000 BTU/h of moisture removal that never shows on a thermometer","Measurement error; the two should be equal","Heat lost through the duct walls","Fan motor heat added to the airstream"],answer:0,explain:`Total = sensible + latent, so latent is 24,000 − 18,000 = 6,000 BTU/h. That is the energy spent condensing water out of the air, and a thermometer cannot see any of it.

The ratio, 18,000 ÷ 24,000 = 0.75, is the sensible heat ratio. It is the reason a system can satisfy a thermostat and leave a house feeling clammy: if airflow is set too high the coil runs warmer, SHR climbs toward 1.0, and the system stops dehumidifying while still hitting temperature.`,source:c.standard("Qt = Qs + Ql"),status:"verified"},lc={...I,id:"hvac.7.4.humid-climate-airflow",objective:"7.4",kind:"choice",difficulty:3,prompt:`A house in a humid climate reaches setpoint but feels damp. Static pressure and charge both check out, and airflow measures 440 CFM per ton.

What is the appropriate adjustment?`,choices:["Reduce airflow toward 350 CFM per ton so the coil runs colder and removes more moisture","Increase airflow to move more air past the coil","Add refrigerant to lower the coil temperature","Raise the thermostat setpoint"],answer:0,whyWrong:{1:"More airflow raises coil temperature and removes less moisture — the wrong direction.",2:"Overcharging does not lower coil temperature, and it damages the compressor.",3:"That changes comfort by making the house warmer, not drier."},explain:`Airflow sets the coil temperature. Less air over the same coil means the refrigerant has less heat arriving to boil it, so the coil runs colder — further below the air's dew point, and condensing more water out of it.

At 440 CFM/ton the coil is running warm and the sensible heat ratio is high: the system is spending its capacity on temperature and almost none on moisture. Dropping toward 350 shifts that balance.

The trade-off is real — go too low and the coil ices. 350 CFM/ton is the bottom of the band for this reason, and verifying superheat afterwards confirms you have not gone too far.`,source:c.todo("Confirm the airflow/dehumidification relationship against your text."),status:"draft"},hc={...I,id:"hvac.7.5.humidity-comfort",objective:"7.5",kind:"choice",difficulty:2,prompt:"Why does a house at 75°F and 65% RH feel less comfortable than the same house at 78°F and 45% RH?",choices:["High humidity slows evaporation from the skin, which is how the body sheds heat","Humid air conducts heat into the body faster","Humidity raises the actual air temperature","Humid air is denser and presses on the skin"],answer:0,explain:`The body loses a large share of its heat by evaporating moisture from the skin. That rate depends on how much more water the surrounding air can accept — so as humidity rises, evaporation slows and the same air temperature feels warmer.

This is why controlling moisture is worth as much as controlling temperature, and why a correctly dehumidifying system lets a customer sit comfortably at a higher setpoint. That higher setpoint is also cheaper to run, which makes it an easy conversation to have.`,source:c.todo("Confirm the comfort discussion against your text or ASHRAE Standard 55."),status:"draft"},dc={...I,id:"hvac.7.1.heating-drops-rh",objective:"7.1",kind:"choice",difficulty:3,prompt:`Air at 60°F and 70% RH is heated to 75°F with no moisture added or removed.

What happens to the relative humidity and the grains of moisture?`,choices:["RH falls; grains stay exactly the same","Both fall","RH stays the same; grains fall","Both rise"],answer:0,explain:`Grains measure the **actual** water content, and nothing added or removed it — so grains are unchanged.

Relative humidity is relative to what the air *could* hold at its current temperature, and warmer air can hold much more. Same water, bigger capacity, so RH falls.

This is why winter indoor air feels dry: cold outdoor air with modest moisture is heated to room temperature, and its RH collapses. Nothing dried it out — you just raised its capacity.`,source:c.standard("ASHRAE Handbook — Fundamentals, Ch. 1"),status:"verified"},uc={...I,id:"hvac.7.1.dew-point-condensation",objective:"7.1",kind:"choice",difficulty:2,prompt:`Room air has a dew point of 58°F. A supply duct in an unconditioned attic runs at 52°F.

What happens?`,choices:["Condensation forms on the duct, because its surface is below the air's dew point","Nothing, as long as the duct is insulated on the inside","The duct will frost over","The air in the duct will become saturated"],answer:0,explain:`Dew point is the temperature at which air begins to condense. Any surface colder than the surrounding air's dew point will collect water.

52°F duct surface, 58°F dew point → condensation, and in an attic that means dripping onto a ceiling.

The fix is insulation with a proper **vapour barrier** on the outside, so humid air never reaches the cold surface. Insulation alone without a sealed barrier just moves the condensation inside the insulation, where it does more damage unseen.`,source:c.standard("Dew point definition — ASHRAE Handbook Fundamentals Ch. 1"),status:"verified"},pc={...I,id:"hvac.7.3.sensible-calc",objective:"7.3",kind:"input",difficulty:2,prompt:`1,200 CFM of air is cooled from 76°F to 56°F dry bulb.

How much sensible heat is removed, in BTU/h?`,placeholder:"BTU/h",accept:["25920"],tolerance:400,explain:`Qs = 1.08 × CFM × ΔT = 1.08 × 1,200 × 20 = **25,920 BTU/h**.

That is a little over two tons of sensible capacity. Note this is only the sensible portion — total capacity including moisture removal would be higher, and the difference is the latent work the coil is also doing.`,source:c.standard("Qs = 1.08 × CFM × ΔT"),status:"verified"},mc={...I,id:"hvac.7.3.latent-by-difference",objective:"7.3",kind:"input",difficulty:3,prompt:`A coil measures 36,000 BTU/h total capacity and 27,000 BTU/h sensible.

What is the latent capacity, in BTU/h?`,placeholder:"BTU/h",accept:["9000"],tolerance:200,explain:`Total = sensible + latent, so latent = 36,000 − 27,000 = **9,000 BTU/h**.

That 9,000 BTU/h is spent condensing water out of the air and never appears on a thermometer. It is what makes a house feel comfortable rather than merely cool.

The sensible heat ratio here is 27,000 ÷ 36,000 = 0.75, which is a reasonable figure for a system doing real dehumidification.`,source:c.standard("Qt = Qs + Ql"),status:"verified"},fc={...I,id:"hvac.7.3.altitude-effect",objective:"7.3",kind:"choice",difficulty:3,prompt:`You use Qs = 1.08 × CFM × ΔT on a job at 5,000 ft elevation.

What is the problem?`,choices:["The 1.08 assumes sea-level air density; at altitude it is closer to 0.90, so you overstate capacity","The formula does not apply above 3,000 ft at all","ΔT must be measured in Celsius at altitude","There is no problem — the constant is universal"],answer:0,explain:`The 1.08 is 60 min/h × 0.075 lb/ft³ × 0.24 BTU/lb·°F. That 0.075 is standard air density at sea level.

At 5,000 ft the air is thinner — around 0.0625 lb/ft³ — so the constant drops to roughly 0.90. Using 1.08 overstates capacity by about 17%.

This is not a rounding error. It affects equipment selection, duct sizing and the airflow you calculate from a temperature drop. A Denver job genuinely does not behave like the same equipment in Houston.`,source:c.standard("Air density at altitude — ASHRAE Handbook Fundamentals Ch. 1"),status:"verified"},gc={...I,id:"hvac.7.3.hydronic-calc",objective:"7.3",kind:"input",difficulty:2,prompt:`A hydronic loop circulates 12 GPM with a 20°F temperature difference.

How much heat is it carrying, in BTU/h?`,placeholder:"BTU/h",accept:["120000"],tolerance:2e3,explain:`Q = 500 × GPM × ΔT = 500 × 12 × 20 = **120,000 BTU/h** — ten tons.

The 500 is 60 min/h × 8.33 lb/gal × 1.0 BTU/lb·°F. Compare what it takes in air: 120,000 BTU/h at a 20°F drop needs about 5,600 CFM, which is a very large duct.

That contrast is the whole argument for hydronic distribution in a large building.`,source:c.standard("Q = 500 × GPM × ΔT"),status:"verified"},wc={...I,id:"hvac.7.4.shr-interpretation",objective:"7.4",kind:"choice",difficulty:3,prompt:`A system is measured with a sensible heat ratio of 0.95.

What does that tell you?`,choices:["Almost all its capacity is going into temperature and it is doing very little dehumidification","It is running very efficiently","It is removing a lot of moisture","The system is oversized"],answer:0,explain:`SHR is sensible ÷ total. At 0.95, 95% of the capacity is lowering temperature and only 5% is removing moisture.

In a dry climate that is exactly right. In a humid one it is a problem: the house will hit setpoint and still feel damp, because the coil is running too warm to condense much water.

The usual cause is airflow set too high. Reducing it toward 350 CFM/ton drops the coil temperature, pushes more capacity into latent work, and brings SHR down.`,source:c.standard("SHR = Qs ÷ Qt"),status:"verified"},yc={...I,id:"hvac.7.5.oversized-humidity",objective:"7.5",kind:"choice",difficulty:3,prompt:`An oversized system in a humid climate cools the house quickly but leaves it feeling clammy.

Why does oversizing hurt dehumidification specifically?`,choices:["It satisfies the thermostat and shuts off before the coil has run long enough to condense much water","Larger coils are inherently worse at dehumidifying","Oversized systems always run at higher airflow per ton","The extra capacity raises the coil temperature"],answer:0,explain:`Dehumidification takes time. The coil has to get cold, stay cold, and have water actually run off it — and a large part of each cycle is spent just getting the coil down to temperature.

An oversized system drops the dry bulb fast, satisfies the thermostat, and shuts off. Short cycles mean the coil never spends long in the condensing regime, and on shutdown the water sitting on it re-evaporates back into the house.

This is why "bigger is better" is wrong for comfort, and why proper load calculation matters more in humid climates than dry ones.`,source:c.todo("Confirm the oversizing discussion against your text or ACCA Manual J."),status:"draft"},bc={...I,id:"hvac.7.5.outdoor-air-load",objective:"7.5",kind:"choice",difficulty:3,prompt:"A building brings in outdoor air for ventilation. In a humid climate, what does that add to the load?",choices:["A large latent load, because outdoor air must be dehumidified as well as cooled","Only a sensible load, since ventilation air is filtered","No additional load if the outdoor air is cooler than indoors","A load only during the hottest hours"],answer:0,explain:`Ventilation air arrives at outdoor conditions, and in a humid climate that means a lot of moisture. Bringing it to indoor conditions requires removing that moisture, which is latent load.

The trap in the "cooler than indoors" reasoning: a 72°F night with 90% RH holds far more moisture than 78°F indoor air at 50%. Cooler is not drier, and dew point is what tells you.

This is why energy recovery ventilators exist — they pre-condition incoming air against the outgoing stream, transferring both heat and moisture, so the equipment sees a much smaller ventilation load.`,source:c.todo("Confirm the ventilation load discussion against your text or ASHRAE 62."),status:"draft"},vc=[ic,dc,uc,oc,sc,nc,rc,pc,mc,fc,gc,cc,wc,lc,yc,bc,hc],A={track:"hvac",domain:"8.0"},ma={caption:"Each stage proves itself before the next is allowed to run",nodes:[{id:"tstat",kind:"thermostat",label:"W call",col:0,row:1},{id:"ind",kind:"fan",label:"Inducer",sublabel:"purge",col:1,row:1},{id:"ps",kind:"sensor",label:"Pressure sw.",sublabel:"proves draft",col:2,row:1},{id:"ign",kind:"controller",label:"Igniter",sublabel:"heats up",col:3,row:1},{id:"gas",kind:"metering",label:"Gas valve",sublabel:"opens",col:4,row:1},{id:"flame",kind:"sensor",label:"Flame sensor",sublabel:"proves flame",col:5,row:1}],links:[{from:"tstat",to:"ind"},{from:"ind",to:"ps"},{from:"ps",to:"ign"},{from:"ign",to:"gas"},{from:"gas",to:"flame"}]},kc={...A,id:"hvac.8.1.combustion-triangle",objective:"8.1",kind:"multi",difficulty:1,prompt:"What three things must be present for combustion? Select all that apply.",choices:["Fuel","Oxygen","An ignition source or sufficient heat","Moisture"],answers:[0,1,2],explain:`Fuel, oxygen and heat. Remove any one and combustion stops, which is the basis of every safety control on a fired appliance — a gas valve removes fuel, a blocked-vent switch removes the conditions for safe operation, and a flame sensor confirms the heat is actually there.

Complete combustion of natural gas produces carbon dioxide and water vapour. Incomplete combustion — usually from insufficient air — produces carbon monoxide, which is what makes combustion air a life-safety issue rather than an efficiency one.`,source:c.todo("Confirm against the combustion chapter of your text."),status:"draft"},Tc={...A,id:"hvac.8.1.gas-properties",objective:"8.1",kind:"choice",difficulty:2,prompt:"Roughly what is the heating value of natural gas, and what manifold pressure does a typical residential furnace run?",choices:["About 1,000 BTU per cubic foot, at about 3.5 in. w.c. manifold pressure","About 2,500 BTU per cubic foot, at about 11 in. w.c.","About 100 BTU per cubic foot, at about 3.5 in. w.c.","About 1,000 BTU per cubic foot, at about 0.5 in. w.c."],answer:0,explain:`Natural gas runs around 1,000 BTU/ft³, with manifold pressure typically set near 3.5 in. w.c. Propane is roughly 2,500 BTU/ft³ and runs about 11 in. w.c. — which is why the two are not interchangeable without an orifice and pressure conversion.

The 1,000 BTU/ft³ figure is what makes clocking the meter possible: time how long the meter takes to pass a known volume and you have the actual firing rate, which is the honest check on whether a furnace is running at nameplate input.

Always verify the local heating value with the gas utility — it varies by supply.`,source:c.todo("Confirm gas properties and manifold pressures against your text and the equipment data plate."),status:"draft"},xc={...A,id:"hvac.8.2.sequence",objective:"8.2",kind:"order",difficulty:3,prompt:"Put the sequence of operation for a modern induced-draft gas furnace in order.",steps:["Thermostat closes on a call for heat","Inducer motor starts and purges the heat exchanger","Pressure switch proves inducer airflow and closes","Igniter energises and reaches ignition temperature","Gas valve opens and the burners light","Flame sensor proves flame within the trial-for-ignition period","Blower starts after the fan-on delay","On satisfying the thermostat, the gas valve closes and the blower runs out its off delay"],explain:`The order is dictated by safety at every step. The inducer runs first and proves itself through the pressure switch, so gas is never introduced without a proven path for the flue gases. The igniter is hot before the valve opens, so gas never accumulates unlit.

The flame sensor is the last proof and the most commonly failed component in the chain: a furnace that lights and then shuts down after a few seconds, repeatedly, is almost always a dirty flame sensor or a grounding problem in the sensing circuit.

The blower delays exist for comfort and efficiency — on-delay stops it blowing cold air, off-delay scavenges the remaining heat from the exchanger.`,source:c.todo("Confirm the sequence against the equipment manufacturer literature."),status:"draft"},Cc={...A,id:"hvac.8.2.three-tries-lockout",objective:"8.2",kind:"choice",difficulty:3,prompt:`A furnace lights, runs about five seconds, shuts off, retries twice more, then locks out.

What does this pattern point to?`,choices:["Flame is not being proved — a dirty or failed flame sensor, or a grounding problem","The thermostat is set too low","The blower motor has failed","The gas supply pressure is too high"],answer:0,explain:`The furnace is lighting successfully, so gas, ignition and the inducer chain are all working. What is failing is the proof: the board does not see flame, so it closes the gas valve and retries. After the programmed number of attempts it locks out.

Flame rectification works by passing a tiny DC current — microamps — from the sensor through the flame to the grounded burner. Oxide film on the sensor blocks it, as does a poor burner ground. Cleaning the sensor with fine abrasive and confirming the burner ground is the usual fix; a microamp reading tells you definitively.

This "lights then drops out" pattern is one of the most recognisable in the trade, and it rules out most of the sequence in a single observation.`,source:c.todo("Confirm the flame proving discussion and microamp values against your text."),status:"draft"},Ac={...A,id:"hvac.8.3.ignition-types",objective:"8.3",kind:"match",difficulty:2,prompt:"Match each ignition system to how it works.",pairs:[["Standing pilot","A continuously burning pilot flame, proved by a thermocouple"],["Intermittent pilot","A pilot lit by spark on each call, then proved before the main valve opens"],["Hot surface ignition","A silicon carbide or nitride element glowing hot enough to light gas directly"],["Direct spark ignition","A spark igniting the main burner with no pilot at all"]],explain:`The progression is toward eliminating the standing pilot, which burns fuel continuously for no benefit for most of the year.

A thermocouple on a standing pilot generates a small DC voltage — around 25 to 30 millivolts in the flame — and that voltage is what holds the safety valve open. No flame, no millivolts, valve closes. It is elegantly self-proving and needs no external power.

Hot surface igniters are fragile. Handle them by the ceramic base only: skin oils on the element cause hot spots that crack it.`,source:c.todo("Confirm the ignition types and thermocouple values against your text."),status:"draft"},Sc={...A,id:"hvac.8.4.condensing",objective:"8.4",kind:"choice",difficulty:3,prompt:"What makes a condensing furnace more efficient than a conventional one?",choices:["A second heat exchanger cools the flue gas below its dew point, recovering the latent heat in the water vapour","It burns the gas twice","It runs at a higher manifold pressure","It has no flue, so no heat escapes"],answer:0,explain:`Burning natural gas produces water vapour, and that vapour carries a large amount of latent heat. A conventional furnace sends it up the flue still as vapour, and the heat goes with it.

A condensing furnace adds a secondary heat exchanger that drops the flue gas below its dew point. The vapour condenses, releasing its latent heat into the airstream — which is what takes AFUE past 90%.

The consequences are practical: the condensate is mildly acidic, so the secondary exchanger is stainless or aluminium and the drain must be handled properly, often neutralised. Flue gas is cool enough to vent through PVC, and it must be — it will not rise up a masonry chimney. A blocked condensate drain is one of the most common no-heat calls on these furnaces, because the pressure switch senses the backed-up water and refuses to run.`,source:c.todo("Confirm condensing furnace operation against your text."),status:"draft"},Rc={...A,id:"hvac.8.5.categories",objective:"8.5",kind:"match",difficulty:3,prompt:"Match each vent category to its characteristics.",pairs:[["Category I","Negative vent pressure, non-condensing — natural draft and most induced draft"],["Category II","Negative vent pressure, condensing"],["Category III","Positive vent pressure, non-condensing"],["Category IV","Positive vent pressure, condensing — high-efficiency furnaces vented in PVC"]],explain:`Two variables: whether the vent runs above or below atmospheric pressure, and whether the flue gas condenses. The four combinations give the four categories.

The distinction is not academic. A Category I appliance relies on buoyancy and needs a vent that will draft; a Category IV appliance is pushed by its inducer and its vent must be sealed against leaks, because it is under positive pressure inside a living space.

Venting a furnace to the wrong category — most often putting a high-efficiency furnace into an existing masonry chimney — puts flue gas where people breathe. Always vent to the manufacturer's instructions and the applicable code.`,source:c.todo("Confirm the vent categories against your text and the applicable fuel gas code."),status:"draft"},Fc={...A,id:"hvac.8.5.combustion-air",objective:"8.5",kind:"choice",difficulty:3,prompt:`A natural-draft water heater in a small mechanical closet backdrafts whenever the clothes dryer and kitchen exhaust run.

What is happening?`,choices:["The exhaust appliances depressurise the space, and the flue becomes the easiest path for makeup air","The water heater thermostat is set too high","The flue is too large in diameter","The gas pressure is too low"],answer:0,explain:`Exhaust fans remove air from the house, and that air has to be replaced from somewhere. In a tight house with a sealed closet, the path of least resistance can be back down the water heater flue — reversing the draft and spilling combustion products, including carbon monoxide, into the space.

This is why combustion air openings are sized and required, and why a natural-draft appliance in a confined space needs deliberate provision for air. The test is a worst-case depressurisation check: run every exhaust appliance and confirm the flue still drafts.

The modern answer is usually a sealed-combustion appliance that draws its air directly from outdoors and is immune to what the house is doing.`,source:c.todo("Confirm combustion air requirements against your text and the applicable fuel gas code."),status:"draft"},qc={...A,id:"hvac.8.6.components",objective:"8.6",kind:"match",difficulty:2,prompt:"Match each hydronic component to its purpose.",pairs:[["Expansion tank","Absorbs the volume change as water heats, holding system pressure stable"],["Circulator pump","Moves water around the loop"],["Air separator","Removes entrained air, which would otherwise block flow and corrode"],["Zone valve","Directs flow to one part of the building on a call from that zone"],["Aquastat","Controls boiler water temperature and its operating limits"]],explain:`Water is nearly incompressible, so without an expansion tank the pressure rise on heating would lift the relief valve every cycle. A waterlogged expansion tank is a very common cause of a relief valve that keeps discharging.

Air is the other recurring problem. It collects at high points, blocks circulation, and accelerates corrosion — which is why separators and air vents exist and why a proper purge after any work matters.`,source:c.todo("Confirm the hydronic component list against your text."),status:"draft"},$c={...A,id:"hvac.8.7.sequencer-purpose",objective:"8.7",kind:"choice",difficulty:2,prompt:"Why are electric heat strips brought on in stages by a sequencer rather than all at once?",choices:["To limit inrush current and the resulting voltage drop and load on the supply","To make the heat last longer","Because the strips would burn out if energised together","To let the blower start first"],answer:0,explain:`Electric resistance heat draws serious current — a 20 kW bank at 240 V is over 80 A. Bringing that on in one step causes a sharp voltage dip that affects the whole building and stresses contactors and the supply.

A sequencer staggers the stages a few seconds apart so the load ramps. The same device also usually keeps the blower running until the strips have cooled, which is a genuine safety function: energised strips with no airflow will overheat and trip their limits, or worse.

Electric heat is 100% efficient at the appliance, which sounds impressive but simply means all the electricity becomes heat. A heat pump moves two to four times as much heat per unit of electricity, which is why strips are a supplement rather than a primary heat source where a heat pump is available.`,source:c.todo("Confirm the sequencer discussion against your text."),status:"draft"},Ic={...A,id:"hvac.8.2.hotspot-flame-proving",objective:"8.2",kind:"hotspot",difficulty:2,topology:ma,prompt:`A furnace lights and then shuts down after a few seconds, repeatedly.

Click the component that is failing to do its job.`,answer:"flame",whyWrong:{ind:"The inducer clearly ran — the sequence got as far as lighting.",ps:"The pressure switch clearly closed, or the gas valve would never have opened.",ign:"The igniter clearly worked — the burners lit.",gas:"The gas valve clearly opened. The problem is what happened after."},explain:`The burners lit, which proves the thermostat, inducer, pressure switch, igniter and gas valve all worked. What failed is the **proof of flame**.

Flame rectification passes a tiny DC current — microamps — from the sensor through the flame to the grounded burner. Oxide film on the sensor blocks it, as does a poor burner ground. The board sees no flame, closes the gas valve, and retries.

One observation eliminated five of six steps. That is what knowing the sequence buys you.`,source:c.todo("Confirm the flame proving discussion against your text."),status:"draft"},Mc={...A,id:"hvac.8.2.hotspot-pressure-switch",objective:"8.2",kind:"hotspot",difficulty:3,topology:ma,prompt:`The inducer runs but the igniter never glows and the gas valve never opens.

Click the component most likely blocking the sequence.`,answer:"ps",whyWrong:{ind:"The inducer is running, so it is doing its job.",ign:"The igniter is downstream of the blockage — it never got permission to energise.",gas:"The gas valve is further downstream still.",flame:"Flame proving comes after ignition, which never happened."},explain:`The inducer runs, so the call and the inducer circuit are fine. The next step in the chain is the **pressure switch**, which must close to prove the inducer is actually moving air before the board will allow ignition.

If it does not close, everything downstream stays dead — which is exactly the symptom.

Causes: a blocked or cracked hose to the switch, a blocked flue or intake, a failed switch, or on a condensing furnace a **blocked condensate drain** backing water up into the pressure switch circuit. That last one is one of the most common no-heat calls on high-efficiency equipment.`,source:c.todo("Confirm the pressure switch failure modes against your text."),status:"draft"},Pc={...A,id:"hvac.8.1.carbon-monoxide",objective:"8.1",kind:"choice",difficulty:2,prompt:"What does incomplete combustion of natural gas produce, and what causes it?",choices:["Carbon monoxide, usually from insufficient combustion air","Carbon dioxide, from excess air","Nitrogen oxides, from low manifold pressure","Water vapour, from a cold heat exchanger"],answer:0,explain:`Complete combustion of natural gas produces carbon dioxide and water vapour, both harmless in this context. **Incomplete** combustion produces carbon monoxide.

The usual cause is not enough air — a blocked flue, inadequate combustion air openings, a dirty burner, or a cracked heat exchanger disturbing the flame.

CO is colourless and odourless. This is why combustion air is a life-safety requirement rather than an efficiency preference, and why a combustion analyser is the instrument that actually answers the question.`,source:c.todo("Confirm the combustion discussion against your text."),status:"draft"},Wc={...A,id:"hvac.8.1.clocking-the-meter",objective:"8.1",kind:"choice",difficulty:3,prompt:"Why would you clock the gas meter on a furnace, and what does it tell you?",choices:["It measures the actual firing rate in BTU/h, which is the honest check on whether the furnace matches nameplate input","It measures the efficiency of the heat exchanger","It measures flue gas temperature indirectly","It confirms the manifold pressure is correct"],answer:0,explain:`You time how long the meter takes to pass a known volume — one cubic foot, say — with every other gas appliance off. From that you get cubic feet per hour, and at roughly 1,000 BTU/ft³ you get the actual input.

That is the real firing rate, not what the nameplate claims. Overfiring wastes fuel and can crack a heat exchanger; underfiring means the furnace cannot meet the load.

Verify the local heating value with the utility — it varies by supply, and 1,000 BTU/ft³ is a nominal figure rather than a constant.`,source:c.todo("Confirm the clocking procedure against your text."),status:"draft"},Ec={...A,id:"hvac.8.2.blower-delays",objective:"8.2",kind:"choice",difficulty:2,prompt:"Why does a furnace blower keep running for a period after the gas valve closes?",choices:["To scavenge the remaining heat out of the heat exchanger, for efficiency and to protect it from overheating","To cool the igniter before the next cycle","To purge unburned gas from the combustion chamber","To equalise pressure in the ductwork"],answer:0,explain:`The heat exchanger is still hot when the burners shut off. Running the blower moves that heat into the house instead of letting it soak away — free capacity you have already paid for.

It also protects the exchanger. Heat with no airflow across it drives the high-limit switch open and, over time, stresses the metal.

The on-delay at the start exists for the opposite reason: it stops the blower pushing cold air at people before the exchanger has warmed up.`,source:c.todo("Confirm the blower delay discussion against your text."),status:"draft"},jc={...A,id:"hvac.8.3.hsi-handling",objective:"8.3",kind:"choice",difficulty:2,prompt:"Why must a hot surface igniter be handled only by its ceramic base?",choices:["Skin oils on the element cause hot spots that crack it","The element stays hot for hours after operation","The element carries line voltage even when disconnected","Fingerprints interfere with flame rectification"],answer:0,explain:`Silicon carbide and silicon nitride elements are brittle and heat unevenly if contaminated. Oil from your fingers burns onto the surface, creating a spot that runs hotter than the rest, and thermal stress cracks it — often within a few cycles.

They are also fragile mechanically. Dropping one, or knocking it against the burner assembly during installation, is enough to finish it.

Handle by the base, install carefully, and check the resistance value against spec before assuming a no-ignition fault is elsewhere.`,source:c.todo("Confirm HSI handling guidance against your text and manufacturer instructions."),status:"draft"},Oc={...A,id:"hvac.8.3.thermocouple-principle",objective:"8.3",kind:"choice",difficulty:3,prompt:"How does a thermocouple on a standing-pilot system hold the gas valve open?",choices:["The flame generates a small DC voltage that energises an electromagnet in the valve","The flame heats a bimetal strip that pushes the valve open","The flame creates pressure that lifts the valve seat","It signals a control board to open the valve"],answer:0,explain:`Two dissimilar metals joined and heated generate a small voltage — the Seebeck effect. In a pilot flame a thermocouple produces roughly 25 to 30 millivolts.

That tiny voltage energises an electromagnet holding the safety valve open. No flame, no millivolts, the magnet releases and the valve closes.

It is elegantly self-proving and needs no external power at all, which is why standing-pilot systems keep working in a power cut. The cost is a pilot burning fuel year-round, which is why the design has been superseded.`,source:c.todo("Confirm the thermocouple discussion and millivolt values against your text."),status:"draft"},Lc={...A,id:"hvac.8.4.cracked-exchanger",objective:"8.4",kind:"choice",difficulty:3,prompt:"Why is a cracked heat exchanger a condemn-the-furnace condition rather than a repair?",choices:["It allows combustion products, including carbon monoxide, to mix with the supply air","It reduces efficiency below the legal minimum","It causes the blower motor to overheat","It voids the manufacturer warranty"],answer:0,explain:`The heat exchanger is the barrier between combustion gases and the air people breathe. A crack breaches that barrier, and the blower can pull flue products — including carbon monoxide — directly into the supply air.

A common tell is a flame that changes shape or rolls out when the blower starts, because the blower is now pulling on the combustion chamber through the crack.

This is a shut-it-down-and-red-tag condition. The furnace comes out of service until the exchanger is replaced or the unit is.`,source:c.todo("Confirm heat exchanger inspection guidance against your text and code."),status:"draft"},Nc={...A,id:"hvac.8.5.why-pvc",objective:"8.5",kind:"choice",difficulty:2,prompt:"Why is a condensing furnace vented in PVC rather than metal flue pipe?",choices:["Flue gas is cool and acidic, and it will not rise up a conventional chimney anyway","PVC is cheaper and code allows it","PVC handles higher temperatures than metal","Metal would create too much draft"],answer:0,explain:`A condensing furnace extracts so much heat that the flue gas leaves close to room temperature and carrying liquid condensate. Two consequences follow.

It has no buoyancy, so it will not rise up a masonry chimney — the inducer has to push it, which makes it a positive-pressure (Category IV) vent that must be sealed.

And the condensate is mildly acidic, which attacks metal flue pipe. PVC handles both the low temperature and the acidity.

Venting a high-efficiency furnace into an existing chimney is a serious and unfortunately common installation error.`,source:c.todo("Confirm venting requirements against your text and the applicable fuel gas code."),status:"draft"},Hc={...A,id:"hvac.8.6.waterlogged-tank",objective:"8.6",kind:"choice",difficulty:3,prompt:`A boiler relief valve discharges every time the system heats up.

What should you check first?`,choices:["The expansion tank — a waterlogged tank cannot absorb the volume change as water heats","The circulator pump, which is over-pumping","The aquastat setting, which is too high","The relief valve, which has failed open"],answer:0,explain:`Water expands as it heats, and it is nearly incompressible. The expansion tank exists to give that extra volume somewhere to go, using an air cushion behind a bladder.

If the bladder has failed or the air charge has been lost, the tank fills with water and has no cushion left. The pressure then rises sharply on every heating cycle, and the relief valve does exactly what it should.

Replacing the relief valve is treating the symptom — the new one will discharge too. Check the tank's air charge against system fill pressure.`,source:c.todo("Confirm the expansion tank discussion against your text."),status:"draft"},Dc={...A,id:"hvac.8.7.electric-vs-heatpump",objective:"8.7",kind:"choice",difficulty:3,prompt:"Electric resistance heat is 100% efficient at the appliance. Why is a heat pump still much cheaper to run?",choices:["A heat pump moves existing heat rather than creating it, delivering two to four times more heat per unit of electricity","Heat pumps use less electricity per hour","Resistance heat wastes energy up the flue","Heat pumps are rated on a different efficiency scale that is not comparable"],answer:0,explain:`100% efficient sounds impressive but simply means all the electricity becomes heat. One unit in, one unit out.

A heat pump does not create heat — it **moves** heat that already exists in the outdoor air. One unit of electricity can move two to four units of heat, so it exceeds 100% in the sense that matters to a power bill.

That is why strips are a supplement rather than a primary heat source wherever a heat pump is available, and why a customer left in emergency heat all winter gets a shocking bill.`,source:c.todo("Confirm the efficiency comparison against your text."),status:"draft"},Bc=[kc,Pc,Tc,Wc,xc,Ic,Mc,Cc,Ec,Ac,jc,Oc,Sc,Lc,Rc,Nc,Fc,qc,Hc,$c,Dc],W={track:"hvac",domain:"9.0"},fa={caption:"Heat pump in heating mode — the outdoor coil is now the evaporator",nodes:[{id:"comp",kind:"compressor",label:"Compressor",col:0,row:1},{id:"rv",kind:"metering",label:"Reversing valve",sublabel:"energised or not",col:1,row:1},{id:"indoor",kind:"condenser",label:"Indoor coil",sublabel:"CONDENSER in heating",col:2,row:0},{id:"outdoor",kind:"evaporator",label:"Outdoor coil",sublabel:"EVAPORATOR in heating",col:2,row:2},{id:"meter",kind:"metering",label:"Metering",col:3,row:1}],links:[{from:"comp",to:"rv"},{from:"rv",to:"indoor",label:"hot gas"},{from:"indoor",to:"meter"},{from:"meter",to:"outdoor"},{from:"outdoor",to:"rv",label:"cool vapour"}]},zc={...W,id:"hvac.9.1.coil-roles",objective:"9.1",kind:"choice",difficulty:2,topology:fa,prompt:"In heating mode, what role does each coil play?",choices:["The indoor coil is the condenser and the outdoor coil is the evaporator","The indoor coil is the evaporator and the outdoor coil is the condenser","Both coils act as condensers","The roles depend on outdoor temperature rather than on mode"],answer:0,explain:`The reversing valve swaps which coil receives hot discharge gas. In heating, the indoor coil gets it and condenses — rejecting heat into the house — while the outdoor coil boils refrigerant, absorbing heat from outdoor air.

It sounds implausible that a 30°F outdoor coil absorbs heat from 30°F air, but heat only has to move from warmer to cooler: with the refrigerant boiling at perhaps 15°F, outdoor air at 30°F is a heat source. Capacity falls as it gets colder because that temperature difference shrinks.

The terms "evaporator" and "condenser" describe what a coil is doing at that moment, not where it is mounted — which is why heat pump literature often says "indoor coil" and "outdoor coil" instead.`,source:c.todo("Confirm the heating mode description against your text."),status:"draft"},Vc={...W,id:"hvac.9.1.valve-energised",objective:"9.1",kind:"choice",difficulty:3,prompt:`A heat pump with an O-terminal reversing valve blows cold air when the thermostat calls for heat, and warm air when it calls for cooling.

What should you check first?`,choices:["Whether the thermostat is configured for O rather than B, and whether O is energised in the wrong mode","The refrigerant charge","The outdoor fan motor","The defrost board timer setting"],answer:0,explain:`The modes are exactly inverted, which points at the reversing valve control rather than anything in the refrigerant circuit — a charge or airflow problem degrades performance, it does not swap heating and cooling.

O energises the valve in cooling; B energises it in heating. A thermostat configured for the wrong one gives precisely this symptom. It is a configuration setting on most modern thermostats and a very common error after a replacement.

If the configuration is right, then either the valve solenoid is being energised incorrectly by the board, or the valve itself is stuck. Feeling the pipe temperatures at the valve body while switching modes tells you which.`,source:c.todo("Confirm the O/B convention against your text and the thermostat documentation."),status:"draft"},Uc={...W,id:"hvac.9.2.defrost-mechanism",objective:"9.2",kind:"choice",difficulty:3,prompt:"What actually happens during a heat pump defrost cycle?",choices:["The unit switches to cooling, the outdoor fan stops, and auxiliary heat runs to temper the indoor air","An electric heater on the outdoor coil melts the frost","The compressor stops and the outdoor fan runs to blow the frost off","The indoor blower reverses to push warm air outside"],answer:0,explain:`Defrost uses the system itself. Switching to cooling sends hot discharge gas to the outdoor coil, which melts the frost from the inside out. The outdoor fan stops so that cold air is not blowing across the coil it is trying to warm.

The catch is that the indoor coil is now absorbing heat, so it is cooling the house. That is why auxiliary heat is energised during defrost — to temper the supply air so the occupants do not feel a blast of cold.

Steam rising off the outdoor unit in winter is normal defrost, not a fault. The complaint worth investigating is a unit defrosting far too often, or one that never does and ices solid.`,source:c.todo("Confirm the defrost sequence against your text and the equipment literature."),status:"draft"},Gc={...W,id:"hvac.9.2.termination",objective:"9.2",kind:"choice",difficulty:3,prompt:"A demand-defrost heat pump initiates defrost on measured coil conditions. What normally terminates the cycle?",choices:["A coil temperature sensor reaching its termination setpoint, with a maximum time as a backup","A fixed ten-minute timer in every case","The indoor thermostat being satisfied","The outdoor ambient rising above freezing"],answer:0,explain:`Termination is on temperature, because that is what actually indicates the frost has gone. The timer is a backup limit that stops a stuck cycle running indefinitely, not the normal means of ending it.

This is the distinction between demand defrost and older time-and-temperature controls, which defrosted every 30, 60 or 90 minutes of run time whether or not there was frost. Demand defrost only runs when conditions warrant, which saves the efficiency penalty of unnecessary cycles.

A system terminating on time rather than temperature every cycle is a symptom worth chasing — usually a failed or mislocated coil sensor.`,source:c.todo("Confirm the defrost termination logic against the equipment manufacturer literature."),status:"draft"},_c={...W,id:"hvac.9.3.aux-vs-emergency",objective:"9.3",kind:"choice",difficulty:2,prompt:"What is the difference between auxiliary heat and emergency heat?",choices:["Auxiliary heat supplements the running heat pump; emergency heat replaces it entirely with the compressor off","They are two names for the same thing","Auxiliary heat is electric; emergency heat is gas","Auxiliary heat runs in summer; emergency heat runs in winter"],answer:0,explain:`Auxiliary heat comes on alongside the heat pump when the heat pump alone cannot keep up — the compressor keeps running and the strips make up the shortfall. That is normal operation on a cold day.

Emergency heat is a manual selection that locks the compressor off and heats entirely with the strips. It is for when the heat pump has failed, and it is expensive to run because resistance heat costs two to four times what the heat pump would.

A customer who left the thermostat in emergency heat all winter and then complains about the bill is a genuinely common call. So is a system running aux far more than it should, which usually points at a heat pump that is not producing its rated capacity.`,source:c.todo("Confirm the aux/emergency distinction against your text."),status:"draft"},Qc={...W,id:"hvac.9.4.balance-point",objective:"9.4",kind:"choice",difficulty:3,prompt:"What is the balance point of a heat pump installation?",choices:["The outdoor temperature at which the heat pump's capacity exactly equals the building's heat loss","The temperature at which heating and cooling costs are equal","The point at which the reversing valve switches","The outdoor temperature at which defrost begins"],answer:0,explain:`Two lines cross at the balance point. Building heat loss rises as it gets colder outside; heat pump capacity falls, because the outdoor coil has less temperature difference to work with. Where they meet, the heat pump exactly meets the load.

Below that temperature the heat pump cannot keep up on its own and auxiliary heat has to make up the difference. Above it, the heat pump alone is enough and any aux operation is waste.

A typical residential balance point falls somewhere around 30–35°F, though it depends entirely on the building and the equipment. Knowing it is what lets you judge whether the aux heat you are seeing is normal for the weather or a symptom.`,source:c.todo("Confirm the balance point discussion against your text."),status:"draft"},Yc={...W,id:"hvac.9.5.charging-in-heating",objective:"9.5",kind:"choice",difficulty:3,prompt:"Why is charging a heat pump in heating mode unreliable, and what is the usual guidance?",choices:["Charge in cooling mode where the charts apply, or weigh in the charge; heating-mode readings vary too much with outdoor conditions","Heating mode charging is preferred, because the readings are more stable","Charge is irrelevant to a heat pump because the refrigerant reverses direction","Only subcooling can be measured in heating mode"],answer:0,explain:`In heating mode the outdoor coil is the evaporator, and its performance swings with outdoor temperature and humidity, frost accumulation and where the unit sits in its defrost cycle. The readings move around too much to charge against reliably.

The usual approaches are to charge in cooling mode where the manufacturer's charts apply, or to recover, evacuate and weigh in the nameplate charge with the line-set adjustment — which is accurate regardless of the weather and is the right answer in winter.

Always check the manufacturer instructions. Some units have a specific heating-mode charging procedure with its own chart, and where one exists it takes precedence over the general rule.`,source:c.todo("Confirm heat pump charging guidance against your text and the equipment literature."),status:"draft"},Jc={...W,id:"hvac.9.1.hotspot-heating-condenser",objective:"9.1",kind:"hotspot",difficulty:2,topology:fa,prompt:"The system is in HEATING mode. Click the coil that is acting as the condenser.",answer:"indoor",whyWrong:{outdoor:"In heating the outdoor coil is the EVAPORATOR — it absorbs heat from outdoor air.",comp:"The compressor raises pressure. It is not a coil.",rv:"The reversing valve directs flow; it is not where heat is exchanged.",meter:"The metering device drops pressure between the two coils."},explain:`In heating, the reversing valve sends hot discharge gas to the **indoor** coil, which condenses and rejects that heat into the house. Meanwhile the outdoor coil boils refrigerant, absorbing heat from outdoor air.

The roles swap entirely in cooling. That is why heat pump literature says "indoor coil" and "outdoor coil" — the words evaporator and condenser describe what a coil is doing right now, not where it is mounted.`,source:c.todo("Confirm the heating mode description against your text."),status:"draft"},Xc={...W,id:"hvac.9.1.valve-mid-position",objective:"9.1",kind:"choice",difficulty:3,prompt:`A heat pump produces weak heating and weak cooling in both modes. Superheat is low and the suction line is warm.

What should you suspect?`,choices:["A reversing valve stuck part-way, allowing hot gas to leak straight into the suction line","An undercharge","A dirty outdoor coil","A failed defrost board"],answer:0,explain:`A reversing valve that has not shifted fully lets discharge gas bypass internally into the suction side. The system then works against itself in both modes — hot gas returning to the compressor instead of going where it should.

The tell is a warm suction line with low superheat, and poor performance in *both* directions. A charge or airflow problem degrades one mode more than the other; a stuck valve degrades both equally.

Feeling the pipe temperatures at the valve body confirms it: the two suction-side ports should be at clearly different temperatures, and on a leaking valve they converge.`,source:c.todo("Confirm the reversing valve failure discussion against your text."),status:"draft"},Kc={...W,id:"hvac.9.2.steam-is-normal",objective:"9.2",kind:"choice",difficulty:1,prompt:`A customer reports steam pouring off their outdoor unit on a cold morning and is worried it is on fire.

What is happening?`,choices:["Normal defrost — melting frost is evaporating off a warm coil","A refrigerant leak vaporising","The compressor is overheating","Condensate is freezing on the fan blade"],answer:0,explain:`During defrost the outdoor coil gets hot enough to melt its accumulated frost, and that water flashes to vapour in cold air. It looks dramatic and it is entirely normal.

A defrost cycle typically lasts a few minutes and ends on coil temperature. What *is* worth investigating is a unit defrosting far more often than it should, or one that never defrosts and ices solid.

Worth explaining to customers proactively — it is a common and easily reassured call.`,source:c.todo("Confirm the defrost discussion against your text."),status:"draft"},Zc={...W,id:"hvac.9.2.why-aux-during-defrost",objective:"9.2",kind:"choice",difficulty:3,prompt:"Why does auxiliary heat energise during a defrost cycle?",choices:["The indoor coil is absorbing heat during defrost, so aux tempers the supply air","To melt the frost faster","To protect the compressor from liquid return","To keep the outdoor fan from freezing"],answer:0,explain:`Defrost runs the system in **cooling**. That means the indoor coil is now the evaporator, absorbing heat from the house — exactly the wrong direction on a winter morning.

Without auxiliary heat, the supply registers would blow cold air at the occupants for the several minutes defrost takes. The strips offset that.

It is also why a heat pump defrosting frequently is expensive: every cycle runs resistance heat as well as reversing the system.`,source:c.todo("Confirm the defrost sequence against your text."),status:"draft"},el={...W,id:"hvac.9.3.excessive-aux",objective:"9.3",kind:"choice",difficulty:3,prompt:`A customer's electric bill has jumped. You find auxiliary heat running at 45°F outdoor temperature, well above the expected balance point.

What does that suggest?`,choices:["The heat pump is not producing its rated capacity, so aux is making up a shortfall it should not have to","The balance point is set correctly and this is normal","The thermostat is in emergency heat","The outdoor temperature sensor is reading low"],answer:0,whyWrong:{1:"Aux at 45°F is well above a typical 30–35°F balance point.",2:"Possible, but emergency heat locks the compressor off entirely — worth checking, but the compressor is running here.",3:"Also worth checking, but it is the less likely of the explanations."},explain:`Above the balance point the heat pump alone should meet the load. Aux running at 45°F means the heat pump is delivering less than it should.

Causes to check: low charge, restricted outdoor airflow, a partially stuck reversing valve, a failing compressor, or low indoor airflow. Any of these reduce heating capacity and force the strips to cover the gap — at two to four times the running cost.

Also check the thermostat configuration. Some are set with an aux lockout temperature, and a misconfigured one brings strips on far too readily.`,source:c.todo("Confirm the aux heat diagnosis against your text."),status:"draft"},tl={...W,id:"hvac.9.4.two-lines",objective:"9.4",kind:"choice",difficulty:3,prompt:"As outdoor temperature falls, what happens to building heat loss and heat pump capacity?",choices:["Heat loss rises while capacity falls — they cross at the balance point","Both rise together","Both fall together","Heat loss falls while capacity rises"],answer:0,explain:`Building heat loss rises as it gets colder, because the temperature difference driving heat out of the building gets bigger.

Heat pump capacity falls, because the outdoor coil has less temperature difference to work with — there is still heat in cold air, but less of a gradient to pull it across.

Those two lines cross at the **balance point**, typically somewhere around 30–35°F for residential equipment. Below it, aux makes up the difference. Above it, aux operation is waste and worth investigating.`,source:c.todo("Confirm the balance point discussion against your text."),status:"draft"},al={...W,id:"hvac.9.5.heating-delta-t",objective:"9.5",kind:"choice",difficulty:3,prompt:"In heating mode, what should you expect from the air temperature rise across the indoor coil, compared with a gas furnace?",choices:["Much smaller — a heat pump delivers a large volume of moderately warm air rather than a small volume of hot air","Much larger, because heat pumps concentrate heat","About the same, since both are sized to the same load","It varies randomly and is not a useful measurement"],answer:0,explain:`A gas furnace might produce a 40–70°F rise, delivering genuinely hot air. A heat pump typically produces something like 15–25°F, so supply air arrives around 90–100°F.

That is below body temperature, which is why customers often report heat pump air feeling "cold" even when the system is working perfectly and the house is at setpoint. It is worth explaining before it becomes a complaint.

It also means you cannot judge a heat pump by furnace standards. Check the manufacturer literature for the expected rise at the given outdoor temperature.`,source:c.todo("Confirm heat pump temperature rise expectations against your text."),status:"draft"},il=[zc,Jc,Vc,Xc,Uc,Kc,Zc,Gc,_c,el,Qc,tl,Yc,al],M={track:"hvac",domain:"10.0"},ol={...M,id:"hvac.10.1.method-order",objective:"10.1",kind:"order",difficulty:2,prompt:"Put a systematic troubleshooting approach in order.",steps:["Talk to the customer — what is it doing, when did it start, what changed","Observe the system running and look before reaching for instruments","Form a theory about what would produce these symptoms","Take the measurements that would confirm or eliminate that theory","Confirm the root cause, not just the symptom","Repair, then verify the system operates correctly across a full cycle","Document the readings and what was done"],explain:`The two steps most often skipped are the first and the second to last.

The customer interview is free information: "it started after the storm", "it only does it in the afternoon", "someone was out last month" each narrow the field enormously before you touch anything.

Confirming the root cause rather than the symptom is what separates a repair from a callback. Replacing a contactor with burnt contacts fixes today; finding out the compressor is drawing locked-rotor current because its capacitor is weak fixes it properly.`,source:c.todo("Confirm against the troubleshooting chapter of your service text."),status:"draft"},sl={...M,id:"hvac.10.1.cheap-checks-first",objective:"10.1",kind:"choice",difficulty:2,prompt:"You arrive at a no-cooling call. What is the most efficient first move?",choices:["Look at the filter, the coil, the outdoor fan and the thermostat setting before connecting anything","Connect gauges immediately to see the pressures","Assume low charge and start a leak search","Replace the capacitor as a precaution"],answer:0,explain:`Visual checks cost seconds and settle a surprising share of calls outright. A filter you cannot see light through, a stationary outdoor fan, a thermostat in the wrong mode — none of these need a gauge, and all of them are common.

Connecting gauges is not free. It takes time, it releases a little refrigerant every time you connect and disconnect, and it can introduce air or contamination. Do it when you have a refrigerant-side question that needs answering, not as a reflex.

The general principle: order your checks by information gained per minute spent. That almost always puts your eyes first.`,source:c.todo("Confirm against your service text."),status:"draft"},nl={...M,id:"hvac.10.2.pressures-converging",objective:"10.2",kind:"choice",difficulty:3,prompt:`On a running system, suction pressure is unusually HIGH and head pressure is unusually LOW. Compressor amps are well below rated load.

What does this indicate?`,choices:["The compressor is not pumping — most likely internal valve failure","The system is overcharged","The condenser coil is dirty","The evaporator is starved of airflow"],whyWrong:{1:"An overcharge pushes head pressure UP and amps up, not down.",2:"A dirty condenser raises head pressure.",3:"Low airflow lowers suction pressure rather than raising it."},answer:0,explain:`Almost every fault pushes the two pressures further apart. A compressor that has stopped pumping is the one that brings them together: suction rises because nothing is drawing vapour away, head falls because nothing is being delivered.

Low amps confirm it. A compressor doing no work draws little current — this is the fault where the motor is running fine and the pump is not.

The wider lesson is that a single pressure means very little. Suction pressure alone is consistent with a dozen conditions; suction together with head, amps and superheat is often consistent with only one.`,source:c.todo("Confirm the compressor failure signature against your service text."),status:"draft"},rl={...M,id:"hvac.10.3.low-suction-two-causes",objective:"10.3",kind:"choice",difficulty:3,prompt:"Suction pressure is low. Which single additional measurement most efficiently separates a low charge from a low-airflow problem?",choices:["The air temperature drop across the evaporator coil","Outdoor ambient temperature","Compressor amps","Line voltage"],answer:0,explain:`Both faults drop suction pressure, so the gauge alone cannot separate them. The air side can, and it moves in opposite directions:

Low charge → less refrigerant to absorb heat → the air gives up less heat → temperature drop is LOW, often under 15°F.

Low airflow → the air that does get through spends longer against a colder coil → temperature drop is HIGH, often over 25°F.

One thermometer reading at the return and one at the supply settles it. This is the single highest-value cross-check in cooling diagnosis, and it costs about two minutes.`,source:c.todo("Confirm the airflow-versus-charge discussion against your service text."),status:"draft"},cl={...M,id:"hvac.10.3.delta-t-humidity",objective:"10.3",kind:"choice",difficulty:3,prompt:`A system in a humid climate shows a 16°F temperature drop across the coil. Charge and static pressure both check out.

How should you read that?`,choices:["Likely normal — high indoor humidity means more capacity goes to latent removal, which lowers the temperature drop","Definitely low airflow, since the target is always 20°F","Definitely low charge","The coil must be dirty"],answer:0,explain:`Temperature drop is not a fixed target. The band depends on the moisture in the entering air, because a coil doing latent work is spending capacity on condensing water rather than on lowering temperature.

Roughly: 16–18°F is expected at a high entering wet bulb, and 22–24°F at a low one. Quoting "20 degrees" as a universal target produces false diagnoses in both directions — chasing a non-existent airflow fault in Houston, and missing a real one in Phoenix.

Measure the entering wet bulb and judge the drop against it. That is why a psychrometer belongs in the bag alongside the thermometer.`,source:c.todo("Confirm the delta-T versus wet bulb relationship against your service text."),status:"draft"},ll={...M,id:"hvac.10.4.hums-and-trips",objective:"10.4",kind:"choice",difficulty:3,prompt:`A compressor hums for a few seconds, draws very high current, and then trips its overload. It has correct line voltage at the contactor.

What is the most likely cause?`,choices:["A failed run capacitor, or a mechanically seized compressor","Low refrigerant charge","A dirty air filter","A failed thermostat"],answer:0,explain:`Humming with very high current is locked rotor: the motor is energised and not turning. With good voltage at the terminals, the two candidates are that it cannot produce starting torque, or that it physically cannot turn.

Test the run capacitor first — it is cheap, quick, and by far the more common of the two. A capacitor that has drifted out of its ±6% tolerance robs the motor of starting torque without failing outright.

If the capacitor is good, a hard-start kit will tell you more: if it starts with one, the compressor is weak but alive. If it still will not turn, it is seized and needs replacing.

Neither charge nor airflow can cause this. Both affect how well a running compressor performs, not whether it can start.`,source:c.todo("Confirm the locked-rotor diagnosis against your service text."),status:"draft"},hl={...M,id:"hvac.10.4.contactor-chatter",objective:"10.4",kind:"choice",difficulty:3,prompt:"A contactor is chattering — pulling in and dropping out rapidly. What should you check?",choices:["The 24 V control voltage under load, and the transformer's capacity to hold it","The refrigerant charge","The evaporator coil for ice","The condensate drain"],answer:0,explain:`Chattering means the coil is repeatedly getting just enough voltage to pull in and then not enough to hold. The classic cause is control voltage sagging under load — an undersized or failing transformer, a poor connection adding resistance, or a shorted coil drawing more than the transformer can supply.

Measure the 24 V while it is trying to pull in, not at rest. A reading that looks fine with nothing energised and collapses under load is the whole diagnosis.

Chatter is destructive, not merely annoying: each bounce arcs across the contacts and burns them, so a control-circuit problem left alone becomes a contactor replacement as well.`,source:c.todo("Confirm the contactor chatter diagnosis against your service text."),status:"draft"},dl={...M,id:"hvac.10.5.why-document",objective:"10.5",kind:"choice",difficulty:1,prompt:"Why record the full set of readings on every call, including on a routine maintenance visit?",choices:["They become the baseline that makes the next visit's readings meaningful","Only for billing purposes","Because it is legally required in all jurisdictions","To make the invoice look more substantial"],answer:0,explain:`A single set of readings tells you whether the system is inside its acceptance bands. Two sets, a year apart, tell you which direction it is heading — and that is far more useful.

Subcooling that has drifted from 10°F to 6°F over a season is a leak you can catch before the customer loses cooling in August. Amps creeping up year over year is a compressor going. Neither is visible from one visit.

It also protects you. When somebody claims a system was fine before you touched it, a documented set of readings from the day you arrived is the answer.`,source:c.todo("Confirm against your service text."),status:"draft"},ul={...M,id:"hvac.10.5.verify-before-leaving",objective:"10.5",kind:"choice",difficulty:2,prompt:`You have replaced a failed run capacitor and the system is now running.

What should you do before leaving?`,choices:["Let it run to steady state, take a full set of readings, and confirm why the capacitor failed","Pack up as soon as the compressor starts — the fault is fixed","Add refrigerant as a precaution while the gauges are connected","Recommend a full system replacement"],answer:0,explain:`A system that starts is not the same as a system that is working. Readings taken in the first minute are still stabilising; give it ten to fifteen minutes and take a full set.

Then ask why the capacitor failed. Age is a legitimate answer. So is heat — a capacitor cooking next to a condenser running high head pressure will fail again in a year, and the high head pressure is the real fault. Replacing the symptom and leaving the cause is what produces callbacks.

Adding refrigerant "while you are there" to a system that did not need it is the single most common way a repair visit makes a system worse.`,source:c.todo("Confirm against your service text."),status:"draft"},pl={...M,id:"hvac.10.2.superheat-alone-ambiguous",objective:"10.2",kind:"choice",difficulty:3,prompt:`Superheat measures 28°F on a system that should be running 10°F.

What can you conclude from that reading alone?`,choices:["Only that the evaporator is starving — subcooling is needed to say why","The system is undercharged","There is a restriction in the liquid line","The metering device has failed"],answer:0,explain:`High superheat says the coil ran out of liquid early. It does **not** say why.

An undercharge starves the coil because there is not enough refrigerant in the system. A restriction starves it because refrigerant cannot get through. Both give high superheat.

Subcooling separates them:
**LOW subcooling** → not enough refrigerant anywhere → undercharge.
**HIGH subcooling** → refrigerant backing up behind a blockage → restriction.

Acting on superheat alone is how a technician adds refrigerant to a restricted system, making it worse and leaving it overcharged once the restriction is finally found.`,source:c.todo("Confirm the superheat/subcooling pairing against your service text."),status:"draft"},ml={...M,id:"hvac.10.2.high-split-clean-coil",objective:"10.2",kind:"choice",difficulty:3,prompt:`Condenser split is 38°F on a standard-efficiency unit. The coil is clean, the fan runs well, and there is nothing blocking airflow. The system was repaired six weeks ago.

What fits?`,choices:["Non-condensables — air left in the system because it was not properly evacuated","A dirty condenser coil that you have missed","An undercharge","Low indoor airflow"],answer:0,explain:`The **contradiction** is the diagnosis. A high split says heat is not leaving the condenser, but a clean coil with a working fan says there is no physical reason for that.

Air trapped in the system occupies condenser volume and adds its own partial pressure on top of the refrigerant's. Head pressure reads higher than the refrigerant temperature alone accounts for.

That it followed a repair points straight at evacuation. Air does not come out on its own — only a deep vacuum removes it, which is why 500 microns and a decay test exist.

There is no way to bleed it out selectively. Recover, evacuate properly, weigh in a fresh charge.`,source:c.todo("Confirm the non-condensable diagnosis against your service text."),status:"draft"},fl={...M,id:"hvac.10.3.high-delta-t-meaning",objective:"10.3",kind:"choice",difficulty:2,prompt:`Return air is 76°F, supply air is 48°F — a 28°F drop, well above the expected range.

What does that point to?`,choices:["Low airflow — less air passing over the coil spends longer against it and drops further","An overcharge","A dirty condenser coil","The system is working better than expected"],answer:0,whyWrong:{1:"An overcharge reduces capacity and gives a LOWER drop.",2:"A dirty condenser affects the high side and gives a lower drop, not a higher one.",3:"A large drop with low total airflow means less total heat moved, not more."},explain:`It is tempting to read a big temperature drop as good performance. It is not — it means very little air is getting through.

Capacity is CFM × ΔT. Halve the airflow and the drop rises, but the product falls: less total heat is being moved and the house does not cool.

A 28°F drop is also close to freezing the coil, which is where this ends if it is left. Check the filter, the blower wheel, the coil face and duct static pressure.`,source:c.todo("Confirm the delta-T interpretation against your service text."),status:"draft"},gl={...M,id:"hvac.10.3.order-of-checks",objective:"10.3",kind:"order",difficulty:2,prompt:"Suction pressure is low. Put these checks in the order that gets you an answer fastest.",steps:["Look at the filter and the coil face — free, and airflow is the most common cause","Measure return and supply air temperature to get the delta-T","Judge the delta-T against the entering wet bulb to separate airflow from charge","If it points at the refrigerant side, measure liquid line temperature for subcooling","Use superheat and subcooling together to separate an undercharge from a restriction"],explain:`Order the checks by information gained per minute spent. Visual first, air side second, refrigerant side last.

A loaded filter settles it in ten seconds. A delta-T reading takes two minutes and eliminates half the possibilities. Only then is it worth doing the refrigerant-side arithmetic.

Reaching for the gauges first is the habit worth breaking — it is slower, it costs a little refrigerant every time, and it answers a question you may not need to ask.`,source:c.todo("Confirm the diagnostic sequence against your service text."),status:"draft"},wl={...M,id:"hvac.10.4.nothing-happens",objective:"10.4",kind:"choice",difficulty:2,prompt:`The thermostat calls for cooling. The indoor blower runs but the outdoor unit is completely silent — no hum, no fan.

Where do you start?`,choices:["Check for 24 V at the contactor coil, which tells you whether the fault is in the control circuit or the load side","Connect gauges to check the refrigerant charge","Replace the run capacitor","Check the compressor windings"],answer:0,explain:`Complete silence means the contactor is not pulling in, or it is pulling in and there is no power beyond it. One measurement splits the problem in half.

**24 V present at the coil but the contactor is not closing** → the contactor itself, or its coil, has failed.

**No 24 V at the coil** → work back up the control circuit: thermostat, safety switches, transformer, control fuse.

A humming compressor would be a different fault entirely — that is a locked rotor, and the capacitor becomes the first suspect. Silence and humming point in opposite directions.`,source:c.todo("Confirm the no-operation diagnostic sequence against your service text."),status:"draft"},yl={...M,id:"hvac.10.4.breaker-trips-immediately",objective:"10.4",kind:"choice",difficulty:3,prompt:`A breaker trips the instant the outdoor unit is energised, before the compressor even attempts to start.

What does the timing tell you?`,choices:["A direct short or a grounded winding — an overload from a hard start would take seconds, not instants","A weak run capacitor","An overcharge raising the amp draw","A dirty condenser coil"],answer:0,explain:`Timing is the diagnostic here.

**Instant trip** → a short circuit or a ground fault. Current is not limited by anything, so the magnetic trip acts immediately. Check terminal-to-shell continuity on the compressor and look for damaged wiring.

**Trips after several seconds** → an overload condition. The thermal element takes time to respond. That is a locked rotor, a weak capacitor, or genuinely excessive running current.
