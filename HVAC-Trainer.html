High superheat + LOW subcooling = undercharge.
High superheat + HIGH subcooling = restriction.

That one contrast is worth more than any other pair of numbers on this list. A local temperature drop at the restriction — a filter drier noticeably colder than the line either side of it, sometimes sweating or frosted — pins the location.`,keyMeasurements:["suction-pressure","suction-line-temp","liquid-pressure","liquid-line-temp"],confusedWith:["undercharge","low-evaporator-airflow"],repair:"Replace the restricted component — usually the drier or the metering device."},{id:"dirty-condenser",name:"Dirty condenser coil",complaints:["Not keeping up on the hottest days. Fine in the morning.","Outdoor unit is running hot and loud."],signature:"HIGH head, high condenser split, high amps. Superheat normal.",explain:`The condenser cannot reject heat, so it condenses at a higher temperature to force the heat out — head pressure climbs. The metering device still controls flow into the evaporator, so superheat stays roughly normal, which is what separates this from a charge problem.

The number that names it is the condenser split — condensing temperature minus outdoor ambient. A standard-efficiency unit should run 20–30°F, a high-efficiency unit 15–20°F. A split well above that means heat is not getting out: dirty coil, failed fan, blocked airflow, or recirculation from something built too close to the unit.`,keyMeasurements:["liquid-pressure","ambient-temp","condenser-inspect","compressor-amps"],confusedWith:["overcharge","non-condensables","condenser-fan-failed"],repair:"Wash the coil from the inside out. Clear obstructions and check fan operation."},{id:"condenser-fan-failed",name:"Condenser fan not running",complaints:["It runs for a few minutes then shuts off, over and over.","The outdoor fan is not spinning but the unit is humming."],signature:"Very high head, extreme condenser split, high-pressure lockout.",explain:`With no air across the condenser there is almost no heat rejection, so head pressure climbs fast until the high-pressure switch opens. The short-cycling pattern — runs a few minutes, trips, restarts once pressure equalises — is characteristic.

This is the extreme case of the dirty-condenser signature. Look before you measure: a stationary fan blade answers the question in two seconds. Usual causes are a failed run capacitor, a seized bearing, or an open motor winding.`,keyMeasurements:["condenser-inspect","liquid-pressure","ambient-temp"],confusedWith:["dirty-condenser","overcharge"],repair:"Test the run capacitor and motor. Replace the failed component."},{id:"low-evaporator-airflow",name:"Low evaporator airflow",complaints:["Weak airflow from the vents and the coil keeps icing up.","One end of the house never cools."],signature:"Low suction, HIGH air temperature drop across the coil.",explain:`Less air over the coil means less heat arriving to boil the refrigerant, so the coil runs colder and suction pressure falls — which on the gauges alone looks like a low charge. The air side is what gives it away: the air that does pass through spends longer in contact with a colder coil, so the temperature DROP goes UP, often past 25°F.

Low suction with a high delta-T is airflow. Low suction with a low delta-T is charge or a restriction. Once the coil goes below freezing it ices, which blocks it further — a runaway that ends with a solid block of ice and no airflow at all.

Check the filter first. It is free, it takes ten seconds, and it is the cause more often than everything else on this list combined.`,keyMeasurements:["filter-inspect","return-air-db","supply-air-db","static-pressure"],confusedWith:["undercharge","restricted-metering"],repair:"Replace the filter, clean the blower wheel and coil, and check duct static pressure."},{id:"compressor-inefficient",name:"Inefficient compressor (valve failure)",complaints:["It runs all day and barely cools at all.","Unit sounds like it is running but nothing is happening."],signature:"HIGH suction, LOW head, LOW amps — the compressor is not pumping.",explain:`A compressor with failed valves recirculates gas internally instead of moving it. The pressures drift toward each other: suction rises because gas is not being pulled away, head falls because gas is not being delivered. Amps drop well below RLA, because doing no work costs no current.

A cup of boiling water is at 212°F. A bathtub of 100°F water is barely warm. But the bathtub contains vastly more heat, because heat depends on mass as well as temperature. Pour the cup into the tub and the tub gets slightly warmer — you moved a lot of temperature and very little heat.

Your thermostat reads temperature. Your equipment moves heat. When a customer says "it gets to 72 but the house still feels wrong", they are telling you something about heat and moisture that the temperature reading cannot express.`},{kind:"keyNumbers",heading:"Commit these to memory",items:[{label:"One BTU",value:"1 lb of water, 1°F",note:"The definition of the unit"},{label:"One ton of cooling",value:"12,000 BTU/h",note:"2,000 lb ice ÷ 24 h"},{label:"Specific heat of water",value:"1.0 BTU/lb·°F",note:"Everything else is measured against this"},{label:"Specific heat of air",value:"0.24 BTU/lb·°F",note:"Air holds far less heat than water"},{label:"Latent heat of fusion",value:"144 BTU/lb",note:"Ice → water"},{label:"Latent heat of vaporisation",value:"≈970 BTU/lb",note:"Water → steam"}]},{kind:"prose",heading:"Sensible versus latent",body:`Sensible heat changes temperature. You can feel it, and a thermometer reads it.

Latent heat changes *state* with no temperature change at all. Put a pan of 33°F ice-water on a burner and it sits at 32°F until every last piece of ice has melted — the burner is pouring energy in the whole time, and none of it raises the temperature. All 144 BTU per pound go into breaking the bonds that make it a solid.

Compare the two numbers above and the significance jumps out. Raising a pound of water from 32°F to 212°F — the entire liquid range — takes 180 BTU. Boiling that same pound takes another 970. A change of state moves five times more energy than heating the liquid across its whole range.

That is why refrigeration works by boiling something. A system that merely warmed a fluid up would need an absurd amount of it. Boiling a refrigerant moves enormous heat through a small pipe, which is the entire trick.`},{kind:"callout",tone:"trap",heading:'There is no such thing as "adding cold"',body:`Cold is the absence of heat, not a substance. An air conditioner does not send cold into a house — it removes heat from the house and dumps it outside.

This sounds pedantic until you are troubleshooting. Framing it correctly makes you ask "where is the heat going, and what is stopping it?" rather than "why is no cold coming out?" The first question has an answer you can measure.`},{kind:"worked",heading:"Worked example: how much heat to cool a room?",problem:`You need to drop 1,000 lb of air from 78°F to 58°F, and it is dry enough that no moisture condenses.

How much heat must you remove?`,steps:[{action:"Identify what kind of heat this is. The temperature changes and there is no change of state.",result:"Sensible heat only — no latent component."},{action:"Find the temperature change.",result:"78 − 58 = 20°F"},{action:"Use Q = mass × specific heat × ΔT, with air at 0.24 BTU/lb·°F.",result:"Q = 1,000 × 0.24 × 20"}],answer:"4,800 BTU",moral:"Notice how little that is — a third of a ton-hour to cool half a ton of air by 20 degrees. Air carries very little heat, which is why systems must move so much of it. That is the physical reason 400 CFM per ton exists as a design number."},{kind:"prose",heading:"Heat only moves one way",body:`Heat always flows from warmer to cooler, never the other way on its own. Every piece of equipment you will ever work on is an arrangement for exploiting that.

It moves three ways. **Conduction** is direct contact — heat through the copper wall of a tube. **Convection** is a fluid carrying it — a blower moving warm air across a coil. **Radiation** is electromagnetic — the sun loading a roof.

A coil is fundamentally a conduction device with convection on both sides: air to metal, metal to refrigerant. That is why fins exist, and why a dirty coil hurts so much — dirt is an insulator sitting exactly where conduction needs to happen.`}],source:c.standard("Standard thermodynamics; BTU and ton definitions are derivations"),status:"verified"},to={id:"hvac.lesson.1.pressure",track:"hvac",domain:"1.0",order:2,title:"Pressure, vacuum, and staying alive",summary:"Gauge versus absolute, why evacuation is measured in microns, and the hazards that actually hurt people in this trade.",minutes:7,sections:[{kind:"prose",body:`Your manifold gauges read **gauge pressure** — psig — which measures relative to the air around you. At sea level, 0 psig means "same as the atmosphere", which is 14.7 psi of actual pressure.

**Absolute pressure** — psia — measures from a true vacuum. So psia = psig + 14.7.

For everyday charging and diagnosis, gauge pressure is what you want and the distinction never comes up. It matters enormously in one place: evacuation.`},{kind:"keyNumbers",heading:"Pressure reference",items:[{label:"Atmospheric at sea level",value:"14.7 psia",note:"= 0 psig"},{label:"Also written as",value:"29.92 in. Hg",note:"Inches of mercury"},{label:"Evacuation target",value:"500 microns",note:"Absolute scale"},{label:"Atmosphere in microns",value:"760,000",note:"Shows how deep 500 really is"},{label:"Moisture still boiling",value:"1,500–2,000",note:"Where a wet system plateaus"}]},{kind:"prose",heading:"Why a gauge cannot measure a vacuum",body:`Look at the numbers above. Atmospheric pressure is 760,000 microns. Your target is 500. The entire useful range of evacuation sits inside the last needle-width before 0 psig on a compound gauge.

A gauge simply cannot resolve it. "The needle is pegged at 29.9 inches" is compatible with a beautifully dry system and with one full of water. That is why a micron gauge is not optional equipment — it is the only instrument that can see the range that matters.`},{kind:"worked",heading:"Worked example: reading a decay test",problem:`You pull a system to 480 microns, valve off the pump, and watch. Over ten minutes the reading climbs to 1,800 microns and then holds steady there.

What does that tell you?`,steps:[{action:"Ask first whether it rose at all. A truly dry, tight system holds near where you left it.",result:"It rose, so something is going on."},{action:"Ask whether the rise levelled off or kept climbing. This is the diagnostic split.",result:"It plateaued at 1,800 and stopped."},{action:"A plateau means a finite source that reaches equilibrium — moisture boiling off. A leak would keep pulling toward atmosphere without ever settling.",result:"Finite source: water in the system."}],answer:"Moisture, not a leak. Keep pumping — and consider gentle heat, since the moisture will not boil if the system is colder than the boiling point at that vacuum.",moral:"The decay test is the whole point of evacuation. Reaching 500 microns proves nothing on its own; *holding* 500 with the pump valved off is the actual test. Evacuating by the clock is how water gets sealed into systems."},{kind:"callout",tone:"tip",heading:"Vacuum does not suck water out",body:`It lowers the boiling point until the water boils at room temperature, and then the pump removes the vapour. Water boils at 212°F at atmospheric pressure and at roughly room temperature around 500 microns.

This is why a cold system evacuates so slowly, and why warming it gently does more than a bigger pump. If the ambient is below the boiling point at that vacuum, the moisture simply will not vaporise no matter how long you wait.`},{kind:"callout",tone:"warning",heading:"The hazards that actually hurt people",body:`**Liquid refrigerant on skin** boils instantly and causes frostbite. Gloves and eye protection, every time you connect or disconnect.

**Vapour displaces oxygen.** Refrigerant is heavier than air and pools in basements, crawl spaces and pits. There is no smell to warn you. People have died in mechanical rooms this way.

**Never braze on a system with refrigerant in it.** Halogenated refrigerants passing through a flame break down into hydrogen fluoride and other acids.

**Never put oxygen in a refrigeration system.** Oxygen under pressure in contact with oil combusts violently. Use dry nitrogen with a regulator.

**Capacitors hold a charge** long after the disconnect opens. Discharge through a resistor before touching one.`},{kind:"prose",heading:"Live–dead–live",body:`Before working on anything electrical: test your meter on a known live source, test the circuit, then test your meter on the known live source again.

The second live test is the one people skip and the one that matters. A meter with a blown fuse, a flat battery or a broken lead reads zero volts on everything — including a circuit that is fully energised. Without that final check, "the meter read zero" and "the circuit is dead" are not the same statement.`}],source:c.standard("OSHA 29 CFR 1910.147; NFPA 70E; pressure–temperature relationship for water"),status:"verified"},ao=[eo,to],io={caption:"Follow the refrigerant: pressure rises only at the compressor, falls only at the metering device",nodes:[{id:"comp",kind:"compressor",label:"Compressor",sublabel:"LOW → HIGH",col:0,row:1},{id:"cond",kind:"condenser",label:"Condenser",sublabel:"vapour → liquid",col:1,row:0},{id:"meter",kind:"metering",label:"Metering",sublabel:"HIGH → LOW",col:2,row:1},{id:"evap",kind:"evaporator",label:"Evaporator",sublabel:"liquid → vapour",col:1,row:2}],links:[{from:"comp",to:"cond",label:"hot gas"},{from:"cond",to:"meter",label:"warm liquid"},{from:"meter",to:"evap",label:"cold mix"},{from:"evap",to:"comp",label:"cool vapour"}]},oo={id:"hvac.lesson.2.cycle",track:"hvac",domain:"2.0",order:1,title:"The cycle: four parts, two pressures, two states",summary:"Everything in the trade hangs off this loop. It is simpler than it looks.",minutes:7,sections:[{kind:"prose",body:`A refrigeration system is a loop with four components. Two of them change **pressure**, two of them change **state**, and they alternate around the loop.

The whole purpose is to make a fluid boil somewhere cold, so it absorbs heat, and then condense somewhere hot, so it rejects that heat. Since heat only flows from warm to cool, the refrigerant has to be colder than the house when it absorbs and hotter than the outdoors when it rejects. Manipulating pressure is how you arrange that.`},{kind:"diagram",topology:io},{kind:"table",heading:"What each component does",columns:["Component","Changes","In","Out"],rows:[["Compressor","Pressure ↑","Cool low-pressure vapour","Hot high-pressure vapour"],["Condenser","State","Hot high-pressure vapour","Warm high-pressure liquid"],["Metering device","Pressure ↓","Warm high-pressure liquid","Cold low-pressure mixture"],["Evaporator","State","Cold low-pressure mixture","Cool low-pressure vapour"]],note:"Everything between the compressor discharge and the metering device is the high side. Everything between the metering device and the compressor suction is the low side."},{kind:"prose",heading:"Why the pressure drop is the clever part",body:`Ask why the metering device exists and the answer explains the whole machine.

At high side pressure, R-410A boils at 110°F or more. Useless — you cannot absorb heat from a 75°F room with something at 110°F. Drop the pressure to around 118 psig and the same refrigerant boils at about 40°F. Now it is comfortably colder than the room, so heat flows into it, and it boils.

The metering device does nothing but create that pressure drop. The compressor then has to push the pressure back up so the refrigerant will condense at a temperature above the outdoor air. That is what the electricity buys you.`},{kind:"callout",tone:"warning",heading:"The compressor is a vapour pump",body:`Vapour compresses. Liquid does not. A slug of liquid in the cylinder has nowhere to go, and something mechanical gives — valves, a connecting rod, or the head.

The slower version is just as fatal: liquid dilutes the oil, washing the film off bearing surfaces until they fail.

This is why superheat exists as a measurement. Any superheat at all proves the refrigerant left the evaporator fully vaporised.`}],source:c.standard("Standard vapour-compression refrigeration cycle"),status:"verified"},so={id:"hvac.lesson.2.superheat",track:"hvac",domain:"2.0",order:2,title:"Superheat and subcooling: seeing inside a sealed system",summary:"Two numbers, four readings, and suddenly you can tell what is happening inside a pipe you cannot open.",minutes:9,sections:[{kind:"prose",body:`You cannot see into a sealed system. Superheat and subcooling are how you find out what is going on anyway, and nearly all refrigerant-side diagnosis is built on them.

Both work the same way: compare a **measured temperature** against the **saturation temperature** the pressure says it should be. The gap between them is the information.`},{kind:"prose",heading:"First, what saturation means",body:`While a refrigerant is boiling or condensing, its pressure and temperature are locked together. Know one and a P-T chart gives you the other. That is what saturation is — liquid and vapour coexisting in equilibrium.

But once the last drop of liquid has boiled away, that lock breaks. Adding more heat now raises the temperature with no change in pressure. The refrigerant has become a superheated vapour, and a pressure reading no longer tells you its temperature.

The same happens on the other side. Once all the vapour has condensed, further cooling drops the temperature at constant pressure. That is subcooled liquid.

So a P-T chart only works inside the evaporator and condenser. Superheat and subcooling measure exactly how far reality has departed from the chart.`},{kind:"keyNumbers",heading:"The two formulas — note they subtract in opposite directions",items:[{label:"Superheat",value:"suction line temp − sat temp",note:"Low side. Positive because vapour is heated ABOVE saturation"},{label:"Subcooling",value:"sat temp − liquid line temp",note:"High side. Positive because liquid is cooled BELOW saturation"},{label:"TXV superheat target",value:"8–12°F",note:"The valve holds this"},{label:"Subcooling target",value:"8–12°F",note:"Check the nameplate"},{label:"Fixed orifice superheat",value:"From the chart",note:"Varies with conditions"}]},{kind:"worked",heading:"Worked example: calculate both",problem:`An R-410A system with a TXV:
  Low side 118 psig, suction line 52°F
  High side 317 psig, liquid line 88°F

Find superheat and subcooling, and say whether the system looks right.`,steps:[{action:"Convert the low side pressure to saturation temperature on the R-410A scale.",result:"118 psig → about 40°F"},{action:"Superheat = suction line − saturation.",result:"52 − 40 = 12°F"},{action:"Convert the high side pressure to condensing temperature.",result:"317 psig → about 100°F"},{action:"Subcooling = condensing − liquid line. Note this subtraction runs the other way.",result:"100 − 88 = 12°F"},{action:"Compare both against the target bands.",result:"Superheat 12°F is at the top of 8–12. Subcooling 12°F likewise."}],answer:"Superheat 12°F, subcooling 12°F — both within band. The system is correctly charged.",moral:"If you get a negative number, you subtracted the wrong way round. Superheat counts UP from saturation; subcooling counts DOWN from it."},{kind:"prose",heading:"What each one is actually telling you",body:`**Superheat measures how much of the evaporator is doing useful work.**

Refrigerant enters the coil as a cold liquid–vapour mixture and boils along its length. The point where the last liquid disappears matters. If that happens right at the outlet, the whole coil was working — good. If it happens two thirds of the way along, the last third is just heating vapour, which is nearly useless, and superheat is high. If it never happens at all, liquid is leaving the coil toward the compressor, and superheat is near zero.

**Subcooling measures how much liquid is stacked in the condenser.**

It is the charge indicator, because extra refrigerant has nowhere to go but the condenser. More charge, more stacked liquid, more subcooling.`},{kind:"callout",tone:"trap",heading:"Superheat cannot tell you the charge on a TXV system",body:`A TXV exists to hold superheat constant. Add refrigerant and it throttles back; remove some and it opens further. Superheat stays near 10°F either way, until the valve runs out of authority entirely.

So on a TXV system, **charge by subcooling.** On a fixed orifice — which has no way to respond to anything — **charge by superheat**, using the manufacturer's chart with indoor wet bulb and outdoor dry bulb.

Using the wrong method for the metering device is one of the most common ways a system ends up badly charged by somebody who was measuring carefully.`},{kind:"table",heading:"Reading the two together — the table worth memorising",columns:["Superheat","Subcooling","What it means","Why"],rows:[["HIGH","LOW","Undercharge or leak","Not enough refrigerant anywhere"],["HIGH","HIGH","Restriction","Coil starves while refrigerant backs up behind the blockage"],["LOW","HIGH","Overcharge","Excess floods the condenser and overfeeds the coil"],["LOW","LOW","Metering device overfeeding","Valve passing too much without extra charge"]],note:"This is the single most useful table in refrigerant diagnosis. Superheat ALONE cannot separate an undercharge from a restriction — both starve the coil. Subcooling is what tells them apart."},{kind:"prose",heading:"And the third number: condenser split",body:`Condensing temperature minus outdoor ambient. It tells you whether the condenser is actually rejecting heat, and it already accounts for how hot it is outside — which head pressure alone does not.

Standard efficiency runs 20–30°F. High efficiency, with its larger coil, runs 15–20°F. A split well above the range means heat is not getting out: dirty coil, failed fan, recirculating air, or non-condensables in the system.

A head pressure of 400 psig sounds alarming until you notice it is 105°F outside, at which point the split is normal and the system is fine.`}],source:c.standard("Saturation properties; superheat and subcooling are standard refrigeration practice"),status:"verified"},no=[oo,so],ro={id:"hvac.lesson.3.refrigerants",track:"hvac",domain:"3.0",order:1,title:"What is actually in the system",summary:"Families, blends, oils, and why moisture is the enemy that quietly kills compressors.",minutes:7,sections:[{kind:"prose",body:`Refrigerant families are defined by what is in the molecule, and the history of the trade is largely a history of taking things out of it.

**Chlorine** destroys ozone. CFCs like R-12 had the most and went first. HCFCs like R-22 had less and were phased out of new equipment by 2010, with virgin production ending in 2020. HFCs like R-410A and R-134a have none at all.

The current pressure is different: HFCs have high **global warming potential**, so the move now is toward lower-GWP alternatives and HFO blends. Same pattern, different environmental concern.`},{kind:"table",heading:"The ones you will meet",columns:["Refrigerant","Family","Oil","Where"],rows:[["R-22","HCFC","Mineral","Legacy residential and light commercial"],["R-410A","HFC blend","POE","Most residential equipment since the 2000s"],["R-134a","HFC","POE","Chillers, automotive, commercial refrigeration"],["R-404A","HFC blend","POE","Low/medium-temp commercial refrigeration"],["R-717","Ammonia","Mineral","Large industrial plant"]],note:"R-410A runs at roughly 60% higher pressure than R-22. It needs its own gauges, and the two are not interchangeable in any sense."},{kind:"callout",tone:"trap",heading:"Charge a blend as a LIQUID",body:`R-410A and R-404A are blends of components with different boiling points. Draw vapour off the top of the cylinder and the more volatile component leaves preferentially — so what goes into the system is no longer the blend on the label, and what stays in the cylinder is not either.

Charge liquid, metered slowly into the suction line through a restrictor, or into the high side with the system off.

Same logic: a leaking blend system should be recovered and recharged, not topped up. What leaked out may not have matched the label.`},{kind:"prose",heading:"POE oil and the moisture problem",body:`HFC systems use POE (polyolester) oil, because mineral oil will not return through the system with them. POE has one property that shapes how you work: it is strongly **hygroscopic**. It pulls water out of the air fast, and it does not give it back easily.

Water plus POE produces acid. Acid attacks motor windings and eventually takes out the compressor — months later, so the connection to the sloppy repair that caused it is usually never made.

The practical rules follow directly: cap lines immediately, keep POE containers sealed, purge with nitrogen while brazing, and evacuate to 500 microns with a decay test rather than by the clock.`},{kind:"callout",tone:"warning",heading:"Nitrogen while brazing, always",body:`Heating copper with air inside produces black flaky oxide scale on the inner wall. It breaks loose once the system runs, travels with the refrigerant, and plugs metering devices and driers.

A gentle nitrogen flow — a few CFH, enough to displace air, not enough to blow the molten braze out — leaves the joint bright inside. You get one chance; scale cannot be cleaned out afterwards.`}],source:c.todo("Confirm the refrigerant families and oil compatibility against your text."),status:"draft"},co={id:"hvac.lesson.3.epa",track:"hvac",domain:"3.0",order:2,title:"EPA 608: the rules that are actually law",summary:"Certification types, the three Rs, cylinder handling, and the venting prohibition. This is regulation, not opinion.",minutes:6,sections:[{kind:"prose",body:`Section 608 of the Clean Air Act governs how refrigerant is handled. The rules live in 40 CFR Part 82, Subpart F, which is free to read online and is what the certification exam is drawn from.

The core prohibition is simple: **knowingly venting refrigerant during maintenance, service, repair or disposal is illegal.** It applies to HFCs as well as the older ozone-depleting refrigerants.`},{kind:"table",heading:"Certification types",columns:["Type","Covers","Typical equipment"],rows:[["Core","Prerequisite for all — science, regs, safety","Certifies you for nothing alone"],["Type I","Small appliances, factory-charged with ≤5 lb","Domestic fridges, window units"],["Type II","High and very high pressure","Most residential and light commercial"],["Type III","Low pressure","Centrifugal chillers"],["Universal","All three type sections","Everything"]],note:"Certification does not expire. Refrigerant sales are restricted to certified technicians."},{kind:"keyNumbers",heading:"Numbers the exam asks for",items:[{label:"Recovery cylinder fill limit",value:"80% by weight",note:"Leaves vapour space for expansion"},{label:"Evacuation target",value:"500 microns",note:"With a decay test"},{label:"Type I threshold",value:"5 lb",note:"Factory-charged small appliances"},{label:"Reclaim standard",value:"ARI-700",note:"Virgin specification, verified by analysis"}]},{kind:"prose",heading:"Recover, recycle, reclaim",body:`These three are a ladder of how thoroughly refrigerant is cleaned, and the distinction has legal weight.

**Recover** — remove it from the system into a container. No processing.

**Recycle** — clean it in the field: oil separation and filter-drying.

**Reclaim** — reprocess to virgin specification and verify by chemical analysis at a licensed facility.

Recovered refrigerant may go back into the same system, or one owned by the same person. Refrigerant sold to a **different owner** must be reclaimed. Field recycling is not enough for that.`},{kind:"callout",tone:"warning",heading:"Why 80% on a cylinder",body:`Liquids are nearly incompressible. A cylinder filled solid with liquid that then warms in a hot van has no vapour space to absorb the expansion, and hydrostatic pressure rises catastrophically — far past the relief setting, fast.

Fill **by weight on a scale.** A pressure gauge cannot tell you how full a cylinder is, because pressure only reflects temperature while any liquid remains.

Never refill a disposable cylinder. Never mix refrigerants in a recovery cylinder — a mixed cylinder cannot be reclaimed and becomes disposal.`}],source:c.standard("40 CFR Part 82, Subpart F — §82.154, §82.156, §82.161, §82.164"),status:"verified"},lo=[ro,co],ho={id:"hvac.lesson.4.metering",track:"hvac",domain:"4.0",order:1,title:"Metering devices, and why the type decides how you charge",summary:"Fixed orifice, TXV, EEV. The difference is whether the device can respond to load — and that single fact determines your charging method.",minutes:7,sections:[{kind:"prose",body:"Every metering device does the same job: drop the pressure so the refrigerant can boil cold. What separates them is whether they can **respond** when conditions change."},{kind:"table",heading:"The three you will meet",columns:["Device","How it meters","Responds to load?","Charge by"],rows:[["Fixed orifice / piston","A hole of a fixed size","No","Superheat, from the chart"],["Capillary tube","A long small-bore tube","No","Superheat, from the chart"],["TXV","Modulates on sensed superheat","Yes","Subcooling"],["EEV","Electronically controlled","Yes, fastest","Subcooling / manufacturer spec"]]},{kind:"prose",heading:"How a TXV actually works",body:`Three forces act on the valve diaphragm.

The **sensing bulb**, clamped to the suction line, is the opening force. As the line warms, the charge inside the bulb expands and pushes the valve open to feed more refrigerant.

**Evaporator pressure** and the adjustable **superheat spring** both push closed.

The valve settles wherever these balance, which is what holds superheat roughly constant across a wide range of conditions.

That also explains the classic failure. A bulb that has come loose senses room air instead of the pipe, reads that as "far too warm", and holds the valve wide open — flooding the evaporator and driving superheat toward zero.`},{kind:"callout",tone:"tip",heading:"Bulb mounting is not a detail",body:`Clean contact with the pipe, a proper clamp, insulation over the top of it, and on a horizontal line at the **10 or 2 o'clock** position.

Not the bottom — oil pools there and the bulb would sense the oil rather than the refrigerant. Not the top on larger lines, where vapour stratifies. A sloppily mounted bulb produces a system that hunts and never settles, and it is a genuinely common cause of "the TXV is bad" diagnoses on valves that are perfectly fine.`}],source:c.todo("Confirm the metering device comparison and TXV force balance against your text."),status:"draft"},uo={id:"hvac.lesson.4.charging",track:"hvac",domain:"4.0",order:2,title:"Putting the right amount in",summary:"Three methods, when each applies, and how to read the result.",minutes:8,sections:[{kind:"prose",body:`There are three ways to charge a system, and they are not equally good. In order of accuracy:

**Weigh it in.** Recover, evacuate, and weigh in the nameplate charge adjusted for line set length. This is the most accurate method available and the right answer after any repair where the system was opened. Superheat and subcooling then *confirm* the result rather than establishing it.

**Subcooling**, for a TXV system.

**Superheat**, for a fixed orifice, from the manufacturer's chart.`},{kind:"worked",heading:"Worked example: weighing in with a long line set",problem:`A condenser nameplate reads:
  "Factory charge 8 lb 4 oz, for 15 ft of line set.
   Add 0.6 oz per foot over 15 ft."

The installed line set is 40 ft. What total charge do you weigh in?`,steps:[{action:"Find how much line is beyond what the factory charge covers.",result:"40 − 15 = 25 ft of extra line"},{action:"Multiply by the per-foot adjustment.",result:"25 × 0.6 = 15 oz"},{action:"Add to the factory charge.",result:"8 lb 4 oz + 15 oz = 8 lb 19 oz"},{action:"Convert to pounds and ounces properly — 16 oz to the pound.",result:"19 oz = 1 lb 3 oz, so 8 lb + 1 lb 3 oz"}],answer:"9 lb 3 oz",moral:"The line-set adjustment is not optional on a long run. A 40 ft line set holds meaningfully more refrigerant than a 15 ft one, and charging to the bare nameplate figure leaves the system undercharged — which you would then chase as a leak."},{kind:"prose",heading:"Charging a fixed orifice by superheat",body:`A fixed orifice cannot respond to anything, so superheat is the only reading that tells you about the charge. The manufacturer's chart gives you a target from two measurements:

**Indoor wet bulb** at the return, and **outdoor dry bulb**.

Indoor WET bulb specifically, not dry bulb. The coil's job includes removing moisture, and wet bulb captures the total heat content of the entering air. Using dry bulb gives the wrong target, often badly.

Target superheat rises as the indoor load rises and falls as it gets hotter outside. Then you add or remove refrigerant until measured superheat matches the target.`},{kind:"table",heading:"Reading the result",columns:["Superheat","Subcooling","Diagnosis","Action"],rows:[["HIGH","LOW","Undercharge","Find the leak first, then weigh in"],["HIGH","HIGH","Restriction","Do NOT add refrigerant — find the blockage"],["LOW","HIGH","Overcharge","Recover to correct subcooling"],["LOW","LOW","Overfeeding valve","Check the TXV bulb mounting"]]},{kind:"callout",tone:"trap",heading:"Refrigerant is not consumed",body:`It runs in a sealed loop. If a system is low, it **leaked**, and adding more without finding the leak means being back next season with the customer paying twice.

The opposite mistake is just as common: topping up a correctly charged system because "the suction pressure looked a bit low". Suction pressure varies with indoor load, airflow and ambient. Adding refrigerant on one gauge reading, without superheat and subcooling, is how good systems end up overcharged and damaged.`},{kind:"callout",tone:"warning",heading:"What an overcharge actually does",body:`Excess refrigerant floods the lower condenser rows, reducing the surface available for condensing. Head pressure rises, compression ratio rises, amps rise, and capacity **falls** — the opposite of the intent.

Push it far enough and liquid reaches the compressor. Residential split systems have no relief valve to vent the excess for you.`}],source:c.todo("Confirm the charging procedures against your text and a manufacturer charging chart."),status:"draft"},po=[ho,uo],mo={caption:"A control circuit: every switch in the series string must close for the contactor to pull in",nodes:[{id:"xfmr",kind:"controller",label:"Transformer",sublabel:"24 V",col:0,row:1},{id:"tstat",kind:"thermostat",label:"Thermostat",sublabel:"Y call",col:1,row:1},{id:"hps",kind:"sensor",label:"High press.",sublabel:"safety",col:2,row:1},{id:"lps",kind:"sensor",label:"Low press.",sublabel:"safety",col:3,row:1},{id:"coil",kind:"controller",label:"Contactor",sublabel:"coil",col:4,row:1}],links:[{from:"xfmr",to:"tstat"},{from:"tstat",to:"hps"},{from:"hps",to:"lps"},{from:"lps",to:"coil"}]},fo={id:"hvac.lesson.5.basics",track:"hvac",domain:"5.0",order:1,title:"Ohm's law and reading a circuit",summary:"Most no-cool calls turn out to be electrical. The meter is faster than the gauges, and this is how you use it.",minutes:7,sections:[{kind:"keyNumbers",heading:"The four relationships",items:[{label:"Voltage",value:"E = I × R",note:"Volts"},{label:"Current",value:"I = E ÷ R",note:"Amps"},{label:"Resistance",value:"R = E ÷ I",note:"Ohms"},{label:"Power",value:"P = E × I",note:"Watts, for a resistive load"},{label:"Series resistance",value:"R₁ + R₂ + R₃",note:"They add"},{label:"Two in parallel",value:"(R₁ × R₂) ÷ (R₁ + R₂)",note:"Always less than the smaller one"}]},{kind:"prose",heading:"Series and parallel, and why equipment is wired the way it is",body:`**Safety controls go in series** with the load. A series string is an AND: high-pressure switch AND low-pressure switch AND float switch all have to be closed. Any one opening stops the load, which is exactly what a safety chain is for.

**Loads go in parallel**, so each sees full supply voltage and operates independently. The blower does not care whether the compressor is running.

This is not trivia — it is what makes voltage-drop troubleshooting work.`},{kind:"diagram",topology:mo},{kind:"worked",heading:"Worked example: finding the open switch",problem:`A 24 V control circuit has four safety switches in series with a contactor coil. The contactor will not pull in.

You measure across each switch in turn and get: 0 V, 0 V, 24 V, 0 V.

What have you found?`,steps:[{action:"Recall what voltage across a CLOSED switch should be. A closed switch has almost no resistance.",result:"Almost 0 V — voltage divides by resistance, and there is nearly none."},{action:"Recall what voltage across an OPEN switch should be. An open switch is effectively infinite resistance.",result:"The FULL supply voltage appears across it."},{action:"Apply that to the readings.",result:"Switches 1, 2 and 4 are closed. Switch 3 has all 24 V across it."}],answer:"Switch 3 is open, and it is the one interrupting the circuit.",moral:'This test is done live, in place, with nothing disconnected — which is why it beats resistance testing in the field. The next question is *why* it is open: a genuine fault it is protecting against, or a failed switch. Jumping it out to "test" is how equipment gets destroyed and people get hurt.'},{kind:"prose",heading:"The low-voltage control idea",body:`A thermostat never switches 240 V. It switches 24 V to a **contactor coil**, and the contactor does the real work of connecting the high-voltage load.

A small, safe signal controls a large, dangerous one. Everything in the control circuit follows this pattern.

That is why control-circuit troubleshooting usually starts at the transformer. No 24 V on the secondary means nothing downstream can operate, and it is a two-second check.`},{kind:"table",heading:"Thermostat terminals",columns:["Terminal","What it does"],rows:[["R","24 V hot from the transformer"],["C","Common — the return side of the 24 V circuit"],["Y","Cooling call → compressor contactor"],["G","Indoor blower"],["W","Heat call"],["O/B","Reversing valve on a heat pump (O = energised in cooling, B = in heating)"]],note:'These are conventions, not a standard. Always check the diagram on the equipment. C is the one causing most modern trouble — Wi-Fi thermostats need it for continuous power, and "the new thermostat keeps dropping offline" is very often a missing common wire.'}],source:c.standard("Ohm's law; series and parallel circuit behaviour"),status:"verified"},go={id:"hvac.lesson.5.motors",track:"hvac",domain:"5.0",order:2,title:"Motors, capacitors and what fails",summary:"Winding tests, capacitor tolerance, and reading a locked-rotor condition.",minutes:6,sections:[{kind:"prose",heading:"Testing a single-phase compressor",body:`Three terminals: Common, Start and Run. The two windings share the common terminal, so measuring Run to Start puts them in series.

The relationship is always: **R–S = (C–R) + (C–S)**. The largest reading equals the sum of the other two.

That also identifies unmarked terminals. The highest reading is between run and start, so the terminal *not* involved in it is common. Of the remaining two, the one with higher resistance to common is start — more turns of finer wire — and the lower is run.

If the numbers do not add up, a winding is damaged. Also check each terminal to the shell: any continuity to ground means the compressor is grounded and must be replaced.`},{kind:"keyNumbers",heading:"Capacitor facts",items:[{label:"Run capacitor tolerance",value:"±6%",note:"Outside this, replace it"},{label:"Dual capacitor terminals",value:"C, HERM, FAN",note:"Test each half separately"},{label:"Start capacitor duty",value:"Seconds only",note:"Switched out after start"},{label:"Discharge tool",value:"20 kΩ, 2 W resistor",note:"Never a screwdriver"}]},{kind:"callout",tone:"trap",heading:"Weak capacitors do not fail cleanly",body:`A capacitor that has drifted out of tolerance still lets the motor *try* to start. It draws locked-rotor current, heats up, and trips its overload. The symptom is intermittent hard-starting, not a dead unit.

So "it works sometimes" points at a capacitor far more often than at a failing motor. Measure it — a capacitance meter reading against the rating settles it in seconds, and a capacitor is a fraction of the cost of a compressor.`},{kind:"worked",heading:"Worked example: hums and trips",problem:`A compressor hums for a few seconds, draws very high current, then trips its overload. Line voltage at the contactor is correct.

What is going on, and what do you check?`,steps:[{action:'Interpret "hums with very high current". The motor is energised but not turning.',result:"Locked rotor."},{action:"With good voltage at the terminals, list what could prevent rotation.",result:"Either it cannot produce starting torque, or it physically cannot turn."},{action:"Rank those by likelihood and cost to test.",result:"Run capacitor first — cheap, quick, and far more common than a seized compressor."},{action:"If the capacitor is good, try a hard-start kit as a diagnostic.",result:"Starts with one → weak but alive. Still will not turn → seized."}],answer:"Test the run capacitor first, then the compressor windings and a hard-start kit.",moral:"Note what this rules OUT. Neither refrigerant charge nor airflow can cause a locked rotor. Both affect how well a *running* compressor performs, not whether it can start."},{kind:"callout",tone:"warning",heading:"Discharge before you touch",body:`A capacitor stores energy independently of the supply. Opening the disconnect does not empty it, and a large run capacitor holds enough to injure you.

Discharge deliberately through a resistor. Shorting with a screwdriver does dump the charge, but as an arc — that is how people end up with burns and pitted tools. On a dual capacitor, discharge HERM-to-C and FAN-to-C separately.`}],source:c.todo("Confirm the winding test and capacitor tolerances against your text."),status:"draft"},wo=[fo,go],yo={caption:"Total external static: both probes, both magnitudes added",nodes:[{id:"ret",kind:"damper",label:"Return",sublabel:"filter rack",col:0,row:1},{id:"p1",kind:"sensor",label:"Probe 1",sublabel:"reads −",col:1,row:1},{id:"ahu",kind:"blower",label:"Air handler",sublabel:"rated 0.50",col:2,row:1},{id:"p2",kind:"sensor",label:"Probe 2",sublabel:"reads +",col:3,row:1},{id:"sup",kind:"damper",label:"Supply",col:4,row:1}],links:[{from:"ret",to:"p1"},{from:"p1",to:"ahu"},{from:"ahu",to:"p2"},{from:"p2",to:"sup"}]},bo={id:"hvac.lesson.6.airflow",track:"hvac",domain:"6.0",order:1,title:"Airflow: the half of the job that gets skipped",summary:"A perfectly charged system can still fail to cool a house. Static pressure is how you find out why.",minutes:8,sections:[{kind:"prose",body:`Refrigerant gets all the attention, and airflow causes more callbacks. A system starved of air looks, on the gauges, a lot like several other faults — so the air-side numbers are what separate them.

The design target is **400 CFM per ton**, with 350–450 as the working band.

Where you aim inside that band depends on climate. Below 400 the coil runs colder and pulls more moisture out, which suits a humid climate. Above 400 gives more sensible capacity and less dehumidification, which suits a dry one.

Outside the band things break. Too little air and the coil ices. Too much and the coil never gets cold enough to condense, so the house hits setpoint and still feels clammy.`},{kind:"keyNumbers",heading:"The numbers",items:[{label:"Design airflow",value:"400 CFM/ton",note:"350–450 acceptable"},{label:"Typical AHU rating",value:"0.50 in. w.c.",note:"Total external static"},{label:"CFM from velocity",value:"CFM = fpm × ft²",note:""},{label:"Friction rate",value:"FR = (static × 100) ÷ TEL",note:"For the duct calculator"},{label:"CFM from capacity",value:"CFM = Qs ÷ (1.08 × ΔT)",note:"Sensible equation rearranged"}]},{kind:"diagram",topology:yo},{kind:"worked",heading:"Worked example: total external static",problem:`A manometer reads −0.38 in. w.c. in the return plenum and +0.42 in. w.c. in the supply.

The air handler is rated for 0.50 in. w.c. What is the TESP, and what does it tell you?`,steps:[{action:"Ask why the return reads negative.",result:"The blower is pulling on it. The supply is positive because it is being pushed."},{action:"Decide whether to add the signed values or their magnitudes. Both represent work the blower is doing.",result:"Magnitudes. Adding signed values would cancel most of the reading."},{action:"Add them.",result:"0.38 + 0.42 = 0.80 in. w.c."},{action:"Compare against the rating.",result:"0.80 is 60% above the 0.50 rating."}],answer:"0.80 in. w.c. — well past rating. Airflow will be substantially below design no matter how the equipment is charged.",moral:'Adding the signed numbers gives 0.04 and makes a severely restricted system look perfect. This is the mistake to never make. TESP is the measurement that catches undersized ductwork, which is why a "the equipment is fine" call so often turns out not to be.'},{kind:"table",heading:"The three fan laws",columns:["Quantity","Varies with","Speed +25% gives"],rows:[["Airflow (CFM)","RPM — directly","+25%"],["Static pressure","RPM² — the square","+56%"],["Brake horsepower","RPM³ — the cube","+95%"]],note:"Doubling airflow costs eight times the power. This is why speeding a blower up is a poor answer to an airflow complaint — the duct is the restriction, and the motor pays for it."},{kind:"callout",tone:"trap",heading:"ECM blowers hide duct problems",body:`A PSC motor turns at roughly fixed speed: raise the resistance and it simply moves less air, which shows up in the temperature drop.

A constant-airflow ECM measures torque and speeds up to hold its CFM target. Airflow stays right while the motor works harder and harder until it hits its limit or fails early.

So on an ECM system you **cannot** infer duct health from the temperature drop. Measure static pressure directly. A high reading with correct airflow still means the ducts are undersized and the motor is paying.`},{kind:"prose",heading:"Equivalent length, and why short runs can behave like long ones",body:`Fittings cause far more pressure drop than straight duct, so duct design converts them into the length of straight duct that would cost the same. A hard 90° elbow might be worth 30 or 40 feet.

That is why a physically short run full of turns behaves like a very long one, and why duct design cannot be done with a tape measure alone.

Total equivalent length feeds the friction rate, which is the number the duct calculator actually needs.`},{kind:"callout",tone:"tip",heading:"Filters: the answer is area, not rating",body:`Finer media captures more and costs more pressure drop. In a 1-inch slot there is very little media area to spread that across, so a high-MERV 1-inch filter can add several tenths of static on its own.

A 4- or 5-inch media cabinet holds vastly more surface, achieving the same filtration at a fraction of the pressure drop — and loading far more slowly between changes.`}],source:c.todo("Confirm the airflow targets and duct design guidance against your text or ACCA Manual D."),status:"draft"},vo=[bo],ko={id:"hvac.lesson.7.chart",track:"hvac",domain:"7.0",order:1,title:"Air with water in it",summary:"Six properties, any two of which fix the rest. This is what lets you explain why a house at setpoint still feels wrong.",minutes:8,sections:[{kind:"prose",body:`Psychrometrics is the study of moist air, and it is where comfort complaints get explained. A system that satisfies the thermostat and leaves the house clammy is not doing enough **latent** work — and none of that is visible on a thermometer.

There are six properties. Any two independent ones fix the point on the chart, and everything else follows. That is why a sling psychrometer is such a useful instrument: dry bulb and wet bulb are two readings from one tool.`},{kind:"table",heading:"The six properties",columns:["Property","What it measures","Units"],rows:[["Dry bulb","Temperature as an ordinary thermometer reads it","°F"],["Wet bulb","Temperature with evaporative cooling — total heat content","°F"],["Dew point","Where this air would begin to condense","°F"],["Relative humidity","How close to saturation, at its current temperature","%"],["Humidity ratio","Actual mass of water per pound of dry air","grains/lb"],["Enthalpy","Total heat — sensible and latent together","Btu/lb"]]},{kind:"callout",tone:"trap",heading:"Relative humidity is relative to temperature",body:`Heat air without adding any water and RH **falls**, even though there is exactly as much water in it. Cool it and RH rises. The moisture never changed.

Dew point and grains measure the *actual* moisture, so they do not move when you only change temperature. That is why the trade talks in grains and dew point when it matters, and why "the humidity is 60%" is an ambiguous statement without a temperature attached.`},{kind:"prose",heading:"The dry-bulb / wet-bulb gap",body:`A wet-bulb thermometer has a wet sock over it. Water evaporates off the sock, which cools it — and how much it cools depends on how much more moisture the surrounding air can accept.

Dry air: lots of evaporation, big drop, wide gap between dry bulb and wet bulb.

Saturated air: no evaporation possible, no drop. Dry bulb, wet bulb and dew point are all the same number.

So the gap between dry bulb and wet bulb is a direct read on how dry the air is. That is the whole principle of the instrument.`},{kind:"keyNumbers",heading:"The four heat formulas",items:[{label:"Sensible",value:"Qs = 1.08 × CFM × ΔT",note:"Dry bulb difference"},{label:"Latent",value:"Ql = 0.68 × CFM × Δgrains",note:"Moisture difference"},{label:"Total",value:"Qt = 4.5 × CFM × Δh",note:"Enthalpy difference — covers both"},{label:"Water",value:"Q = 500 × GPM × ΔT",note:"Hydronic loops"},{label:"Sensible heat ratio",value:"SHR = Qs ÷ Qt",note:"Share doing temperature work"}]},{kind:"prose",heading:"Where the constants come from",body:`They are not magic numbers. Each is minutes per hour × a density × a specific heat.

For air: 60 min/h × 0.075 lb/ft³ × 0.24 Btu/lb·°F = **1.08**.

For water: 60 min/h × 8.33 lb/gal × 1.0 Btu/lb·°F = **500**.

Because the air constants depend on density, they shrink at altitude. At 5,000 ft the 1.08 is closer to 0.90, and using the sea-level number overstates capacity by around 17%. A Denver job genuinely does not behave like the same equipment in Houston.`},{kind:"worked",heading:"Worked example: how much of the work is latent?",problem:`A coil moves 1,200 CFM. Air enters at 78°F DB / 65°F WB and leaves at 57°F DB / 56°F WB.

Entering enthalpy is 30.1 Btu/lb, leaving is 23.8 Btu/lb.

Find total capacity, sensible capacity, latent capacity and the sensible heat ratio.`,steps:[{action:"Total heat first, from the enthalpy difference. Qt = 4.5 × CFM × Δh",result:"4.5 × 1,200 × (30.1 − 23.8) = 4.5 × 1,200 × 6.3 = 34,020 Btu/h"},{action:"Sensible heat from the dry bulb difference. Qs = 1.08 × CFM × ΔT",result:"1.08 × 1,200 × (78 − 57) = 1.08 × 1,200 × 21 = 27,216 Btu/h"},{action:"Latent is whatever is left over. Ql = Qt − Qs",result:"34,020 − 27,216 = 6,804 Btu/h"},{action:"SHR = sensible ÷ total",result:"27,216 ÷ 34,020 = 0.80"}],answer:"Total 34,020 · Sensible 27,216 · Latent 6,804 · SHR 0.80",moral:"A fifth of this coil's capacity is doing work no thermometer can see. That latent portion is what makes a house feel comfortable rather than merely cool — and it is the first thing lost when airflow is set too high."},{kind:"callout",tone:"tip",heading:"The humid-house fix is counter-intuitive",body:`House hits setpoint but feels damp, charge and static check out, airflow measures 440 CFM/ton? **Reduce** airflow toward 350.

Less air over the same coil means less heat arriving to boil the refrigerant, so the coil runs colder — further below the air's dew point, condensing more water out.

More airflow feels like it should help and does the opposite: it raises coil temperature, pushes SHR toward 1.0, and the system stops dehumidifying while still hitting temperature.

The limit is real though — go too low and the coil ices. 350 CFM/ton is the bottom of the band for that reason, and you verify superheat afterwards.`}],source:c.standard("ASHRAE Handbook — Fundamentals, Chapter 1 (Psychrometrics)"),status:"verified"},To=[ko],xo={caption:"The safety chain: each step must prove itself before the next is allowed",nodes:[{id:"tstat",kind:"thermostat",label:"W call",col:0,row:1},{id:"ind",kind:"fan",label:"Inducer",sublabel:"purge",col:1,row:1},{id:"ps",kind:"sensor",label:"Pressure sw.",sublabel:"proves draft",col:2,row:1},{id:"ign",kind:"controller",label:"Igniter",sublabel:"heats up",col:3,row:1},{id:"gas",kind:"metering",label:"Gas valve",sublabel:"opens",col:4,row:1},{id:"flame",kind:"sensor",label:"Flame sensor",sublabel:"proves flame",col:5,row:1}],links:[{from:"tstat",to:"ind"},{from:"ind",to:"ps"},{from:"ps",to:"ign"},{from:"ign",to:"gas"},{from:"gas",to:"flame"}]},Co={id:"hvac.lesson.8.furnace",track:"hvac",domain:"8.0",order:1,title:"Combustion and the furnace sequence",summary:"Every step in a furnace start-up exists to prove something before the next step is allowed. Learn the chain and most no-heat calls diagnose themselves.",minutes:8,sections:[{kind:"prose",body:`Combustion needs three things: **fuel, oxygen, heat**. Remove any one and it stops — which is the basis of every safety control on a fired appliance.

Complete combustion of natural gas produces carbon dioxide and water vapour. **Incomplete** combustion, usually from insufficient air, produces carbon monoxide. That is what makes combustion air a life-safety issue rather than an efficiency one.`},{kind:"keyNumbers",heading:"Fuel numbers",items:[{label:"Natural gas heating value",value:"≈1,000 BTU/ft³",note:"Verify with the utility"},{label:"Natural gas manifold",value:"≈3.5 in. w.c.",note:"Check the data plate"},{label:"Propane heating value",value:"≈2,500 BTU/ft³",note:"Much denser"},{label:"Propane manifold",value:"≈11 in. w.c.",note:"Not interchangeable with NG"},{label:"Thermocouple output",value:"25–30 mV",note:"In the pilot flame"}]},{kind:"diagram",topology:xo},{kind:"prose",heading:"The sequence, and why it is in that order",body:`1. **Thermostat closes** on a call for heat.
2. **Inducer starts** and purges the heat exchanger of any residual gas.
3. **Pressure switch proves** the inducer is actually moving air, and closes.
4. **Igniter energises** and reaches ignition temperature.
5. **Gas valve opens** and the burners light.
6. **Flame sensor proves flame** within the trial-for-ignition period.
7. **Blower starts** after the fan-on delay.
8. On satisfying the thermostat, **gas valve closes** and the blower runs out its off delay.

Every step is a proof. The inducer proves itself through the pressure switch *before* gas is introduced, so gas never enters without a proven path for the flue products. The igniter is hot *before* the valve opens, so gas never accumulates unlit.

The blower delays are comfort and efficiency: on-delay stops it blowing cold air, off-delay scavenges the remaining heat out of the exchanger.`},{kind:"worked",heading:"Worked example: lights, then drops out",problem:`A furnace lights, runs about five seconds, shuts off, retries twice more, then locks out.

Where in the sequence is it failing?`,steps:[{action:"Note what succeeded. The burners lit at all.",result:"Steps 1–5 all worked: thermostat, inducer, pressure switch, igniter, gas valve."},{action:"Note what failed. It shut down a few seconds after lighting, and retried.",result:"Step 6 — flame proving. The board did not see flame, so it closed the valve."},{action:"Recall how flame proving works. Rectification passes microamps from the sensor through the flame to the grounded burner.",result:'Anything blocking that tiny current looks like "no flame".'},{action:"List what blocks it.",result:"Oxide film on the sensor, or a poor burner ground."}],answer:"Flame proving. Clean the flame sensor with fine abrasive and confirm the burner ground. A microamp reading tells you definitively.",moral:'One observation — "it lights then drops out" — eliminated five of the six steps. That is what knowing the sequence buys you.'},{kind:"prose",heading:"Condensing furnaces",body:`Burning gas produces water vapour, and that vapour carries a lot of latent heat. A conventional furnace sends it up the flue still as vapour, and the heat goes with it.

A condensing furnace adds a **second heat exchanger** that drops flue gas below its dew point. The vapour condenses, releasing its latent heat into the airstream — which is what takes AFUE past 90%.

The consequences are practical. The condensate is mildly acidic, so the secondary exchanger is stainless or aluminium and the drain must be handled properly. Flue gas is cool enough to vent in PVC — and it *must* be, since it will not rise up a masonry chimney.`},{kind:"callout",tone:"tip",heading:"The most common condensing-furnace no-heat call",body:`A blocked condensate drain. The water backs up, the pressure switch senses it, and the furnace refuses to run.

It presents as a furnace that will not start, and the fix is a drain cleaning. Check it before you get deep into the sequence.`},{kind:"table",heading:"Vent categories",columns:["Category","Vent pressure","Condensing?","Typical"],rows:[["I","Negative","No","Natural draft, most induced draft"],["II","Negative","Yes","Uncommon"],["III","Positive","No","Some commercial"],["IV","Positive","Yes","High-efficiency furnaces in PVC"]],note:"Two variables give four combinations. A Category I appliance relies on buoyancy and needs a vent that will draft. A Category IV is pushed by its inducer and its vent must be sealed, because it is under positive pressure inside a living space."},{kind:"callout",tone:"warning",heading:"Backdrafting",body:`Exhaust fans remove air from a house, and that air has to be replaced. In a tight house with a natural-draft appliance in a sealed closet, the path of least resistance can be **back down the flue** — reversing the draft and spilling combustion products, including carbon monoxide, into the space.

The test is a worst-case depressurisation check: run every exhaust appliance in the house and confirm the flue still drafts.

This is why combustion air openings are sized and required, and why sealed-combustion appliances that draw their air directly from outdoors are the modern answer.`}],source:c.todo("Confirm the sequence, fuel values and vent categories against your text and the applicable fuel gas code."),status:"draft"},Ao=[Co],So={caption:"Heating mode: the reversing valve has swapped which coil gets the hot gas",nodes:[{id:"comp",kind:"compressor",label:"Compressor",col:0,row:1},{id:"rv",kind:"metering",label:"Reversing valve",col:1,row:1},{id:"indoor",kind:"condenser",label:"Indoor coil",sublabel:"CONDENSER now",col:2,row:0},{id:"outdoor",kind:"evaporator",label:"Outdoor coil",sublabel:"EVAPORATOR now",col:2,row:2},{id:"meter",kind:"metering",label:"Metering",col:3,row:1}],links:[{from:"comp",to:"rv"},{from:"rv",to:"indoor",label:"hot gas"},{from:"indoor",to:"meter"},{from:"meter",to:"outdoor"},{from:"outdoor",to:"rv",label:"cool vapour"}]},Ro={id:"hvac.lesson.9.heatpumps",track:"hvac",domain:"9.0",order:1,title:"One system, running the cycle both ways",summary:"A heat pump is an air conditioner with a valve that swaps the coils. Everything odd about them follows from that.",minutes:7,sections:[{kind:"prose",body:`A heat pump is the same vapour-compression cycle you already know, plus a **reversing valve** that changes which coil receives the hot discharge gas.

In cooling, the indoor coil evaporates and the outdoor coil condenses — an ordinary air conditioner. In heating, the valve swaps them: the indoor coil condenses, rejecting heat into the house, while the outdoor coil evaporates, absorbing heat from outdoor air.

This is why heat pump literature says "indoor coil" and "outdoor coil" instead of "evaporator" and "condenser". Those words describe what a coil is *doing right now*, not where it is mounted.`},{kind:"diagram",topology:So},{kind:"callout",tone:"tip",heading:"How does a cold coil absorb heat from cold air?",body:`It sounds impossible that a coil outdoors in 30°F weather absorbs heat from 30°F air. But heat only has to move from warmer to cooler — and the refrigerant inside is boiling at perhaps 15°F.

Relative to 15°F refrigerant, 30°F air is a heat source. There is plenty of heat in cold air; you just need something colder to move it into.

Capacity falls as it gets colder outside because that temperature difference shrinks. That is the whole reason a balance point exists.`},{kind:"prose",heading:"Defrost",body:`In heating, the outdoor coil runs below freezing and accumulates frost, which blocks airflow and kills capacity. Defrost clears it — using the system itself.

The unit **switches to cooling**, sending hot discharge gas to the outdoor coil, which melts the frost from the inside out. The **outdoor fan stops**, so cold air is not blowing across the coil it is trying to warm.

But the indoor coil is now absorbing heat — cooling the house. So **auxiliary heat runs** during defrost to temper the supply air.

Steam rising off an outdoor unit in winter is normal defrost, not a fault. What is worth investigating is a unit defrosting far too often, or one that never does and ices solid.`},{kind:"table",heading:"Auxiliary versus emergency heat",columns:["","Auxiliary heat","Emergency heat"],rows:[["Compressor","Still running","Locked off"],["When","Automatic, when the heat pump cannot keep up","Manual selection"],["Purpose","Makes up the shortfall on a cold day","For when the heat pump has failed"],["Cost","Moderate — supplementing","High — resistance heat only"]],note:"A customer who left the thermostat in emergency heat all winter and then complains about the bill is a genuinely common call."},{kind:"prose",heading:"Balance point",body:`Two lines cross. Building heat loss **rises** as it gets colder outside. Heat pump capacity **falls**, because the outdoor coil has less temperature difference to work with.

Where they meet is the **balance point** — the outdoor temperature at which the heat pump exactly meets the load.

Below it, auxiliary heat has to make up the difference. Above it, the heat pump alone is enough and any aux operation is waste.

A typical residential balance point falls somewhere around 30–35°F, though it depends entirely on the building and equipment. Knowing it is what lets you judge whether the aux heat you are seeing is normal for the weather or a symptom.`},{kind:"callout",tone:"trap",heading:"O versus B, and inverted modes",body:`If a heat pump blows cold when you call for heat and warm when you call for cooling, the modes are exactly **inverted**. That points at reversing valve control, not the refrigerant circuit — a charge or airflow problem degrades performance, it does not swap heating and cooling.

O energises the valve in cooling. B energises it in heating. A thermostat configured for the wrong one gives precisely this symptom, and it is a very common error after a thermostat replacement.`},{kind:"callout",tone:"warning",heading:"Do not charge a heat pump in heating mode",body:`In heating, the outdoor coil is the evaporator, and its performance swings with outdoor temperature, humidity, frost accumulation and where the unit sits in its defrost cycle. The readings move around far too much to charge against.

Charge in **cooling mode** where the charts apply, or recover, evacuate and **weigh in** the nameplate charge with the line-set adjustment — which is accurate regardless of weather and is the right answer in winter.

Some units have a specific heating-mode procedure with its own chart. Where one exists, it takes precedence.`}],source:c.todo("Confirm the heat pump operation, defrost and charging guidance against your text."),status:"draft"},Fo=[Ro],qo={id:"hvac.lesson.10.method",track:"hvac",domain:"10.0",order:1,title:"Working a call instead of guessing",summary:"Everything so far, applied. The skill is choosing which three readings settle it — not taking all thirteen.",minutes:9,sections:[{kind:"prose",body:`Troubleshooting is not a mystery. It is a loop: observe, form a theory, take the reading that would confirm or kill it, repeat.

What separates a good technician from a parts-changer is **which reading they take next**. Everyone can measure everything eventually. The skill is knowing that a filter inspection and a temperature drop will settle this particular call in four minutes.`},{kind:"prose",heading:"Order your checks by information per minute",body:`Visual checks cost seconds and settle a surprising share of calls outright. A filter you cannot see light through. A stationary outdoor fan. A thermostat in the wrong mode. None of these need a gauge.

Connecting gauges is **not free**. It takes time, it releases a little refrigerant every time you connect and disconnect, and it can introduce air or contamination. Do it when you have a refrigerant-side question that needs answering — not as a reflex.

And talk to the customer first. "It started after the storm", "only in the afternoon", "someone was out last month" each narrow the field enormously, and cost nothing.`},{kind:"callout",tone:"tip",heading:"The single highest-value cross-check",body:`Suction pressure is low. That is consistent with a **low charge** and with **low airflow**, and the gauges cannot tell them apart.

The air-side temperature drop can, and it moves in opposite directions:

**Low charge** → less refrigerant to absorb heat → the air gives up less → drop is **LOW**, often under 15°F.

**Low airflow** → the air that does get through spends longer against a colder coil → drop is **HIGH**, often over 25°F.

One thermometer at the return, one at the supply. Two minutes, and it eliminates half the possibilities.`},{kind:"table",heading:"The full signature table",columns:["Fault","Suction","Head","Superheat","Subcool","Amps","Air ΔT"],rows:[["Undercharge","low","low","HIGH","LOW","low","low"],["Restriction","low","low-norm","HIGH","HIGH","low","low"],["Overcharge","high","high","low","HIGH","high","low"],["Dirty condenser","high","HIGH","normal","norm-high","high","low"],["Condenser fan out","high","V.HIGH","normal","high","high","low"],["Low evap airflow","low","low","low","norm-high","low","HIGH"],["Bad compressor","HIGH","LOW","high","low","LOW","low"],["Non-condensables","normal","high","normal","high","high","low"],["TXV overfeeding","high","normal","≈ZERO","low","high","low"]],note:"Read across, not down. No single column identifies a fault; the pattern across the row does."},{kind:"prose",heading:"Three patterns worth memorising",body:`**Pressures converging** — suction high AND head low — is the compressor not pumping. Nearly every other fault pushes the two pressures apart. Confirm with amps well below RLA.

**High superheat** is ambiguous by itself; subcooling resolves it. Low subcooling means undercharge, high subcooling means restriction.

**High condenser split with a clean coil** is non-condensables, especially after a recent repair. The contradiction is the clue: heat is not leaving, but there is no physical reason for that.`},{kind:"worked",heading:"Worked example: reasoning through a call",problem:`Complaint: "not cooling well, has been getting worse for two weeks."

You look first: filter is clean, condenser coil is clean, outdoor fan running.
Gauges: suction low, head low.
Air: return 76°F, supply 64°F.

What is it, and what one more reading would confirm it?`,steps:[{action:"Compute the temperature drop and judge it.",result:"76 − 64 = 12°F. That is LOW — expect around 20°F."},{action:"Low suction with a LOW temperature drop. Use the cross-check.",result:"Rules OUT low airflow, which would give a HIGH drop. Points at the refrigerant side."},{action:"Low suction and low head together, with a clean condenser. Narrow the candidates.",result:"Undercharge or restriction — both starve the evaporator."},{action:"Recall what separates those two.",result:"Subcooling. Undercharge → LOW. Restriction → HIGH."},{action:'Note the timeline too. "Getting worse over two weeks" fits a developing leak better than a sudden blockage.',result:"Leans undercharge, but subcooling decides it."}],answer:"Take liquid line temperature and compute subcooling. Low subcooling → undercharge, find the leak. High subcooling → restriction, do not add refrigerant.",moral:"Five readings and two calculations. No parts guessed at. Note also that the visual checks at the start eliminated three faults before the gauges came out of the van."},{kind:"callout",tone:"warning",heading:"Fix the cause, not the symptom",body:`A contactor with burnt contacts is a symptom. Find out *why* — a compressor drawing locked-rotor current because its capacitor is weak — or you will be back.

A capacitor that failed from heat, next to a condenser running high head pressure, will fail again in a year. The high head pressure is the real fault.

And never add refrigerant "while you are there" to a system that did not need it. That is the single most common way a repair visit makes a system worse.`},{kind:"prose",heading:"Document, every time",body:`One set of readings tells you whether a system is within its bands. Two sets, a year apart, tell you which **direction** it is heading — which is far more useful.

Subcooling drifting from 10°F to 6°F over a season is a leak you can catch before the customer loses cooling in August. Amps creeping up year over year is a compressor going. Neither is visible from a single visit.

It also protects you. When somebody claims a system was fine before you touched it, a documented set of readings from the day you arrived is the answer.`}],source:c.todo("Confirm the diagnostic method and signature table against your service text."),status:"draft"},$o=[qo],Io=[...ao,...no,...lo,...po,...wo,...vo,...To,...Ao,...Fo,...$o],P={track:"n10-009",domain:"1.0"},Mo={...P,id:"n10-009.1.1.osi-order",objective:"1.1",kind:"order",difficulty:1,prompt:"Put the OSI layers in order, layer 1 at the top.",steps:["Physical","Data Link","Network","Transport","Session","Presentation","Application"],explain:"Bottom to top: Physical, Data Link, Network, Transport, Session, Presentation, Application. Data moves down the stack on the way out and up on the way in, gaining and shedding a header at each layer.",source:c.standard("ISO/IEC 7498-1, OSI Basic Reference Model"),status:"verified"},Po={...P,id:"n10-009.1.1.pdu-names",objective:"1.1",kind:"match",difficulty:2,prompt:"Match each OSI layer to the name of its protocol data unit.",pairs:[["Layer 1 — Physical","Bits"],["Layer 2 — Data Link","Frames"],["Layer 3 — Network","Packets"],["Layer 4 — Transport","Segments (TCP) or datagrams (UDP)"]],explain:"The unit name tells you which header you are looking at. A frame carries MAC addresses, a packet carries IP addresses, a segment carries ports. Naming the unit correctly is often the fastest way to work out which device in the path is responsible for a fault.",source:c.standard("ISO/IEC 7498-1 §5.6"),status:"verified"},Wo={...P,id:"n10-009.1.1.switch-layer",objective:"1.1",kind:"choice",difficulty:1,prompt:`An unmanaged switch forwards traffic by looking up the destination address in its MAC address table.

At which OSI layer is it operating?`,choices:["Layer 1 — Physical","Layer 2 — Data Link","Layer 3 — Network","Layer 4 — Transport"],answer:1,whyWrong:{0:"A hub or a repeater is layer 1 — it copies electrical signals without reading any address.",2:"Layer 3 forwarding means reading IP addresses, which is what a router or an L3 switch does.",3:"Layer 4 means making decisions on port numbers, as a firewall or load balancer does."},explain:"MAC addresses live in the frame header, which is layer 2. A switch that also reads IP headers to route between VLANs is described as a layer 3 switch, but plain MAC-based forwarding is layer 2.",source:c.standard("IEEE 802.1D, MAC Bridges"),status:"verified"},Eo={...P,id:"n10-009.1.2.reverse-proxy",objective:"1.2",kind:"choice",difficulty:2,prompt:`A company wants TLS terminated centrally, and wants inbound web requests spread across four identical application servers without exposing those servers directly.

Which appliance role fits?`,choices:["Reverse proxy","Forward proxy","NAT gateway","Layer 2 switch"],answer:0,whyWrong:{1:"A forward proxy sits in front of clients heading outbound, controlling and caching what users reach.",2:"NAT rewrites addresses but does not terminate TLS or distribute load across a server pool.",3:"A layer 2 switch has no visibility of TLS or HTTP."},explain:'A reverse proxy sits in front of servers and accepts connections on their behalf: it terminates TLS, hides the real server addresses, and can balance across a pool. A forward proxy is the mirror image — it sits in front of clients. "Which side is it protecting" is the question that separates the two.',source:c.todo("Confirm against the load balancer / proxy section of your study guide."),status:"draft"},jo={...P,id:"n10-009.1.4.traffic-types",objective:"1.4",kind:"match",difficulty:2,prompt:"Match each traffic type to what it describes.",pairs:[["Unicast","One sender to one specific recipient"],["Broadcast","One sender to every host on the segment"],["Multicast","One sender to a subscribed group of recipients"],["Anycast","One sender to the nearest of several identical destinations"]],explain:"Broadcast stops at the router — that boundary is what makes a broadcast domain. Multicast needs group membership (IGMP on IPv4) so switches do not flood it everywhere. Anycast is how public DNS resolvers answer from whichever site is closest, with the same address advertised from many places.",source:c.standard("RFC 1112 (multicast), RFC 4786 (anycast)"),status:"verified"},Oo={...P,id:"n10-009.1.4.dns-records",objective:"1.4",kind:"match",difficulty:2,prompt:"Match each DNS record type to its purpose.",pairs:[["A","Maps a hostname to an IPv4 address"],["AAAA","Maps a hostname to an IPv6 address"],["CNAME","Points a name at another name"],["MX","Names the mail servers for a domain"],["PTR","Maps an address back to a hostname"],["TXT","Carries free-form text, used by SPF, DKIM and domain verification"]],explain:'The pair that catches people out is A versus AAAA — "quad-A" is IPv6, and the name is a reminder that an IPv6 address is four times the size of an IPv4 one. PTR lives in the reverse zone and is what mail servers check when deciding whether you look legitimate.',source:c.standard("RFC 1035 §3.3, RFC 3596 (AAAA)"),status:"verified"},Lo={...P,id:"n10-009.1.5.copper-distance",objective:"1.5",kind:"choice",difficulty:1,prompt:"What is the maximum specified length of a twisted-pair copper Ethernet run, from switch port to wall port to workstation?",choices:["55 metres","90 metres","100 metres","185 metres"],answer:2,whyWrong:{0:"55 m is the reduced distance for 10GBASE-T over Cat 6 rather than Cat 6a.",1:"90 m is the permanent link — the in-wall portion. Patch cords make up the remaining 10 m.",3:"185 m is 10BASE2 thin coaxial, long obsolete."},explain:'The 100 m channel is 90 m of horizontal cable in the walls plus up to 10 m of patch cords at both ends. When someone says "the run is only 92 m, it should be fine", that 10 m of patch leads is what they have forgotten.',source:c.standard("ANSI/TIA-568 series; IEEE 802.3 clause 40 for 1000BASE-T"),status:"verified"},No={...P,id:"n10-009.1.5.singlemode-vs-multimode",objective:"1.5",kind:"choice",difficulty:2,prompt:`A campus needs a 4 km fibre link between two buildings.

Which media and transceiver pairing is appropriate?`,choices:["Single-mode fibre with long-wavelength transceivers","Multimode OM3 fibre with short-wavelength transceivers","Cat 6a shielded copper","Multimode OM1 fibre with long-wavelength transceivers"],answer:0,whyWrong:{1:"Multimode is limited to a few hundred metres at 10 Gbps because of modal dispersion.",2:"Copper stops at 100 m regardless of category.",3:"Mixing a long-wavelength transceiver with multimode fibre is a mismatch, and OM1 is the shortest-reach multimode grade."},explain:"Single-mode has a core narrow enough (around 9 µm) that light travels one path, so it stays coherent over kilometres. Multimode has a wider core, cheaper optics, and modal dispersion that limits it to campus distances. The rule of thumb: inside a building, multimode; between buildings or across town, single-mode.",source:c.standard("ITU-T G.652 (single-mode); ISO/IEC 11801 OM designations"),status:"verified"},Ho={...P,id:"n10-009.1.5.t568b-pinout",objective:"1.5",kind:"order",difficulty:3,prompt:"Put the T568B pin assignments in order, pin 1 first.",steps:["White/Orange","Orange","White/Green","Blue","White/Blue","Green","White/Brown","Brown"],explain:"T568A and T568B differ only in that the orange and green pairs swap places. Either is fine as long as both ends of a patch cord match; a cable with A on one end and B on the other is a crossover. The blue pair stays on pins 4 and 5 in both standards.",source:c.standard("ANSI/TIA-568.2-D"),status:"verified"},Do={...P,id:"n10-009.1.6.three-tier",objective:"1.6",kind:"match",difficulty:2,prompt:"Match each layer of the three-tier hierarchical model to its job.",pairs:[["Access","Connects end devices; where PoE and port security live"],["Distribution","Aggregates access switches, routes between VLANs, applies policy"],["Core","Moves traffic between distribution blocks as fast as possible"]],explain:"The point of the split is that each layer has one job. Policy and filtering belong at distribution; putting access lists in the core slows down the one layer whose only purpose is speed.",source:c.todo("Confirm against the network architecture chapter of your study guide."),status:"draft"},Bo={...P,id:"n10-009.1.6.broadcast-domains",objective:"1.6",kind:"choice",difficulty:2,prompt:`A single switch has 24 ports, all in the default VLAN, with a PC on every port.

How many collision domains and broadcast domains are there?`,choices:["24 collision domains, 1 broadcast domain","1 collision domain, 24 broadcast domains","1 collision domain, 1 broadcast domain","24 collision domains, 24 broadcast domains"],answer:0,explain:"Every switch port is its own collision domain — that is the whole reason switches replaced hubs. Broadcasts, though, are flooded out of every port in the VLAN, so one VLAN is one broadcast domain. Splitting broadcast domains is what VLANs and routers are for.",source:c.standard("IEEE 802.1D; IEEE 802.3 clause 4 (CSMA/CD)"),status:"verified"},zo={...P,id:"n10-009.1.7.apipa-meaning",objective:"1.7",kind:"choice",difficulty:1,prompt:`A workstation reports an address of 169.254.88.13 with mask 255.255.0.0 and no default gateway.
